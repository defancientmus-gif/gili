<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Полка</title>
<!-- ПОЛКА — макет 01.11. Женя 01.11 02:2x: «Хочу отдельную свою ленту куда будет приходить контент…
     чтоб готовое уже было на блюдечке… Тренировки - тренировки. Питание - готовый модуль… чуть-ть ли не
     микроприложения». Четыре его настоящие ссылки, каждая — готовая вещь, а не рассуждение.
     Два вида рядом (лента / плитки) — выбор его кнопкой. Данные пока вписаны руками, в жизни их даст разбор Дома. -->
<style>
:root{
  --ink:#1F2442; --ink-m:rgba(31,36,66,.72); --ink-l:rgba(31,36,66,.46);
  --btn:#9CC3E6; --btn-ink:#072831; --btn-h:#B4D3EE; --acc:#2F6FA8;
  --card:rgba(255,255,255,.9); --row:rgba(31,36,66,.05);
  --mv:cubic-bezier(.22,1,.36,1);
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 var(--sys); color:var(--ink); min-height:100vh;
  background:oklch(.88 .04 228) url('gili-day-poster.jpg') center/cover fixed no-repeat;
  -webkit-font-smoothing:antialiased; padding-bottom:40px}
.шапка{position:sticky; top:0; z-index:5; padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;
  background:rgba(240,247,252,.55); backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.6)}
.шапка-ряд{display:flex; align-items:center; gap:12px; max-width:720px; margin:0 auto}
h1{margin:0; font-size:28px; letter-spacing:-.02em; font-weight:700; flex:1}
h1 small{display:block; font-size:13px; font-weight:500; color:var(--ink-m); letter-spacing:0; margin-top:1px}
.сегмент{display:flex; border-radius:14px; overflow:hidden; background:rgba(255,255,255,.7);
  box-shadow:inset 0 1.5px 1px -.5px #fff, 0 2px 10px rgba(40,80,120,.08)}
.сегмент button{border:0; background:none; font:600 13px var(--sys); color:var(--ink-m); padding:9px 14px; cursor:pointer}
.сегмент button[aria-pressed="true"]{background:var(--btn); color:var(--btn-ink)}
.сегмент button:focus-visible,.кн:focus-visible,.плитка:focus-visible{outline:2px solid var(--acc); outline-offset:2px}

main{max-width:720px; margin:0 auto; padding:14px 16px}
.лента{display:grid; gap:14px}
.карта{background:var(--card); border-radius:20px; padding:16px;
  box-shadow:inset 0 1.5px 1px -.5px #fff, 0 6px 24px rgba(40,80,120,.10)}
.вид{display:inline-flex; align-items:center; gap:6px; font:600 12px var(--sys); color:var(--acc)}
.вид i{font-style:normal; font-size:15px}
.карта h2{margin:4px 0 2px; font-size:20px; line-height:1.2; letter-spacing:-.01em}
.суть{margin:0 0 12px; color:var(--ink-m)}
.ряды{display:grid; gap:6px; margin:0 0 12px; padding:0; list-style:none}
.ряды li{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:16px; background:var(--row)}
.ряды b{font-weight:600}
.ряды small{display:block; color:var(--ink-l); font-size:13px}
.ряды .грань{margin-left:auto; font:600 12px var(--sys); color:var(--ink-m); white-space:nowrap}
.корешок{width:30px; height:42px; border-radius:4px 6px 6px 4px; flex:none;
  box-shadow:inset 3px 0 0 rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.4)}
.номер{width:30px; height:30px; border-radius:50%; flex:none; display:grid; place-items:center;
  background:#fff; font:700 14px var(--sys); color:var(--acc)}
.заметка{font-size:13px; color:var(--ink-m); margin:0 0 12px; padding-left:10px; box-shadow:inset 2px 0 0 var(--btn)}
.низ{display:flex; align-items:center; gap:10px}
.кн{border:0; border-radius:14px; background:var(--btn); color:var(--btn-ink); font:600 15px var(--sys);
  padding:12px 16px; white-space:nowrap; cursor:pointer; transition:transform .11s var(--mv), background .18s}
.кн:active{transform:scale(.97)}
@media (hover:hover){.кн:hover{background:var(--btn-h)}}
.откуда{margin-left:auto; text-decoration:none; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-l); text-align:right; line-height:1.25}
.откуда img{width:30px; height:40px; object-fit:cover; border-radius:6px}

/* Плитки: модули как приложения — квадрат, настоящая картинка, касание открывает лист */
.плитки{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.плитка{position:relative; aspect-ratio:1; border:0; padding:0; border-radius:20px; overflow:hidden; cursor:pointer; text-align:left;
  background:#fff; box-shadow:0 6px 24px rgba(40,80,120,.12); transition:transform .11s var(--mv)}
.плитка:active{transform:scale(.97)}
.плитка .фон{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.плитка .фон.книги{display:flex; gap:6px; align-items:flex-end; justify-content:center; padding:18px 14px 64px;
  background:linear-gradient(160deg,#EAF3FB,#CFE3F4)}
.плитка .фон.книги span{width:22%; border-radius:4px 7px 7px 4px; box-shadow:inset 4px 0 0 rgba(0,0,0,.12), 0 4px 10px rgba(30,50,80,.18)}
.плитка .подпись{position:absolute; left:0; right:0; bottom:0; padding:28px 12px 11px;
  background:linear-gradient(to top, rgba(255,255,255,.96) 55%, rgba(255,255,255,0)); color:var(--ink)}
.плитка .подпись b{display:block; font-size:15px; line-height:1.2}
.плитка .подпись small{font-size:12px; color:var(--ink-m)}
.плитка .значок{position:absolute; top:10px; left:10px; width:32px; height:32px; border-radius:10px; display:grid; place-items:center;
  background:rgba(255,255,255,.88); font-size:17px; box-shadow:0 2px 8px rgba(30,50,80,.15)}

/* лист поверх: размытие одно — у подложки */
.подложка{position:fixed; inset:0; z-index:9; background:rgba(200,220,236,.4); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  opacity:0; pointer-events:none; transition:opacity .26s var(--mv)}
.подложка.да{opacity:1; pointer-events:auto}
.лист{position:fixed; left:0; right:0; bottom:0; z-index:10; max-width:720px; margin:0 auto; max-height:88vh; overflow:auto;
  border-radius:28px 28px 0 0; padding:10px 0 calc(env(safe-area-inset-bottom) + 16px);
  transform:translateY(100%); transition:transform .26s var(--mv)}
.лист.да{transform:none}
.лист .карта{box-shadow:none; background:#fff; border-radius:28px 28px 0 0}
.ручка{width:40px; height:5px; border-radius:3px; background:rgba(31,36,66,.18); margin:6px auto 0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:700px){.плитки{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header class="шапка">
  <div class="шапка-ряд">
    <h1>Полка<small>готовое из твоих ссылок</small></h1>
    <div class="сегмент" role="group" aria-label="Вид">
      <button data-вид="лента" aria-pressed="true">Лента</button>
      <button data-вид="плитки" aria-pressed="false">Плитки</button>
    </div>
  </div>
</header>
<main>
  <div class="лента" id="лента"></div>
  <div class="плитки" id="плитки" hidden></div>
</main>
<div class="подложка" id="подложка"></div>
<div class="лист" id="лист" role="dialog" aria-modal="true"><div class="ручка"></div><div id="лист-тело"></div></div>

<script>
// Вещи живут в polka.json — тот же файл читает Космос OS (os_gotovoe.py): одна правда на двоих.
// Источник маленький, внизу: героем остаётся сама вещь.
let ПОЛКА = [];
const э = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const карта = (м) => `<article class="карта">
  <span class="вид">${э(м.вид)}</span>
  <h2>${э(м.имя)}</h2><p class="суть">${э(м.суть)}</p>
  <ul class="ряды">${м.ряды.map(р => `<li>${р.цвет ? `<span class="корешок" style="background:${р.цвет}"></span>` : `<span class="номер">${р.н}</span>`}
    <span><b>${э(р.т)}</b><small>${э(р.п)}</small></span>${р.г ? `<span class="грань">${э(р.г)}</span>` : ''}</li>`).join('')}</ul>
  <p class="заметка">${э(м.заметка)}</p>
  <div class="низ">${м.кнопка ? `<button class="кн">${э(м.кнопка)}</button>` : '<span></span>'}
    <a class="откуда" href="${э(м.ссылка)}" target="_blank" rel="noopener"><span>из ролика<br>${э(м.откуда)}</span><img src="${э(м.кадр)}" alt=""></a></div>
</article>`;
const плитка = (м, i) => `<button class="плитка" data-i="${i}">
  ${м.вид === 'Книги' ? `<div class="фон книги">${м.ряды.map((р, k) => `<span style="background:${р.цвет};height:${62 + (k % 2) * 10}%"></span>`).join('')}</div>`
                     : `<img class="фон" src="${э(м.кадр)}" alt="">`}
  <span class="подпись"><b>${э(м.имя)}</b><small>${э(м.вид)} · ${м.ряды.length} ${м.вид === 'Книги' ? 'книги' : 'шага'}</small></span></button>`;
const разложить = () => {
  document.getElementById('лента').innerHTML = ПОЛКА.map(карта).join('');
  document.getElementById('плитки').innerHTML = ПОЛКА.map(плитка).join('');
};
fetch('polka.json', {cache: 'no-store'}).then(r => r.json()).then(d => { ПОЛКА = d.вещи || []; разложить(); })
  .catch(() => { document.getElementById('лента').innerHTML = '<p class="суть">Полка не загрузилась — обнови страницу.</p>'; });

const лист = document.getElementById('лист'), подложка = document.getElementById('подложка');
const открыть = i => { document.getElementById('лист-тело').innerHTML = карта(ПОЛКА[i]); лист.classList.add('да'); подложка.classList.add('да'); };
const закрыть = () => { лист.classList.remove('да'); подложка.classList.remove('да'); };
document.getElementById('плитки').addEventListener('click', e => { const п = e.target.closest('.плитка'); if(п) открыть(+п.dataset.i); });
подложка.addEventListener('click', закрыть);
addEventListener('keydown', e => { if(e.key === 'Escape') закрыть(); });
const показать = вид => {
  document.querySelectorAll('.сегмент button').forEach(б => б.setAttribute('aria-pressed', б.dataset.вид === вид));
  document.getElementById('лента').hidden = вид !== 'лента';
  document.getElementById('плитки').hidden = вид !== 'плитки';
  try{ localStorage.setItem('polka_view', вид === 'лента' ? 'a' : 'b'); }catch(_){}
};
document.querySelector('.сегмент').addEventListener('click', e => { const б = e.target.closest('button'); if(б) показать(б.dataset.вид); });
const из_адреса = new URLSearchParams(location.search).get('v');
let сохр = null; try{ сохр = localStorage.getItem('polka_view'); }catch(_){}
показать((из_адреса || сохр) === 'b' ? 'плитки' : 'лента');
</script>
</body>
</html>
