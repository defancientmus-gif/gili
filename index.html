      в_память(ПАМЯТЬ_ОЧЕРЕДИ, очередь().map(x => x.когда === з.когда ? Object.assign({}, x, {текст}) : x));
    нарисовать(); везти_очередь();
    return;
  }
  const м = МЫСЛИ.find(x => x.id === ид); if(!м){ ПРАВЛЮ = null; нарисовать(); return; }
  const ta = document.querySelector('.редактор');
  const было = м.body || '', статус_до = м.status, текст = (ta ? ta.value : '').trim();
  ПРАВЛЮ = null;                                    // сначала снять замок, потом рисовать
  if(!текст || текст === было.trim()){ нарисовать(); return; }
  м.body = текст; м.status = 'правка'; нарисовать();   // на экране сразу, без ожидания сети
  // .select: правило базы, не пустившее правку, ошибки не даёт — просто ноль строк
  let {data, error} = await sb.from('gili_notes').update({body: текст, status: 'правка'}).eq('id', ид).select('id');
  if(!error && Array.isArray(data) && !data.length) error = {message: 'база не дала изменить эту мысль'};
  // Отказ — вслух и там, где человек смотрит. До 24.09 он уходил в сказать(), а это строка
  // экрана входа, в ленте её высота 0: текст молча откатывался, и никто не знал почему.
  if(error){ м.body = было; м.status = статус_до; нарисовать();
             сказать_внизу('правка не ушла: ' + экран(error.message), 6000); return; }
  загрузить();
}

function рисуй(html){
  const л = $('лента');
  if(л.dataset.было === html) return;
  const внизу = л.scrollHeight - л.scrollTop - л.clientHeight < 60;

  /* ЯКОРЬ. Женя 07.08: «иногда скролл сам подпрыгивает вверх, приходится всегда
     подкручивать чуть выше, так во всех 3-х окнах», и 10.08: «по прежнему подпрыгивает
     после отправки». В окне на маке это лечили четырежды и вылечили якорем, а сюда
     лекарство не доехало — здесь позиция не восстанавливалась вообще.

     ЧТО НА САМОМ ДЕЛЕ ПРОИСХОДИТ (замер на стенде 13.08, до того чинили вслепую):
     scrollTop НЕ обнуляется — он честно остаётся, каким был. Уезжает содержимое ПОД ним.
     Снимки приходят из хранилища асинхронно (показать_фото), встают выше точки чтения
     и раздвигают ленту на свою высоту. Прокрутка та же, а под ней уже другая мысль —
     человек читает и вдруг видит не то. Это и есть «подпрыгнуло».
     Замер: было scrollTop 600 → осталось 600, но мысль на верхней кромке сменилась.

     Поэтому держимся не за число пикселей, а за саму мысль: запоминаем ту, что у верхней
     кромки, и после отрисовки ставим её на то же место (scrollTop при этом СДВИНЕТСЯ —
     так и надо, он компенсирует то, что выросло выше). Арифметика «расстояние до низа»
     уже проверена на маке и врёт: высота меняется в тот же миг.

     Якорей берём три: мысль, за которую держались, может из ленты исчезнуть — ты нажал
     «убрать» ровно на ней. Тогда держимся за следующую. */
  const якоря = [];
  // раскрыли полосу — держимся за неё, даже если стояли внизу: иначе лента уехала бы к низу,
  // и раскрытый день остался бы за краем экрана
  const держать = ДЕРЖАТЬ && л.querySelector(`[data-ид="${ДЕРЖАТЬ}"]`);
  ДЕРЖАТЬ = null;
  if(держать) якоря.push({ид: держать.dataset.ид, отступ: держать.offsetTop - л.scrollTop});
  else if(!внизу){
    for(const м of л.querySelectorAll('.мысль, .полоса')){
      const верх = м.offsetTop - л.scrollTop;
      if(верх >= -м.offsetHeight){
        якоря.push({ид: м.dataset.ид, отступ: верх});
        if(якоря.length === 3) break;
      }
    }
  }

  л.dataset.было = html;
  л.innerHTML = html;

  if(внизу && !держать){
    к_низу();
  } else if(якоря.length){
    const вернуть = () => {
      for(const я of якоря){
        const м = л.querySelector(`[data-ид="${я.ид}"]`);
        if(м){ л.scrollTop = м.offsetTop - я.отступ; return; }
      }
    };
    вернуть();
    requestAnimationFrame(вернуть);        // и после того, как браузер пересчитал размеры
    // Раскрытый день досчитывает высоту своих карточек ещё несколько кадров, и браузер,
    // подстраиваясь, уводил полосу из-под пальца на 23 px (стенд 24.09) — держим дольше.
    if(держать){ let n = 0; const ещё = () => { вернуть(); if(++n < 12) requestAnimationFrame(ещё); }; ещё(); }
  }
  показать_фото();
}

/* К НИЗУ — ДО НАСТОЯЩЕГО НИЗА. Женя 09.09: «когда отправляю… сообщение, оно падает вниз,
   нужно пролистывать». Замер 23.09 на стенде: после отрисовки лента стоит ровно внизу
   (scrollHeight 1728), а через мгновение низ уезжает на ~1000 px (2716) без единой
   перерисовки. Виноват `content-visibility:auto` у карточек v27: вне экрана карточка
   считается высотой 88 px и получает настоящую, только доехав до экрана. Один
   `scrollTop = scrollHeight` прокручивает к прикидке, а настоящий низ уезжает вместе
   с твоей мыслью. Поэтому держимся за низ, пока высота ленты не перестанет расти. */
function к_низу(){
  const л = $('лента');
  let было = -1, тихо = 0, кадров = 0;
  const шаг = () => {
    л.scrollTop = л.scrollHeight;
    тихо = л.scrollHeight === было ? тихо + 1 : 0;
    было = л.scrollHeight;
    if(тихо < 3 && ++кадров < 40) requestAnimationFrame(шаг);
  };
  шаг();
}

/* «↓ К СВЕЖИМ» — как в ТГ (Дом 24.09: «прямо его "1 в 1 как в тг"»). Ушёл вверх по ленте
   дальше чем на полэкрана — над полем круглая кнопка, касание возвращает к свежему. */
{
  const л = $('лента'), к = $('к-свежим');
  // считаем прямо в прокрутке: три числа, а покадровый вызов в спящей вкладке не приходит вовсе
  л.addEventListener('scroll', () =>
    к.classList.toggle('видна', л.scrollHeight - л.scrollTop - л.clientHeight > л.clientHeight * .6),
    {passive: true});
  к.addEventListener('click', () => {
    const тихо = matchMedia('(prefers-reduced-motion:reduce)').matches;
    л.scrollTo({top: л.scrollHeight, behavior: тихо ? 'auto' : 'smooth'});
    setTimeout(к_низу, тихо ? 0 : 450);   // ленивые карточки дорастают по пути — докручиваем
  });
}

const имя_потока = к => (ПОТОКИ.find(п => п.код === к) || {}).имя || к;

/* СТАТУС ГОВОРИТ ПО-ЧЕЛОВЕЧЕСКИ. Женя 13.08 спросил про свою же мысль: «✓✓ у Коры — чё это,
   почему так называется». Кора — имя ассистента штаба, и человеку оно ничего не говорит:
   интерфейс разговаривал внутренними именами механизмов. Раз пользователь спрашивает, что
   написано на его экране, — виноват экран.
   Правим только показ, в базе статус остаётся прежним: она общая с домом, и переучивать
   её ради вывески значит завести вторую правду. → штабу: в `Домик/scripts/облако.py`
   (`куда_ушла`) статус собирается словами «✓✓ у Коры» — переименовать бы в источнике. */
// слово карточки для просьбы, которую телефон оставил дому (см. «ТРИ ДЕЙСТВИЯ С ТЕЛЕФОНА»)
const ПРОСЬБЫ = {перенос: 'перенесено, ждёт дома', готово: '✓ сделано', убрать: 'убрано'};
function человечно(статус){
  const с = (статус || '').trim();
  if(!с) return 'записано';
  // о том, что слова ещё едут, говорит сама карточка — незачем повторять это дважды в строку
  if(с === 'распознаётся') return 'записано';
  // правка ждёт дома: говорим как есть, а не «исправлено» — исправлено будет, когда доедет
  if(с === 'правка') return 'правка ждёт дома';
  if(ПРОСЬБЫ[с]) return ПРОСЬБЫ[с];
  const адрес = с.match(/^кому:(.+)$/);
  if(адрес) return `→ ${(КОМУ.find(к => к[0] === адрес[1]) || [0, адрес[1]])[1]} · ждёт дома`;
  if(с.includes('у Коры')) return '✓✓ разобрано';
  // стрелка уже говорит «ушло» — лишние слова ломают строку в узкой колонке (проверено глазами)
  const кому = с.match(/^→\s*(.+)$/);
  if(кому) return `→ ${кому[1].replace(/\s*Сервис$/, '')}`;
  return с;
}

let ОТКРЫТА = null;                       // у какой мысли раскрыто длинное (вывод, суть ссылки)
let ДЕРЖАТЬ = null;                       // что рисуй() обязан оставить на месте (раскрытая полоса)
let ПРАВЛЮ = null;                        // какая мысль сейчас правится прямо в карточке
document.addEventListener('click', e => {
  if(e.target.closest('#меню-мысли')){
    const б = e.target.closest('.пункт');
    б ? дело_меню(б.dataset.дело) : закрыть_меню();   // касание мимо или по самой мысли — закрыть
    return;
  }
  if(МЕНЮ){                                  // палец отпустили после долгого нажатия — это не щелчок

    нарисовать(); return;
  }
  const м = e.target.closest('#лента .мысль');
  if(!м) return;
  if(e.target.closest('.внутри')){           // «ещё» как в ТГ: длинное раскрывается на месте
    ОТКРЫТА = ОТКРЫТА === м.dataset.ид ? null : м.dataset.ид;
    ДЕРЖАТЬ = м.dataset.ид; нарисовать(); return;
  }
  if(String(getSelection() || '').trim()) return;     // на маке выделял текст мышью — не мешаем
  открыть_меню(м.dataset.ид, м);
});
// Долгое нажатие пальцем — как в ТГ. Сдвинул палец больше чем на 8 px — это прокрутка, не меню.
let ДОЛГО = null;
const долго_нет = () => { if(ДОЛГО){ clearTimeout(ДОЛГО.т); ДОЛГО = null; } };
document.addEventListener('pointerdown', e => {
  ГЛОТАТЬ = false;
  if(e.pointerType === 'mouse' || МЕНЮ) return;

  ДОЛГО = {x: e.clientX, y: e.clientY, т: setTimeout(() => {
    ДОЛГО = null; ГЛОТАТЬ = true;
    navigator.vibrate?.(8);
    открыть_меню(м.dataset.ид, м);
  }, 420)};
}, {passive: true});
document.addEventListener('pointermove', e => {
  if(ДОЛГО && Math.hypot(e.clientX - ДОЛГО.x, e.clientY - ДОЛГО.y) > 8) долго_нет();
}, {passive: true});
document.addEventListener('pointerup', долго_нет, {passive: true});
document.addEventListener('pointercancel', долго_нет, {passive: true});
// правый щелчок на маке; на Андроиде долгое нажатие присылает то же событие — меню уже открыто
document.addEventListener('contextmenu', e => {
  const м = e.target.closest('#лента .мысль');
  if(!м || e.target.closest('a, textarea')) return;
  e.preventDefault(); открыть_меню(м.dataset.ид, м);
});
document.addEventListener('keydown', e => {
  if(!МЕНЮ) return;
  if(e.key === 'Escape'){ e.preventDefault(); e.stopImmediatePropagation(); закрыть_меню(); return; }
  if(e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  const п = [...document.querySelectorAll('#меню-мысли .пункт')];
  const i = п.indexOf(document.activeElement);
  п[(i + (e.key === 'ArrowDown' ? 1 : п.length - 1)) % п.length]?.focus();
  e.preventDefault();
}, true);
addEventListener('resize', () => { if(МЕНЮ) закрыть_меню(); });   // место меню посчитано под старый размер

/* Перенести в другой поток. Мысль уходит туда, куда решил человек, и это же
   становится уроком: дом запоминает слова из неё за нужным потоком. */
/* ТРИ ДЕЙСТВИЯ С ТЕЛЕФОНА — ПРОСЬБОЙ К ДОМУ, А НЕ ТИХОЙ ПРАВКОЙ ОБЛАКА (Дом 24.09).
   До v34 «перенести», «✓ сделано» и «убрать» меняли только облако: дома мысль оставалась
   ждущей, во ВХОДе висела, а мост дома, который с 24.09 ходит в обе стороны, мог вернуть
   старый поток и даже убранную мысль обратно. Теперь как у правки (контракт 31.08):
   status говорит дому, что сделал человек, — 'перенос', 'готово', 'убрать'. Дом применяет
   у себя и ставит своё слово. На маке эти же вызовы прослойка ведёт прямо в сервер. */

async function перенести(ид, куда){
  ОТКРЫТА = null;
  const м = МЫСЛИ.find(x => x.id === ид); if(!м) return;
  м.flow = куда; м.status = 'перенос'; нарисовать();
  await sb.from('gili_notes').update({flow: куда, status: 'перенос'}).eq('id', ид);
  учить(м.body, куда);
  загрузить();
}

/* Отметить обработанной — «я это сделал», больше не мозолит глаза. */
async function пометить_готовой(ид){
  ОТКРЫТА = null;
  const м = МЫСЛИ.find(x => x.id === ид); if(!м) return;
  м.status = 'готово'; нарисовать();
  await sb.from('gili_notes').update({status: 'готово'}).eq('id', ид);
  загрузить();
}

async function отправить_кому(ид, кому){
  const м = МЫСЛИ.find(x => x.id === ид); if(!м) return;
  const было = м.status;
  // просьба дому в статусе, как «перенос» и «готово» (Дом 26.09 17:14): колонки «кому» у облака нет,
  // её заводит только рука Жени. Имя — ровно из КОМУ_МОЖНО сервера. На маке прослойка ведёт в /api/note/to.
  м.status = 'кому:' + кому; нарисовать();
  const {error} = await sb.from('gili_notes').update({status: 'кому:' + кому}).eq('id', ид);
  if(error){ м.status = было; нарисовать(); сказать_внизу('не отправилась — нет связи, попробуй ещё раз'); return; }
  const имя = (КОМУ.find(к => к[0] === кому) || [0, кому])[1];
  сказать_внизу(кому === 'Домик' ? 'оставил штабу' : 'уедет: ' + имя, 1800);
  загрузить();
}

async function убрать(ид){
  ОТКРЫТА = null;
  МЫСЛИ = МЫСЛИ.filter(x => x.id !== ид); нарисовать();
  await sb.from('gili_notes').update({status: 'убрать'}).eq('id', ид);
  загрузить();
}

/* Поправка человека — материал для обучения разбора. Копим на маке: дом заберёт
   вместе с мыслью и допишет в свои уроки, чтобы в следующий раз решить самому. */
function учить(текст, поток){
  try{
    const у = JSON.parse(localStorage.getItem('гили_уроки') || '[]');
    у.push({текст: (текст || '').slice(0, 120), поток, когда: new Date().toISOString()});
    localStorage.setItem('гили_уроки', JSON.stringify(у.slice(-200)));
  }catch{}
}
/* Судьба задачи цветом: молчание видно боковым зрением, закрытое радует. */
const окраска = с => /молчит/.test(с || '') ? 'молчит'
                   : /сделано|готово|закрыто/.test(с || '') ? 'готово'
                   : /^→/.test((с || '').trim()) ? 'ушла' : '';
let СЕМЬЯ = {};
const имя_автора = id => СЕМЬЯ[id] || 'кто-то из своих';   // в «Работе» пишет уже не только семья

/* Фото лежат в закрытом хранилище — прямых ссылок нет, просим временную на час.
   В ленте показываем маленькое: Женя 11.08 — «накладная на весь экран, пусть сжимается
   до маленького превью, после открытия только разворачивается». */
async function показать_фото(){
  // снизу вверх: на экране низ ленты, а мини-снимки полос наверху подождут своей очереди
  for(const img of [...$('лента').querySelectorAll('img[data-путь]')].reverse()){
    const путь = img.dataset.путь; delete img.dataset.путь;
    const {data} = await sb.storage.from('gili').createSignedUrl(путь, 3600);
    if(data?.signedUrl) img.src = data.signedUrl;
  }
  /* Ссылку на запись берём ЗАРАНЕЕ, а не по нажатию. На айфоне звук играет только в тот
     же миг, что и касание: подождать ответа сервера — и Safari уже считает, что человек
     ничего не нажимал, и молчит. Поэтому к моменту касания ссылка лежит в кнопке. */
  for(const б of $('лента').querySelectorAll('button[data-звук]')){
    const путь = б.dataset.звук; delete б.dataset.звук;
    const {data} = await sb.storage.from('gili').createSignedUrl(путь, 3600);
    if(data?.signedUrl) б.dataset.ссылка = data.signedUrl; else б.remove();
  }
}

let ЗВУЧИТ = null;

/* Мысль от Саши появляется у Жени сама, без обновления страницы. */
function подписаться(){
  sb.channel('гили').on('postgres_changes',
    {event:'*', schema:'public', table:'gili_notes'}, загрузить).subscribe();
}

/* ── очередь: без сети мысль не теряется ──────────────────────────────────── */
const очередь = () => из_памяти(ПАМЯТЬ_ОЧЕРЕДИ);
function в_очередь(з){ в_память(ПАМЯТЬ_ОЧЕРЕДИ, очередь().concat(з)); нарисовать(); обновить_состояние(); }
function из_очереди(когда){ в_память(ПАМЯТЬ_ОЧЕРЕДИ, очередь().filter(з => з.когда !== когда)); }

function обновить_состояние(){
  if(ЗАПИСЬ) return;                       // идёт запись — внизу считаются секунды, не очередь
  const n = очередь().length;
  if(!n){ $('состояние').textContent = ''; return; }
  const о = n % 10, д = n % 100;
  const слово = (о === 1 && д !== 11) ? 'мысль уедет'
              : (о >= 2 && о <= 4 && (д < 12 || д > 14)) ? 'мысли уедут' : 'мыслей уедут';
  $('состояние').textContent = `${n === 1 ? 'одна' : n} ${слово}, ${НА_МАКЕ ? 'как только мак ответит' : 'когда появится сеть'}`;
}

/* Расклад 3 (сервер УСПЕЛ записать, а ответ не дошёл): insert бросил ошибку → мысль
   осталась в очереди → повторная вставка задвоила бы её. Идемпотентности у insert нет,
   а уникальный индекс ставить нельзя — в ленте лежат старые дубли, миграция упадёт на них.
   Поэтому перед вставкой спрашиваем ленту: нет ли уже мысли этого автора с тем же «когда».
   «Когда» на сервере — это created_at той самой записи, а метку очереди мы снимаем тем же
   мигом (± время заливки фото/звука и потери ответа), поэтому сверяем по окну вокруг метки.
   Штаб просил «когда+кто»; добавил ещё совпадение тела — иначе две РАЗНЫЕ мысли, попавшие
   в одно окно, схлопнулись бы в одну, и живая мысль пропала бы (потерять мысль хуже дубля). */
async function уже_записано(з){
  try{
    const окно = 180000;   // ±3 мин: заливка, потеря ответа и скос часов телефона укладываются
    const {data, error} = await sb.from('gili_notes')
      .select('body,audio,created_at')
      .eq('author', Я.id)
      .gte('created_at', new Date(з.когда - окно).toISOString())
      .lte('created_at', new Date(з.когда + окно).toISOString());
    if(error || !data || !data.length) return false;   // не проверили или пусто — вставляем
    if(з.звук) return data.some(м => м.audio);          // голос: свой звук в окне — та самая мысль
    return data.some(м => (м.body || '') === (з.текст || ''));  // текст/фото: тело совпало
  }catch{ return false; }
}

let ВЕЗУ = false;
async function везти_очередь(){
  if(ВЕЗУ || !Я || !navigator.onLine || !очередь().length) return;
  ВЕЗУ = true;
  for(const з of очередь()){
    if(ПРАВЛЮ === 'ж' + з.когда) break;   // человек её сейчас правит — уедет исправленной, порядок держим
    try{
      if(await уже_записано(з)){ из_очереди(з.когда); continue; }  // расклад 3: не дублируем
      if(з.звук){            // сказанное без сети: звук ждал в телефоне буквами, теперь уезжает
        const путь = await залить_звук(избуквы(з.звук));
        const {error} = await sb.from('gili_notes').insert(
          {author: Я.id, flow: з.поток, body: '', photos: [], audio: путь, status: 'распознаётся'});
        if(error) throw error;
        из_очереди(з.когда);
        догонять_голос();
        continue;
      }
      const пути = [];
      for(const ф of (з.фото || [])) пути.push(await залить(избуквы(ф.буква)));
      const {error} = await sb.from('gili_notes').insert({author: Я.id, flow: з.поток, body: з.текст, photos: пути});
      if(error) throw error;
      из_очереди(з.когда);
    }catch(e){ break; }      // облако молчит — остальное подождёт, порядок сохраняем
  }
  ВЕЗУ = false;
  обновить_состояние();
  await загрузить();
}
window.addEventListener('online', везти_очередь);
document.addEventListener('visibilitychange', () => {
  if(document.hidden) return;
  везти_очередь();
  // вернулся в приложение — если мысль всё ещё без слов, ждём их активно, а не до случая
  загрузить().then(() => { if(МЫСЛИ.some(ждёт_слов)) догонять_голос(); });
});
// На маке ждут не сеть, а сервер: после перезапуска он встаёт за пару секунд, и 20 с ожидания
// там — это мысль, которая висит «ждёт отправки» без всякой причины.
setInterval(везти_очередь, НА_МАКЕ ? 4000 : 20000);

/* ── фото ─────────────────────────────────────────────────────────────────────
   Ужимаем прямо в телефоне: снимок айфона весит 3–5 МБ, и такой не влезет
   ни в память телефона на время без сети, ни в разумный трафик. 1600 px
   хватает, чтобы прочитать ценник, накладную или бумагу. */
async function ужать(файл){
  if(!файл.type.startsWith('image/')) return null;
  const bmp = await createImageBitmap(файл).catch(() => null);
  if(!bmp) return файл;
  const край = 1600, k = Math.min(1, край / Math.max(bmp.width, bmp.height));
  if(k === 1 && файл.size < 900e3) return файл;
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close?.();
  // 0.6 вместо 0.72: накладная и ценник читаются так же, а весит вдвое меньше —
  // это и трафик, и место в общей квоте базы
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.6));
  return blob && blob.size < файл.size ? new File([blob], 'фото.jpg', {type:'image/jpeg'}) : файл;
}
const вбукву = ф => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(ф); });
function избуквы(строка){
  const [шапка, тело] = строка.split(',');
  const б = atob(тело), a = new Uint8Array(б.length);
  for(let i = 0; i < б.length; i++) a[i] = б.charCodeAt(i);
  return new Blob([a], {type: (шапка.match(/:(.*?);/) || [,'image/jpeg'])[1]});
}
async function залить(blob){
  const путь = `${Я.id}/${Date.now().toString(36)}${Math.round(Math.random()*1e6).toString(36)}.jpg`;
  const {error} = await sb.storage.from('gili').upload(путь, blob, {contentType: blob.type || 'image/jpeg'});
  if(error) throw error;
  return путь;
}

// Один путь для всех источников снимка: камера, файл, буфер обмена, перетаскивание.
// Ужимаем и складываем фишкой — отправку решает уже вызывающий.
async function добавить_фото(файлы){
  let добавлено = 0;
  for(const ф of файлы){
    if(!ф || !ф.type?.startsWith('image/')) continue;
    const у = await ужать(ф); if(!у) continue;
    ФОТО.push({файл: у, ссылка: URL.createObjectURL(у)});
    добавлено++;
  }
  if(добавлено) нарисовать_фишки();
  return добавлено;
}

function открыть_фото(){
  $('фото-меню').classList.add('открыта');
  $('фото-меню').setAttribute('aria-hidden','false');
  $('фото-подпись').value = $('поле').value;
  нарисовать_фото_меню();
}
function закрыть_фото(){
  $('фото-меню').classList.remove('открыта');
  $('фото-меню').setAttribute('aria-hidden','true');
}
function нарисовать_фото_меню(){
  const с = $('фото-сетка'); if(!с) return;
  с.innerHTML = ФОТО.length ? ФОТО.map((ф,i) =>
    `<button class="фото-кадр" data-фото="${i}" aria-label="убрать фото"><img src="${ф.ссылка}" alt=""><b>×</b></button>`).join('')
    : '<div class="фото-пусто" style="grid-column:1/-1">Выбранные кадры появятся здесь</div>';
  с.querySelectorAll('[data-фото]').forEach(б => б.onclick = () => {
    const i = +б.dataset.фото; URL.revokeObjectURL(ФОТО[i].ссылка); ФОТО.splice(i,1);
    нарисовать_фишки();
  });
  $('фото-готово').textContent = ФОТО.length ? `Добавить ${ФОТО.length} в сообщение` : 'Добавить в сообщение';
}
async function выбраны_фото(e){
  const файлы = [...(e.target.files || [])]; e.target.value = '';
  await добавить_фото(файлы);
  открыть_фото();
}
$('камера').onclick = открыть_фото;
$('фото-снять').onclick = () => $('снять').click();
$('фото-выбрать').onclick = $('фото-еще').onclick = () => $('файл').click();
$('файл').onchange = выбраны_фото;
$('снять').onchange = выбраны_фото;
$('фото-закрыть').onclick = $('фото-тень').onclick = закрыть_фото;
$('фото-готово').onclick = () => {
  const подпись = $('фото-подпись').value.trim();
  if(подпись){ $('поле').value = подпись; поле.dispatchEvent(new Event('input')); }
  закрыть_фото(); показать_кнопку();
};

// Женя 30.08: «добавь возможность вставлять фото из буфера». На маке это уже было,
// а в окне из интернета (телефон, любой браузер) — нет. Вставка НЕ отправляет сама:
// картинку из буфера обычно хочется подписать, поэтому она встаёт фишкой и ждёт.
document.addEventListener('paste', async e => {
  const файлы = [...(e.clipboardData?.items || [])]
    .filter(п => п.kind === 'file' && п.type.startsWith('image/'))
    .map(п => п.getAsFile()).filter(Boolean);
  if(!файлы.length) return;
  e.preventDefault();
  await добавить_фото(файлы);
});
['dragover','drop'].forEach(соб => document.addEventListener(соб, async e => {
  const файлы = [...(e.dataTransfer?.items || [])].some(п => п.kind === 'file');
  if(!файлы) return;
  e.preventDefault();
  if(соб === 'drop') await добавить_фото([...(e.dataTransfer?.files || [])]);
}));
function нарисовать_фишки(){
  $('фишки').innerHTML = ФОТО.map((ф,i) =>
    `<span class="фишка"><img src="${ф.ссылка}" alt=""><button data-и="${i}">×</button></span>`).join('');
  $('фишки').querySelectorAll('button').forEach(б => б.onclick = () => {
    URL.revokeObjectURL(ФОТО[+б.dataset.и].ссылка);
    ФОТО.splice(+б.dataset.и, 1); нарисовать_фишки(); показать_кнопку();
  });
  нарисовать_фото_меню();
  показать_кнопку();
}

/* ── голос ────────────────────────────────────────────────────────────────────
   Женя 19.08: «Я про телефон. Про говорить. Суть же в удобстве, чтобы я с телефона
   любого заходил в свою учётку или Жена и мы делали заметки, а они автоматически
   распределялись». За рулём и в сервисе печатать нечем — а сказать можно.

   Микрофон браузер даёт только по https, поэтому голос живёт именно здесь, в окне
   из интернета, а не в домашнем окне мака по локальному адресу.

   ПОЧЕМУ МЫСЛЬ ПОЯВЛЯЕТСЯ РАНЬШЕ СЛОВ. Распознаёт речь мак: у него whisper и тишина
   вокруг, у телефона — ни модели, ни батареи на неё. Значит между «сказал» и «прочитал»
   всегда есть пауза, а спящий мак растянет её на часы. Ждать эту паузу нельзя: мысль
   должна быть спасена в секунду, когда её произнесли. Поэтому запись уезжает в хранилище
   рядом с мыслью, карточка встаёт в ленту сразу — и слова догоняют.
   Ровно так это уже работает в окне на маке (19.08), здесь тот же порядок.

   ДОГОВОР С ДОМОМ: у записи в базе заполнено поле `audio` — путь в хранилище `gili`,
   а `body` пуст, пока слова не приехали. Дом забирает звук, распознаёт и пишет текст
   обратно в `body`; пустое тело + непустой audio = «ещё не распознано», и это
   единственный признак, по которому обе стороны узнают такую мысль. */
const ПРЕДЕЛ_ЗАПИСИ = 3 * 60 * 1000;      // забыл остановить — остановим сами
const ЖДУ = '…';                          // путь-заглушка у мысли, которая ещё не уехала
const ЗНАК_ГОЛОСА = '<svg class="знак" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="1.9" stroke-linecap="round"><rect x="9" y="2.6" width="6" height="11.2" rx="3"/>' +
  '<path d="M5 11.2a7 7 0 0 0 14 0M12 18.2v3"/></svg>';
const ждёт_слов = м => !!м.audio && !(м.body || '').trim();

let ЗАПИСЬ = null, таймер_низа;

/* Нижняя строка занята очередью, но во время записи важнее секунды. Сказали — сказали,
   через несколько секунд строка сама возвращается к своему делу. */
function сказать_внизу(html, мс = 3500){
  clearTimeout(таймер_низа);
  $('состояние').innerHTML = html;
  if(мс) таймер_низа = setTimeout(обновить_состояние, мс);
}

const умеет_слушать = !!(navigator.mediaDevices?.getUserMedia && window.MediaRecorder);
if(!умеет_слушать) $('микрофон').hidden = true;   // старый браузер или адрес без https

$('микрофон').onclick = () => {
  if(ЗАПИСЬ){ try{ ЗАПИСЬ.rec.stop(); }catch(e){} return; }
  начать_запись();
};

async function начать_запись(){
  let поток;
  try{ поток = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ сказать_внизу('микрофон не дали — разреши его этому сайту в настройках', 6000); return; }

  // Safari отдаёт mp4, остальные — webm; спрашиваем браузер, а не угадываем по имени
  const тип = ['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus']
    .find(т => { try{ return MediaRecorder.isTypeSupported(т); }catch(e){ return false; } }) || '';
  let rec;
  try{ rec = new MediaRecorder(поток, тип ? {mimeType: тип} : {}); }
  catch(e){ поток.getTracks().forEach(д => д.stop()); сказать_внизу('запись тут не работает'); return; }

  const куски = [];
  rec.ondataavailable = e => { if(e.data && e.data.size) куски.push(e.data); };
  const сторож = setTimeout(() => { try{ if(rec.state === 'recording') rec.stop(); }catch(e){} }, ПРЕДЕЛ_ЗАПИСИ);

  rec.onstop = () => {
    clearTimeout(сторож);
    clearInterval(ЗАПИСЬ && ЗАПИСЬ.часы);
    поток.getTracks().forEach(д => д.stop());     // микрофон отпущен сразу, а не «потом»
    ЗАПИСЬ = null;
    $('микрофон').classList.remove('пишет');
    показать_кнопку();
    const звук = new Blob(куски, {type: rec.mimeType || тип || 'audio/webm'});
    if(звук.size < 1500){ сказать_внизу('слишком коротко — ничего не записалось'); return; }
    отправить_голос(звук);
  };

  rec.start();
  ЗАПИСЬ = {rec, начало: Date.now(), часы: setInterval(тикать, 1000)};
  $('микрофон').classList.add('пишет');
  тикать();
}

function тикать(){
  if(!ЗАПИСЬ) return;
  const с = Math.floor((Date.now() - ЗАПИСЬ.начало) / 1000);
  clearTimeout(таймер_низа);
  $('состояние').innerHTML =
    `<span class="запись"><i></i>${Math.floor(с/60)}:${String(с%60).padStart(2,'0')}</span>` +
    ` · нажми ещё раз, когда договоришь`;
}

async function отправить_голос(звук){
  const метка = Date.now();
  // мысль в ленте раньше, чем звук доехал: с этой секунды её уже не потерять
  const мгновенная = {id: ЖДУ + метка, flow: ПОТОК, body: '', photos: [], audio: ЖДУ,
                      created_at: new Date().toISOString(), status: 'распознаётся', author: Я.id};
  МЫСЛИ = [мгновенная].concat(МЫСЛИ);
  нарисовать();
  сказать_внизу('записано — слова догонят', 2500);
  try{
    if(!navigator.onLine) throw new Error('нет сети');
    const путь = await залить_звук(звук);
    const {error} = await sb.from('gili_notes').insert(
      {author: Я.id, flow: ПОТОК, body: '', photos: [], audio: путь, status: 'распознаётся'});
    if(error) throw error;
    await загрузить();
    догонять_голос();
  }catch(e){
    МЫСЛИ = МЫСЛИ.filter(м => м.id !== мгновенная.id);
    в_очередь({когда: метка, поток: ПОТОК, текст: '', звук: await вбукву(звук)});
    // память телефона не резиновая: длинная запись может в неё не влезть, и молчать
    // об этом нельзя — человек уверен, что мысль сохранена, а её нет нигде
    if(очередь().some(з => з.когда === метка)) сказать_внизу('сети нет — запись уедет сама', 5000);
    else сказать_внизу('запись не поместилась в память телефона — скажи покороче', 7000);
  }
}

async function залить_звук(blob){
  const тип = (blob.type || 'audio/webm').split(';')[0];
  const хвост = {'audio/mp4':'m4a', 'audio/mpeg':'mp3', 'audio/ogg':'ogg',
                 'audio/wav':'wav', 'audio/aac':'aac'}[тип] || 'webm';
  const путь = `${Я.id}/${Date.now().toString(36)}${Math.round(Math.random()*1e6).toString(36)}.${хвост}`;
  const {error} = await sb.storage.from('gili').upload(путь, blob, {contentType: тип});
  if(error) throw error;
  return путь;
}

/* ДОГОН СЛОВ. Обычно текст приезжает сам: база толкает изменение, и лента освежается.
   Но толчок может не дойти (метро, спящая вкладка), а «распознаю…» на экране без движения
   выглядит как поломка. Поэтому пока в ленте есть мысль без слов — переспрашиваем каждые
   три секунды, и не дольше пяти минут: мак мог не проснуться, и висеть в опросе сутки
   ради этого незачем. */
let догон = null, догон_до = 0;
function догонять_голос(){
  догон_до = Date.now() + 5 * 60 * 1000;
  if(догон) return;
  догон = setInterval(() => {
    if(Date.now() > догон_до || !МЫСЛИ.some(ждёт_слов)){ clearInterval(догон); догон = null; return; }
    загрузить();
  }, 3000);
}

/* ── написать ─────────────────────────────────────────────────────────────────
   Женя 10.08: «я не смог сообщение отправить, кнопки ентер нет». Правильно:
   на телефоне Enter переносит строку, а отправлять нечем. Теперь есть кнопка —
   она появляется, только когда есть что отправить, и не мозолит глаза. */
const поле = $('поле');
поле.addEventListener('input', () => {
  поле.style.height = 'auto';
  поле.style.height = Math.min(поле.scrollHeight, 148) + 'px';
  показать_кнопку();
});
поле.addEventListener('keydown', e => {
  // на компьютере привычнее Enter; на телефоне он переносит строку
  if(e.key === 'Enter' && !e.shiftKey && window.innerWidth >= 860){ e.preventDefault(); отправить(); }
});
function показать_кнопку(){
  const есть_что_слать = !!поле.value.trim() || !!ФОТО.length;
  $('послать').classList.toggle('видна', есть_что_слать);
  $('микрофон').classList.toggle('нет', есть_что_слать);   // начал писать — говорить уже нечего
}
$('послать').onclick = отправить;

async function отправить(){
  const текст = поле.value.trim();
  if(!текст && !ФОТО.length) return;
  const фото = ФОТО.slice(); ФОТО = [];
  поле.value = ''; поле.style.height = 'auto';
  нарисовать_фишки();
  const тело = текст || 'фото';

  // мысль видна сразу — человек не ждёт сервер, чтобы поверить, что записалось
  const мгновенная = {id:'…'+Date.now(), flow:ПОТОК, body:тело, photos:[],
                      created_at:new Date().toISOString(), status:'отправляю…', author:Я.id};
  МЫСЛИ = [мгновенная].concat(МЫСЛИ);
  нарисовать();
  к_низу();

  try{
    if(!navigator.onLine) throw new Error('нет сети');
    const пути = [];
    for(const ф of фото) пути.push(await залить(ф.файл));
    const {error} = await sb.from('gili_notes').insert({author: Я.id, flow: ПОТОК, body: тело, photos: пути});
    if(error) throw error;
    await загрузить();
  }catch(e){
    МЫСЛИ = МЫСЛИ.filter(м => м.id !== мгновенная.id);
    const в_буквах = [];
    for(const ф of фото) в_буквах.push({буква: await вбукву(ф.файл)});
    в_очередь({когда: Date.now(), поток: ПОТОК, текст: тело, фото: в_буквах});
  }
  фото.forEach(ф => URL.revokeObjectURL(ф.ссылка));
}

/* ── пришли по ссылке из уведомления ─────────────────────────────────────── */
function по_ссылке(){
  // Имя параметра ЛАТИНИЦЕЙ. Первый заход был «#найти=…» — и браузер закодировал само
  // слово в проценты (%D0%BD%D0%B0%D0%B9…), после чего поиск по «найти» не совпадал
  // никогда. Тот же класс граблей, что кириллица в переменных bash: в адресах живёт ascii.
  const хэш = decodeURIComponent(location.hash || '');
  const m = хэш.match(/[#&](?:find|найти)=([^&]*)/);
  if(!m) return false;
  const что = m[1].trim();
  if(!что) return false;
  $('поиск').value = что;
  ИСКОМОЕ = что.toLowerCase();
  нарисовать();
  return true;
}
window.addEventListener('hashchange', () => { if(Я) по_ссылке(); });

/* ── живое небо ─────────────────────────────────────────────────────────────
   Женя 24.09: «хочу оживить именно то изображение». Это не видео: ту же картинку двигает
   шейдер. Небо — поток в две фазы: облака медленно плывут и меняют форму, петля бесшовная
   по построению. Море — рябь, крупная у берега и гаснущая к горизонту, и редкие блики.
   Горы на горизонте стоят. 30 кадров в секунду; скрытое окно не рисует. Нет WebGL,
   просят меньше движения или шейдер не собрался — остаётся фото фоном body. */
const НЕБО_ВЕРШИНЫ = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const НЕБО_КРАСКИ = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D img; uniform vec2 res, isz; uniform float t;
const float H = .619;          /* horizon: share of image height from top */
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);}
vec3 tex(vec2 uv){return texture2D(img,clamp(uv,0.,1.)).rgb;}
void main(){
  vec2 p=vec2(gl_FragCoord.x,res.y-gl_FragCoord.y)/res, uv=p;   /* same as background center/cover */
  float sa=res.x/res.y, ia=isz.x/isz.y;
  if(sa>ia) uv.y=(p.y-.5)*ia/sa+.5; else uv.x=(p.x-.5)*sa/ia+.5;
  vec3 col;
  if(uv.y<H){
    float ph1=fract(t/12.), ph2=fract(t/12.+.5), w=abs(ph1*2.-1.);
    vec2 f=vec2(1.,0.)+(vec2(noise(uv*3.+1.7),noise(uv*3.+9.2))-.5)*1.3;
    f*=mix(.022,.008,uv.y/H)*(1.-smoothstep(H-.05,H-.012,uv.y));
    col=mix(tex(uv-f*ph1),tex(uv-f*ph2),w);
    float sun=1.-smoothstep(0.,.55,length((uv-vec2(.03,.06))*vec2(1.,.75)));
    col+=vec3(.035)*sun*(.5+.5*sin(t*.33));
  }else{
    float d=clamp((uv.y-H)/(1.-H),0.,1.), z=1./(d+.06), sx=uv.x/(.35+d);
    vec2 o=vec2(sin(sx*38.+z*2.3+t*.9)*.5+noise(vec2(sx*14.,z*1.5-t*.35))-.5,
                cos(z*3.1-t*1.1+uv.x*9.)*.5+noise(vec2(sx*10.+5.,z*1.2+t*.28))-.5);
    col=tex(uv+o*mix(.0004,.0065,pow(d,1.3))*vec2(1.,.6));
    float g=noise(vec2(sx*60.,z*6.-t*.8))*noise(vec2(sx*37.+3.,z*4.2+t*.6));
    col+=vec3(.9,.97,1.)*smoothstep(.55,.9,g)*(.04+.11*(1.-d))*smoothstep(0.,.08,d);
  }
  gl_FragColor=vec4(col,1.);
}`;
function оживить_небо(){
  const c = $('небо');
  if(!c || getComputedStyle(c).display === 'none' || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  let gl = null;
  try{ gl = c.getContext('webgl', {alpha:false, antialias:false, depth:false, stencil:false, powerPreference:'low-power'}); }catch(e){}
  if(!gl) return;
  const собрать = (тип, код) => {
    const ш = gl.createShader(тип); gl.shaderSource(ш, код); gl.compileShader(ш);
    if(!gl.getShaderParameter(ш, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(ш));
    return ш;
  };
  const п = gl.createProgram();
  try{
    gl.attachShader(п, собрать(gl.VERTEX_SHADER, НЕБО_ВЕРШИНЫ));
    gl.attachShader(п, собрать(gl.FRAGMENT_SHADER, НЕБО_КРАСКИ));
    gl.linkProgram(п);
    if(!gl.getProgramParameter(п, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(п));
  }catch(e){ console.warn('живое небо не собралось, остаётся фото:', e.message); return; }
  gl.useProgram(п);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const а = gl.getAttribLocation(п, 'p');
  gl.enableVertexAttribArray(а); gl.vertexAttribPointer(а, 2, gl.FLOAT, false, 0, 0);
  const у = {res: gl.getUniformLocation(п, 'res'), isz: gl.getUniformLocation(п, 'isz'), t: gl.getUniformLocation(п, 't')};

  let кадр = 0, прошлый = 0, готово = false, жив = !document.hidden;
  const t0 = performance.now();
  const размер = () => {
    const к = Math.min(devicePixelRatio || 1, 1.25);      // фото 941 px в ширину: выше — только расход
    const w = Math.round(innerWidth*к), h = Math.round(innerHeight*к);
    if(c.width !== w || c.height !== h){ c.width = w; c.height = h; }
    gl.viewport(0, 0, w, h); gl.uniform2f(у.res, w, h);
  };
  const рисовать = now => {
    кадр = 0;
    if(!жив || !готово) return;
    кадр = requestAnimationFrame(рисовать);
    if(now - прошлый < 32) return;                        // 30 кадров хватает облакам и ряби
    прошлый = now;
    gl.uniform1f(у.t, ((now - t0)/1000) % 7200);           // два часа — ровно 600 циклов неба
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    if(!c.classList.contains('живо')) c.classList.add('живо');
  };
  const пуск = () => { if(жив && готово && !кадр) кадр = requestAnimationFrame(рисовать); };
  const фото = new Image();
  фото.onload = () => {
    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, фото);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.uniform2f(у.isz, фото.naturalWidth, фото.naturalHeight);
    готово = true; размер(); пуск();
  };
  фото.src = 'gili-sky-v1.jpg';
  addEventListener('resize', () => { if(готово){ размер(); пуск(); } }, {passive:true});
  document.addEventListener('visibilitychange', () => { жив = !document.hidden; пуск(); });
  c.addEventListener('webglcontextlost', e => { e.preventDefault(); жив = false; c.classList.remove('живо'); });
}

/* ── старт ────────────────────────────────────────────────────────────────── */
function оживить_сцену(){
  if(!matchMedia('(max-width:720px)').matches || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const c = $('сцена'), ctx = c.getContext('2d', {alpha:true});
  let w=0,h=0,dpr=1,кадр=0,жив=true,рябь=[];
  const размер = () => {
    dpr = Math.min(devicePixelRatio || 1, 1.6); w = innerWidth; h = innerHeight;
    c.width = Math.round(w*dpr); c.height = Math.round(h*dpr); c.style.width=w+'px'; c.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  };
  const рисовать = t => {
    if(!жив) return;
    ctx.clearRect(0,0,w,h);
    const верх = h*.62, шаг = Math.max(13,h*.019);
    ctx.lineWidth=.7;
    for(let i=0;i<12;i++){
      const y=верх+i*шаг, a=.045+i*.006;
      ctx.beginPath();
      for(let x=-12;x<=w+12;x+=9){
        const yy=y+Math.sin(x*.021+t*.0012+i*.72)*2.3+Math.sin(x*.008-t*.0007+i)*1.4;
        x===-12?ctx.moveTo(x,yy):ctx.lineTo(x,yy);
      }
      ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.stroke();
    }
    рябь = рябь.filter(к => {
      const возраст=t-к.t;
      if(возраст>1050) return false;
      const ход=возраст/1050, радиус=12+ход*105, альфа=(1-ход)*.34;
      ctx.beginPath();ctx.arc(к.x,к.y,радиус,0,Math.PI*2);
      ctx.strokeStyle=`rgba(128,245,255,${альфа})`;ctx.lineWidth=1.15;ctx.stroke();
      ctx.beginPath();ctx.arc(к.x,к.y,радиус*.58,0,Math.PI*2);
      ctx.strokeStyle=`rgba(255,255,255,${альфа*.72})`;ctx.lineWidth=.65;ctx.stroke();
      return true;
    });
    кадр=requestAnimationFrame(рисовать);
  };
  let движение=0;
  const след = e => {
    if(движение) return;
    const x=e.clientX,y=e.clientY;
    движение=requestAnimationFrame(()=>{
      движение=0;
      document.documentElement.style.setProperty('--touch-x',x+'px');
      document.documentElement.style.setProperty('--touch-y',y+'px');
    });
  };
  addEventListener('pointermove',след,{passive:true});
  addEventListener('pointerdown',e=>{
    след(e);рябь.push({x:e.clientX,y:e.clientY,t:performance.now()});
  },{passive:true});
  addEventListener('resize', размер,{passive:true});
  document.addEventListener('visibilitychange',()=>{
    жив=!document.hidden;
    if(жив){cancelAnimationFrame(кадр);кадр=requestAnimationFrame(рисовать)}
  });
  размер(); кадр=requestAnimationFrame(рисовать);

  const л=$('лента'); let ждём=false;
  л.addEventListener('scroll',()=>{
    if(ждём) return; ждём=true;
    requestAnimationFrame(()=>{
      ждём=false; const середина=л.getBoundingClientRect().top+л.clientHeight/2;
      л.querySelectorAll('.мысль').forEach(м=>{
        const r=м.getBoundingClientRect(), d=Math.max(-1,Math.min(1,(r.top+r.height/2-середина)/л.clientHeight));
        м.style.setProperty('--gravity',(d*3.5).toFixed(2)+'px');
        м.style.setProperty('--focus',(1-Math.abs(d)*.018).toFixed(3));
        м.style.setProperty('--tilt',(d*-1.7).toFixed(2)+'deg');
      });
    });
  },{passive:true});
}

}

таймер_зова=setInterval(позвать_органы,14000);
оживить_небо();
оживить_сцену();

if(кто_в_памяти()) поднять();        // помним человека — открываемся сразу, проверка внутри
else sb.auth.getSession().then(({data:{session}}) => session ? поднять() : показать('вход'))
  .catch(() => показать('вход'));
обновить_состояние();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  /* Служка теперь отдаёт из кэша сразу, а сеть догоняет в фоне — значит первый экран может
     оказаться вчерашним. Как только новая версия установилась, страница перечитывает себя
     сама: ровно та боль 25.08 «не обновляется интерфейс, надо перезапускать приложение». */
  let перезагружаюсь = false;
  navigator.serviceWorker.addEventListener('message', e => {
    if(e.data === 'новая-версия' && !перезагружаюсь){ перезагружаюсь = true; location.reload(); }
  });
}
