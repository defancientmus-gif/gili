<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гилфойл</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Гилфойл">
<script>
/* Обновление должно запуститься даже если основной код приложения сломался. */
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<meta name="theme-color" content="#dfe7ea">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Стиль взят у «Разберёмся» — по просьбе Жени 10.08 («исследуй разберёмся»),
   из texts/UI_PHILOSOPHY.md и GLASS_STYLE_PROMPT.md. Оттуда три правила:

   · Светло. Тёмной темы в «Разберёмся» нет вовсе, и это осознанно: приложение
     должно выглядеть как бумага на свету, а не как консоль разработчика.
   · Стекло — это три слоя вместе: диагональный градиент (свет сверху-слева),
     белая полупрозрачная рамка (толщина стекла на срезе) и ДВЕ тени —
     внутренний блик сверху и едва заметная холодная снаружи. По отдельности
     ни один слой стекла не даёт.
   · Блюр не больше 12px. У них аудит скорости показал: каждый backdrop-filter
     на айфоне — отдельный проход видеокарты, а разницы между 12 и 40 глаз
     почти не видит. Скорость важнее красивого числа в коде.

   Анимации — только прозрачность и сдвиг, никогда тень и размеры: тень в
   анимации заставляет браузер пересчитывать раскладку на каждом кадре.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --bg:      oklch(0.89 0.018 210);
  --fog:     oklch(0.93 0.012 212);
  --fg:      oklch(0.20 0.020 210);
  --fg-m:    oklch(0.38 0.015 210);
  --fg-l:    oklch(0.55 0.020 210);
  --line:    oklch(0.88 0.02 210 / .40);
  --accent:  oklch(0.45 0.12 210);
  --ждёт:    oklch(0.58 0.11 65);
  --r:       18px;
  --sys: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
  --пружина: cubic-bezier(.34, 1.1, .64, 1);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; overscroll-behavior-y:none}
body{
  margin:0; font-family:var(--sys); color:var(--fg); font-size:17px; line-height:1.5;
  background:
    radial-gradient(70% 45% at 78% -5%, oklch(0.96 0.014 205) 0%, transparent 62%),
    linear-gradient(180deg, var(--fog), var(--bg));
  display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}

/* ── стекло: один рецепт на всё приложение ────────────────────────────────── */
.стекло{
  background:linear-gradient(158deg, oklch(1 0 0 / .82) 0%, oklch(0.965 0.012 210 / .72) 100%);
  border:1px solid oklch(1 0 0 / .70);
  box-shadow: inset 0 1px 0 oklch(1 0 0 / .94),
              0 4px 13px -3px oklch(0.32 0.035 210 / .11);
}

/* ── заставка: пока выясняем, вошёл ли уже ────────────────────────────────── */
#старт{margin:auto; opacity:.35}
#старт[hidden]{display:none}
#старт svg{width:44px; height:44px}

/* ── вход ─────────────────────────────────────────────────────────────────── */
#вход{margin:auto; width:min(340px, 88vw); text-align:center; animation:явь .35s var(--пружина)}
#вход h1{font-size:26px; font-weight:700; letter-spacing:-.4px; margin:0 0 7px}
#вход p{color:var(--fg-l); font-size:15px; margin:0 0 26px}
#вход input{
  width:100%; font:inherit; font-size:16px; padding:14px 16px; margin-bottom:10px;
  border-radius:15px; border:1px solid oklch(1 0 0 / .70); color:var(--fg);
  background:linear-gradient(158deg, oklch(1 0 0 / .82), oklch(0.965 0.012 210 / .72));
  box-shadow:inset 0 1px 0 oklch(1 0 0 / .94);
  transition:border-color .18s;
}
#вход input:focus{outline:none; border-color:var(--accent)}
#вход button{
  width:100%; font:inherit; font-size:16px; font-weight:600; padding:14px;
  border-radius:15px; border:none; background:var(--accent); color:#fff;
  transition:opacity .18s, transform .12s;
}
#вход button:active{opacity:.85; transform:scale(.97)}
#вход button:disabled{opacity:.45}
#сказ{font-size:13.5px; color:var(--fg-l); min-height:19px; margin-top:10px}
#сказ.плохо{color:oklch(0.50 0.15 20)}

/* ── шапка: потоки ────────────────────────────────────────────────────────── */
#приложение{display:contents}
#приложение[hidden]{display:none}
.мобильный-бренд,.поиск-знак,#сцена,#небо,.фото-меню,.старт-слово{display:none}
header{padding:8px 12px 4px}
.потоки{display:flex; gap:4px; padding:3px; border-radius:15px;
  background:oklch(1 0 0 / .34); border:1px solid oklch(1 0 0 / .55)}
.потоки button{
  flex:1; font:inherit; font-size:14px; padding:8px 2px; border-radius:12px;
  border:none; background:transparent; color:var(--fg-l);
  transition:color .18s, background .22s var(--пружина);
}
.потоки button.on{
  background:linear-gradient(158deg, oklch(1 0 0 / .92), oklch(0.98 0.008 210 / .84));
  color:var(--fg); font-weight:600;
  box-shadow:inset 0 1px 0 oklch(1 0 0 / .94), 0 2px 8px -2px oklch(0.32 0.035 210 / .14);
}
.подшапка{display:flex; align-items:center; gap:8px; padding:8px 12px 6px}
.подшапка input{
  flex:1; font:inherit; font-size:15px; padding:9px 14px; border-radius:13px;
  border:1px solid oklch(1 0 0 / .70); color:var(--fg);
  background:linear-gradient(158deg, oklch(1 0 0 / .74), oklch(0.965 0.012 210 / .62));
  transition:border-color .18s;
}
.подшапка input:focus{outline:none; border-color:var(--accent)}
.подшапка .кто{font-size:13px; color:var(--fg-l); white-space:nowrap}
/* ЧИСТАЯ ЛЕНТА. Женя 11.08: «Гили превращается в свалку, надо отработанные убирать,
   чтоб не мешались, и чтоб я наглядно понимал, что обработано, а что нет».
   По умолчанию видно только то, что ещё требует человека; обработанное — по кнопке. */
.вид{
  font:inherit; font-size:13px; padding:7px 12px; border-radius:11px; white-space:nowrap;
  border:1px solid oklch(1 0 0 / .70); color:var(--fg-m);
  background:linear-gradient(158deg, oklch(1 0 0 / .74), oklch(0.965 0.012 210 / .62));
  transition:color .18s, transform .14s var(--пружина);
}
.вид:active{transform:scale(.95)}
.вид.всё{color:var(--accent); font-weight:600}
.вид b{font-weight:700}
.мысль.готовая{opacity:.62}

/* ── лента ────────────────────────────────────────────────────────────────── */
main{flex:1; overflow-y:auto; padding:2px 12px 6px; -webkit-overflow-scrolling:touch;
  display:flex; flex-direction:column; justify-content:flex-end}
main > *{flex:none}
.день{text-align:center; font-size:12px; color:var(--fg-l); margin:14px 0 9px}
/* полоса прошедшего дня: мелкая строка списка — стекло без размытия, одна строка сути */
.полоса{
  display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; column-gap:10px;
  width:100%; margin:0 0 7px; padding:8px 12px 9px; border-radius:16px;
  font:inherit; text-align:left; color:var(--fg); cursor:pointer;
  transition:transform .14s var(--пружина), opacity .18s;
}
.полоса:active{transform:scale(.985)}
.полоса:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.полоса .когда{display:flex; align-items:baseline; gap:8px; min-width:0;
  font-size:12.5px; font-weight:620; color:var(--fg-m); white-space:nowrap}
.полоса .когда small{font-size:11.5px; font-weight:500; color:var(--fg-l); overflow:hidden; text-overflow:ellipsis}
.полоса .суть{grid-column:1; margin-top:2px; font-size:14.5px; line-height:1.35;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.полоса .мини{grid-column:2; grid-row:1 / span 2; display:flex}
.полоса .мини img{width:34px; height:34px; border-radius:12px; object-fit:cover; margin-left:-9px;
  border:2px solid oklch(1 0 0 / .9); background:oklch(0.93 0.015 210)}
.полоса .мини img:first-child{margin-left:0}
.полоса.раскрыта{margin-top:6px}
.полоса.раскрыта .суть{color:var(--fg-m)}
@media (prefers-reduced-motion:reduce){.полоса{transition:none}}
.мысль{
  border-radius:var(--r); padding:12px 14px; margin-bottom:9px;
  font-size:16px; line-height:1.45; white-space:pre-wrap; word-break:break-word;
  animation:явь .26s var(--пружина);
}
.мысль.ждёт{opacity:.78}
.низ{display:flex; align-items:center; gap:7px; margin-top:8px; font-size:12.5px; color:var(--fg-l); flex-wrap:wrap}
.низ>span{white-space:nowrap}    /* время не ломается пополам, когда статус длинный (13.08) */
/* ЦВЕТ ТОЛЬКО ТАМ, ГДЕ ОН ЧТО-ТО ЗНАЧИТ. Было: каждая строка ленты подсвечена акцентом,
   и «записано» кричало так же громко, как «молчит». Когда светится всё, не светится
   ничто — глазу не за что зацепиться. То же лечили в окне на маке 19.08.
   Осталось четыре голоса: тихий у обычного, акцент у уехавшего в дело, красный
   у застрявшего, зелёный у закрытого. */
.низ b{font-weight:600; color:var(--fg-m)}
.низ b.ушла{color:var(--accent)}              /* мысль доехала до чьих-то рук */
.низ b.молчит{color:oklch(0.55 0.16 30)}      /* задача лежит у кодера без движения */
.низ b.готово{color:oklch(0.52 0.13 150)}     /* закрыто — глазу приятно видеть зелёное */
.мысль.ждёт .низ b{color:var(--ждёт)}
.низ .чей{margin-left:auto; font-weight:500}
/* что за ссылкой: адрес коротко, под ним название и суть, вывод дома — по касанию */
.мысль a.адрес{color:var(--accent); font-weight:600; text-decoration:none; border-bottom:1px solid currentColor}
.внутри{position:relative; z-index:1; margin-top:8px; padding:9px 12px; border-radius:14px;
  font-size:13.5px; line-height:1.4; white-space:normal;
  background:oklch(1 0 0/.24); box-shadow:inset 0 0 0 1px oklch(1 0 0/.5)}
.внутри b,.внутри span{display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden}
.внутри b{font-weight:600; color:var(--fg); -webkit-line-clamp:2}
.внутри span{margin-top:2px; color:var(--fg-m); -webkit-line-clamp:3}
.мысль.выбрана .внутри span{-webkit-line-clamp:unset}
.внутри i{display:block; margin-top:6px; font-style:normal; color:var(--fg)}
.внутри.ход{background:none; box-shadow:none; padding:2px 0 0; color:var(--fg-l); font-size:12.5px}
.внутри.подробно span{white-space:pre-wrap; font-size:12.5px; overflow-x:auto}
/* МЕНЮ МЫСЛИ — как в ТГ (Женя 24.09: «прям 1 в 1 как в тг»). Мысль поднимается над притихшей
   лентой, рядом столбик действий. Ручная сортировка (Женя 11.08) живёт здесь же: «Перенести»
   учит разбор, как и раньше. Стекло то же, что у листа фото; линий нет — держит воздух. */
.меню-мысли{position:fixed; inset:0; z-index:85; touch-action:none; overscroll-behavior:contain}
.меню-фон{position:absolute; inset:0; background:oklch(.12 .025 215/.20);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); animation:меню-фон .18s ease-out both}
.меню-копия{position:fixed; display:flex; flex-direction:column; overflow:auto; touch-action:pan-y;
  overscroll-behavior:contain; border-radius:var(--r); animation:меню-подъём .26s var(--пружина) both}
.меню-мысли .меню-копия .мысль{margin:0; transform:none; animation:none; content-visibility:visible;
  flex:none; align-self:stretch; width:100%; max-width:none;
  -webkit-user-select:none; user-select:none; border-color:oklch(1 0 0/.9);
  box-shadow:inset 0 1px 0 white, 0 0 0 3px oklch(.72 .14 207/.16), 0 18px 38px -20px oklch(.22 .15 216/.55)}
.меню-список{position:fixed; min-width:220px; max-width:calc(100vw - 24px); padding:5px; border-radius:20px;
  background:linear-gradient(155deg, oklch(1 0 0/.9), oklch(.95 .02 210/.82));
  border:1px solid oklch(1 0 0/.86);
  box-shadow:inset 0 1px 0 oklch(1 0 0/.98), 0 22px 50px -24px oklch(.20 .07 220/.5);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); animation:меню-явь .2s var(--пружина) both}
.меню-список .пункт{display:flex; align-items:center; justify-content:space-between; gap:18px; width:100%;
  min-height:44px; padding:0 12px 0 14px; border:0; border-radius:15px; background:none;
  font:inherit; font-size:16px; color:var(--fg); text-align:left; cursor:pointer; transition:background .12s}
.меню-список .пункт svg{width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round; color:var(--fg-m)}
.меню-список .пункт.опасно{margin-top:4px}
.меню-список .пункт.опасно, .меню-список .пункт.опасно svg{color:oklch(0.52 0.16 25)}
.меню-список .пункт.назад{justify-content:flex-start; gap:8px; color:var(--fg-m)}
@media (hover:hover){.меню-список .пункт:hover{background:oklch(.32 .035 210/.06)}}
.меню-список .пункт:active{background:oklch(.32 .035 210/.10)}
.меню-список .пункт:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.меню-мысли.уходит{opacity:0; transition:opacity .14s ease-out; pointer-events:none}
@keyframes меню-фон{from{opacity:0}}
@keyframes меню-подъём{from{transform:translateY(var(--сдвиг, 0px))}}
@keyframes меню-явь{from{opacity:0; transform:scale(.9) translateY(-6px)}}
@media (prefers-reduced-motion:reduce){
  .меню-фон, .меню-копия, .меню-список{animation:none}
  .меню-мысли.уходит{transition:none}
}
/* на телефоне долгое нажатие — это меню мысли, а не выделение текста (копирует «Копировать») */
@media (hover:none){
  #лента .мысль{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
  #лента .мысль textarea{-webkit-user-select:text; user-select:text}
}
/* редактор на месте текста мысли: тот же шрифт и та же ширина, что у самой мысли —
   человек правит то, что видел, а не переписывает в другом окне */
.мысль textarea.редактор{width:100%; min-height:44px; margin:0; padding:9px 11px;
     font:inherit; line-height:1.45; border:1px solid var(--accent); border-radius:12px;
     background:oklch(1 0 0 / .7); color:var(--fg); resize:none; outline:none; display:block}
.правка-низ{display:flex; justify-content:flex-end; gap:6px; margin-top:8px}
.правка-низ button{font:inherit; font-size:12.5px; padding:6px 12px; border-radius:10px;
     cursor:pointer; transition:transform .14s var(--пружина), opacity .18s}
.правка-низ button:active{transform:scale(.94)}
.правка-нет{border:1px solid oklch(1 0 0 / .70); color:var(--fg-m);
     background:linear-gradient(158deg, oklch(1 0 0 / .8), oklch(0.965 0.012 210 / .68))}
.правка-да{border:1px solid var(--accent); background:var(--accent); color:#fff}
.правка-да:hover{opacity:.88}
/* ГОЛОС В КАРТОЧКЕ. Мысль встаёт в ленту в ту же секунду, когда отпустил кнопку,
   а слова догоняют с мака. Пока их нет — карточка честно говорит, чего ждёт, и даёт
   послушать: человек должен видеть, что мысль спасена, а не гадать. */
.распознаётся{color:var(--fg-l); animation:дышит 1.8s ease-in-out infinite}
.знак{width:14px; height:14px; vertical-align:-2.5px; margin-right:2px}
.низ .звук{
  font:inherit; font-size:12.5px; padding:0; border:none; background:none;
  color:var(--fg-l); display:inline-flex; align-items:center; gap:4px;
  transition:color .18s;
}
.низ .звук:active{color:var(--accent)}
.низ .звук .знак{margin:0}
@keyframes дышит{50%{opacity:.42}}
.снимки{display:flex; gap:7px; flex-wrap:wrap; margin-top:9px}
.снимки img{
  width:84px; height:84px; object-fit:cover; border-radius:12px; display:block;
  border:1px solid oklch(1 0 0 / .7); animation:проявь .3s ease;
  transition:transform .14s var(--пружина);
}
.снимки img:active{transform:scale(.95)}
/* просмотр во весь экран: снимок открывается поверх всего, закрывается касанием */
#лупа{
  position:fixed; inset:0; z-index:50; display:none; place-items:center;
  background:oklch(0.16 0.02 210 / .82); padding:16px;
  animation:проявь .18s ease;
}
#лупа.видна{display:grid}
#лупа img{max-width:100%; max-height:100%; border-radius:14px;
  animation:вырасти .24s var(--пружина)}
@keyframes вырасти{from{opacity:0; transform:scale(.92)} to{opacity:1; transform:none}}
.пусто{text-align:center; color:var(--fg-l); font-size:15px; padding:44px 14px; line-height:1.6}
mark{background:oklch(0.90 0.10 95 / .75); color:inherit; border-radius:3px; padding:0 1px}

/* ── написать ─────────────────────────────────────────────────────────────── */
footer{position:relative; padding:4px 12px calc(8px + env(safe-area-inset-bottom))}
/* «↓ К СВЕЖИМ» — как в ТГ: ушёл вверх по ленте, над полем круглая кнопка возвращает вниз */
.к-свежим{position:absolute; right:16px; bottom:calc(100% + 10px); z-index:3; width:42px; height:42px;
  display:grid; place-items:center; padding:0; border-radius:50%; cursor:pointer; color:var(--fg-m);
  background:linear-gradient(158deg, oklch(1 0 0/.9), oklch(.95 .02 210/.8)); border:1px solid oklch(1 0 0/.8);
  box-shadow:inset 0 1px 0 oklch(1 0 0/.96), 0 8px 20px -10px oklch(.2 .07 220/.45);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  opacity:0; visibility:hidden; transform:translateY(8px) scale(.9);
  transition:opacity .18s, transform .2s var(--пружина), visibility 0s linear .2s}
.к-свежим.видна{opacity:1; visibility:visible; transform:none;
  transition:opacity .18s, transform .2s var(--пружина), visibility 0s}
.к-свежим svg{width:22px; height:22px}
.к-свежим:active{transform:scale(.92)}
.к-свежим:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion:reduce){.к-свежим, .к-свежим.видна{transition:none}}
.фишки{display:flex; gap:7px; padding-bottom:8px; flex-wrap:wrap}
.фишка{position:relative; width:56px; height:56px; border-radius:12px; overflow:hidden;
  animation:явь .24s var(--пружина)}
.фишка img{width:100%; height:100%; object-fit:cover}
.фишка button{
  position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%;
  border:none; background:oklch(0.25 0.02 210 / .62); color:#fff; font-size:13px;
  line-height:1; padding:0; display:grid; place-items:center;
}
.строка{display:flex; gap:8px; align-items:flex-end}
textarea{
  flex:1; font:inherit; font-size:16px; line-height:1.4; resize:none; max-height:148px;
  padding:12px 15px; border-radius:19px; border:1px solid oklch(1 0 0 / .70); color:var(--fg);
  background:linear-gradient(158deg, oklch(1 0 0 / .82), oklch(0.965 0.012 210 / .72));
  box-shadow:inset 0 1px 0 oklch(1 0 0 / .94);
  transition:border-color .18s;
}
textarea:focus{outline:none; border-color:var(--accent)}
.круг{
  width:46px; height:46px; flex:none; border-radius:50%; display:grid; place-items:center;
  border:1px solid oklch(1 0 0 / .70); color:var(--fg-m);
  background:linear-gradient(158deg, oklch(1 0 0 / .82), oklch(0.965 0.012 210 / .72));
  box-shadow:inset 0 1px 0 oklch(1 0 0 / .94);
  transition:opacity .18s, transform .14s var(--пружина), background .2s, color .2s;
}
.круг:active{opacity:.85; transform:scale(.94)}
.круг svg{width:21px; height:21px}
/* кнопка «отправить» появляется, когда есть что отправлять — иначе не занимает внимание */
#послать{background:var(--accent); border-color:transparent; color:#fff;
  transform:scale(.6); opacity:0; pointer-events:none; width:0; margin-left:-8px}
#послать.видна{transform:scale(1); opacity:1; pointer-events:auto; width:46px; margin-left:0}
/* МИКРОФОН И «ОТПРАВИТЬ» ДЕЛЯТ ОДНО МЕСТО. В строке всегда ровно три предмета: поле,
   камера и что-то одно из них. Начал писать — говорить уже нечего, кнопка уступает.
   На узком телефоне это разница между «влезло» и «поле в две буквы шириной». */
#микрофон.нет{transform:scale(.6); opacity:0; pointer-events:none; width:0; margin-left:-8px}
#микрофон.пишет{background:var(--accent); border-color:transparent; color:#fff}
.состояние{font-size:12.5px; color:var(--fg-l); text-align:center; padding-top:5px; min-height:17px}
.запись{display:inline-flex; align-items:center; gap:6px; color:var(--accent); font-weight:600}
.запись i{width:7px; height:7px; border-radius:50%; background:var(--accent);
  animation:дышит 1.1s ease-in-out infinite}

@keyframes явь{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
@keyframes проявь{from{opacity:0} to{opacity:1}}
@keyframes кружись{to{transform:rotate(360deg)}}
.крутится{animation:кружись 1s linear infinite}

/* ── Гили на телефоне: одно лицо с «Разберёмся» ────────────────────────────
   Десктоп остаётся прежним. На телефоне Гили — не таблица заметок, а спокойный
   разговор: живой верх, бусы потоков, сообщения-листы и одна большая строка.
   Стекло неподвижное, анимации только transform/opacity — iPhone не греется. */
@media (max-width:720px){
  :root{--r:20px; --пружина:cubic-bezier(.22,1,.36,1)}
  html,body{height:100%; height:100dvh}
  body{
    font-size:16px;
    background:oklch(.91 .02 218) url('gili-sky-v1.jpg') center/cover no-repeat;
    overflow:hidden;
  }
  body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,oklch(1 0 0/.04),oklch(.92 .02 214/.16) 44%,oklch(.78 .06 210/.24));}
  #сцена{display:block;position:fixed;inset:0;z-index:1;width:100%;height:100%;pointer-events:none;opacity:.55}
  /* живое небо: та же картинка, но облака плывут, а море дышит. Проявляется, когда готов
     первый кадр; до того и без WebGL остаётся фото фоном body — разницы глаз не заметит. */
  #небо{display:block;position:fixed;inset:0;z-index:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity 1.2s ease}
  #небо.живо{opacity:1}
  #старт,#вход,#приложение{position:relative;z-index:2}
  #старт{display:flex;flex-direction:column;align-items:center;gap:12px;color:oklch(.25 .05 215);opacity:1}
  #старт[hidden]{display:none}
  #старт .крутится{opacity:.62}
  .старт-слово{display:flex;flex-direction:column;align-items:center;text-shadow:0 1px 12px oklch(1 0 0/.8)}
  .старт-слово strong{font-size:25px;font-weight:720}
  .старт-слово span{font-size:13px;color:oklch(.38 .04 215)}
  #приложение{width:100%; min-height:0; flex:1; display:flex; flex-direction:column; overflow:hidden}
  #приложение[hidden]{display:none}

  header{padding:10px 14px 4px; flex:none}
  .мобильный-бренд{height:48px; display:flex; align-items:center; gap:11px; padding:0 3px 7px}
  .мобильный-знак{
    width:38px; height:38px; flex:none; display:grid; place-items:center; border-radius:13px;
    color:oklch(0.43 0.13 218);
    background:linear-gradient(150deg,oklch(1 0 0/.86),oklch(.95 .022 210/.65));
    border:1px solid oklch(1 0 0/.82);
    box-shadow:inset 0 1px 0 oklch(1 0 0/.96),0 5px 14px -6px oklch(.32 .06 218/.25);
  }
  .мобильный-знак svg{width:24px;height:24px;overflow:visible}
  .мобильный-знак circle{transform-origin:center;animation:сигнал 2.8s ease-in-out infinite}
  .мобильный-знак circle:nth-child(2){animation-delay:-.9s}
  .мобильный-знак circle:nth-child(3){animation-delay:-1.8s}
  .мобильный-имя{min-width:0; display:flex; flex-direction:column; line-height:1.1}
  .мобильный-имя strong{font-size:21px; font-weight:710; letter-spacing:0}
  .мобильный-имя span{margin-top:4px; color:var(--fg-l); font-size:11.5px; font-weight:500}
  .живая-связь{margin-left:auto; display:flex; align-items:center; gap:6px; color:var(--fg-l); font-size:11.5px}
  .живая-связь i{width:7px;height:7px;border-radius:50%;background:oklch(.58 .13 158);box-shadow:0 0 0 4px oklch(.75 .08 158/.18)}
  .живая-связь.нет i{background:oklch(.62 .04 215);box-shadow:0 0 0 4px oklch(.75 .03 215/.16)}
  .живая-связь .верс{font-weight:600;font-size:10px;opacity:.4;letter-spacing:.3px}

  .потоки{
    gap:7px; padding:3px 1px 7px; overflow-x:auto; scrollbar-width:none;
    border:0; border-radius:0; background:transparent; scroll-snap-type:x proximity;
  }
  .потоки::-webkit-scrollbar{display:none}
  .потоки button{
    flex:0 0 auto; min-width:72px; padding:8px 14px; border-radius:999px; scroll-snap-align:start;
    font-size:13px; font-weight:570; color:var(--fg-m);
    border:1px solid oklch(1 0 0/.66); background:oklch(1 0 0/.28);
    box-shadow:inset 0 1px 0 oklch(1 0 0/.55);
    transition:transform .14s var(--пружина),background .18s,color .18s;
  }
  .потоки button:active{transform:scale(.96)}
  .потоки button.on{
    color:oklch(.31 .075 218); font-weight:680;
    background:linear-gradient(155deg,oklch(1 0 0/.92),oklch(.95 .025 212/.75));
    border-color:oklch(1 0 0/.86);
    box-shadow:inset 0 1px 0 oklch(1 0 0/.98),0 5px 15px -8px oklch(.30 .08 218/.34);
  }

  .подшапка{gap:7px; padding:3px 14px 7px; flex:none; position:relative}
  .поиск-знак{display:grid; place-items:center; position:absolute; left:27px; z-index:1; color:var(--fg-l); pointer-events:none}
  .поиск-знак svg{width:16px;height:16px}
  .подшапка input{
    min-width:0; height:42px; padding:9px 13px 9px 37px; border-radius:15px; font-size:14px;
    background:oklch(1 0 0/.47); border-color:oklch(1 0 0/.66);
    box-shadow:inset 0 1px 0 oklch(1 0 0/.72);
  }
  .вид{height:42px; padding:7px 12px; border-radius:15px; background:oklch(1 0 0/.42)}
  .подшапка .кто{display:none}

  main{min-height:0; justify-content:flex-start; gap:0; padding:4px 14px 12px; scroll-padding-bottom:18px}
  .день{margin:12px 0 8px; font-size:11.5px; font-weight:580; letter-spacing:.01em}
  .мысль{
    width:94%; padding:13px 15px 11px; margin-bottom:9px; border-radius:20px;
    font-size:15.5px; line-height:1.46;
    translate:0 var(--gravity,0);
    background:linear-gradient(155deg,oklch(1 0 0/.82),oklch(.96 .015 214/.68));
    border-color:oklch(1 0 0/.74);
    box-shadow:inset 0 1px 0 oklch(1 0 0/.94),0 8px 22px -15px oklch(.30 .07 218/.32);
    animation:мысль-вход .28s var(--пружина);
  }
  .мысль.своя{align-self:flex-end; border-bottom-right-radius:8px}
  .мысль.чужая{
    align-self:flex-start; border-bottom-left-radius:8px;
    background:linear-gradient(155deg,oklch(.98 .018 188/.84),oklch(.93 .028 196/.70));
  }
  .мысль.готовая{opacity:.56}
  .низ{margin-top:7px; gap:5px; font-size:11.5px}
  .снимки img{width:76px;height:76px;border-radius:13px}
  .пусто{margin:auto 0; padding:44px 24px; font-size:15px}

  footer{
    flex:none; padding:8px 12px max(9px,env(safe-area-inset-bottom));
    background:linear-gradient(180deg,oklch(.91 .018 216/0),oklch(.91 .018 216/.94) 25%);
  }
  .фишки{padding:0 3px 7px}
  .строка{
    min-height:58px; gap:3px; align-items:flex-end; padding:5px; border-radius:23px;
    background:linear-gradient(155deg,oklch(1 0 0/.82),oklch(.95 .018 214/.72));
    border:1px solid oklch(1 0 0/.78);
    box-shadow:inset 0 1px 0 oklch(1 0 0/.96),0 9px 28px -16px oklch(.27 .07 218/.42);
  }
  .строка textarea{
    order:2; min-width:0; min-height:46px; max-height:132px; padding:12px 8px 10px;
    border:0; border-radius:16px; background:transparent; box-shadow:none; font-size:16px;
  }
  .строка textarea:focus{border:0}
  .строка textarea::placeholder{color:var(--fg-l);opacity:.9}
  .круг{width:44px;height:44px; border:0; color:oklch(.43 .10 216); background:transparent; box-shadow:none}
  .круг svg{width:22px;height:22px}
  #камера{order:1}
  #микрофон,#послать{order:3}
  #послать{height:44px;border-radius:16px;background:oklch(.43 .13 218);box-shadow:inset 0 1px 0 oklch(1 0 0/.30),0 5px 12px -6px oklch(.30 .12 218/.55)}
  #послать.видна{width:44px;margin-left:0}
  #микрофон.пишет{border-radius:16px;background:oklch(.43 .13 218);color:white}
  .состояние{min-height:0;padding-top:4px;font-size:11.5px}
  .состояние:empty{display:none}
  #камера.манит,#микрофон.манит{animation:позови 1.15s var(--пружина) 2}

  .фото-меню{position:fixed;inset:0;z-index:90;align-items:flex-end;justify-content:center;padding:12px 12px max(12px,env(safe-area-inset-bottom))}
  .фото-меню.открыта{display:flex}
  .фото-тень{position:absolute;inset:0;border:0;background:oklch(.12 .025 215/.30);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
  .фото-лист{
    position:relative;z-index:1;width:100%;max-width:480px;max-height:min(78dvh,680px);overflow:auto;
    padding:10px 14px 16px;border-radius:30px;
    background:linear-gradient(155deg,oklch(1 0 0/.88),oklch(.94 .022 210/.74));
    border:1px solid oklch(1 0 0/.86);box-shadow:inset 0 1px 0 oklch(1 0 0/.98),0 26px 70px -30px oklch(.20 .07 220/.55);
    animation:фото-вверх .34s var(--пружина);
  }
  .фото-ручка{width:38px;height:4px;border-radius:4px;background:oklch(.45 .02 215/.18);margin:1px auto 12px}
  .фото-шапка{display:flex;align-items:flex-start;justify-content:space-between;margin:0 2px 14px}
  .фото-шапка strong{display:block;font-size:21px;line-height:1.2}
  .фото-шапка span{display:block;margin-top:3px;font-size:12px;color:var(--fg-l)}
  .фото-закрыть{width:34px;height:34px;border:0;border-radius:50%;background:oklch(.45 .04 215/.09);font:inherit;font-size:20px;color:var(--fg-m)}
  .фото-источники{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .фото-источник{
    min-height:112px;border-radius:21px;border:1px solid oklch(1 0 0/.78);padding:14px;
    display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;
    color:var(--fg);font:inherit;font-weight:650;
    background:linear-gradient(150deg,oklch(1 0 0/.72),oklch(.91 .035 210/.58));
    box-shadow:inset 0 1px 0 oklch(1 0 0/.96);transition:transform .14s var(--пружина);
  }
  .фото-источник:active{transform:scale(.97)}
  .фото-источник svg{width:29px;height:29px;color:oklch(.42 .12 215)}
  .фото-источник small{display:block;font-size:11px;font-weight:500;color:var(--fg-l);margin-top:2px}
  .фото-сетка{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
  .фото-кадр{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:14px;overflow:hidden;background:oklch(.88 .02 215)}
  .фото-кадр img{width:100%;height:100%;object-fit:cover;display:block}
  .фото-кадр b{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:oklch(.18 .02 215/.7);color:white;font-size:15px;font-weight:500}
  .фото-подпись{width:100%;margin-top:10px;min-height:52px;max-height:110px;padding:13px 14px;border-radius:16px;border:1px solid oklch(1 0 0/.8);background:oklch(1 0 0/.56);box-shadow:inset 0 1px 0 oklch(1 0 0/.9)}
  .фото-действия{display:flex;gap:8px;margin-top:10px}
  .фото-еще,.фото-готово{height:46px;border-radius:15px;font:inherit;font-weight:650}
  .фото-еще{width:48px;border:1px solid oklch(1 0 0/.8);background:oklch(1 0 0/.5);color:var(--accent);font-size:23px}
  .фото-готово{flex:1;border:0;background:oklch(.40 .14 218);color:white}
  .фото-пусто{text-align:center;color:var(--fg-l);font-size:13px;padding:14px 4px 2px}

  @keyframes позови{0%,100%{transform:none}45%{transform:translateY(-3px) scale(1.10)}70%{transform:translateY(1px) scale(.98)}}
  @keyframes фото-вверх{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}

  @keyframes сигнал{0%,100%{opacity:.35;transform:scale(.84)}50%{opacity:1;transform:scale(1)}}
  @keyframes мысль-вход{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
}

/* ── v25 · AERO LIQUID OS ──────────────────────────────────────────────────
   Не обои с кнопками, а три физических слоя: воздух в шапке, оптические
   пластины мыслей и водяной док ввода. На длинной ленте карточки намеренно
   без backdrop-filter: кромка и внутренний свет дают глубину дешевле. */
@media (max-width:720px){
  :root{
    --aero:oklch(.46 .13 218);
    --aero-hi:oklch(.79 .12 204);
    --glass-line:oklch(1 0 0/.84);
  }
  body::before{
    content:"";position:fixed;z-index:1;pointer-events:none;
    width:72vw;height:72vw;left:-38vw;top:16dvh;border-radius:50%;
    background:radial-gradient(circle,oklch(.88 .11 198/.22),transparent 66%);
    mix-blend-mode:screen;opacity:.72;
    animation:аэро-дрейф 13s ease-in-out infinite alternate;
  }

  header{
    position:relative;isolation:isolate;overflow:hidden;
    padding:9px 14px 7px;
    background:
      radial-gradient(90% 150% at 4% -40%,oklch(1 0 0/.72),transparent 61%),
      linear-gradient(165deg,oklch(1 0 0/.38),oklch(.90 .035 210/.19));
    border-bottom:1px solid oklch(1 0 0/.66);
    box-shadow:inset 0 1px 0 oklch(1 0 0/.82),0 14px 36px -28px oklch(.25 .10 220/.55);
    backdrop-filter:blur(11px) saturate(1.25);
    -webkit-backdrop-filter:blur(11px) saturate(1.25);
  }
  header::before{
    content:"";position:absolute;z-index:-1;top:-45%;bottom:-45%;left:-42%;width:36%;
    background:linear-gradient(90deg,transparent,oklch(1 0 0/.50),transparent);
    transform:skewX(-18deg);animation:аэро-скан 8s ease-in-out infinite;
  }
  header::after{
    content:"";position:absolute;left:15%;right:15%;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,var(--aero-hi),transparent);
    opacity:.82;
  }
  .мобильный-бренд{height:55px;gap:12px;padding:0 2px 8px}
  .мобильный-знак{
    position:relative;width:44px;height:44px;border-radius:17px;
    color:oklch(.39 .16 218);
    background:
      radial-gradient(circle at 32% 22%,oklch(1 0 0/.96),transparent 32%),
      linear-gradient(145deg,oklch(.98 .02 202/.82),oklch(.80 .09 211/.44));
    border:1px solid oklch(1 0 0/.92);
    box-shadow:inset 0 1px 1px white,inset 0 -7px 18px oklch(.54 .13 211/.12),
               0 7px 18px -8px oklch(.28 .14 220/.55);
  }
  .мобильный-знак::before{
    content:"";position:absolute;inset:-5px;border-radius:21px;
    border:1px solid oklch(.80 .11 205/.38);opacity:.72;
    animation:аэро-кольцо 3.6s ease-in-out infinite;
  }
  .мобильный-знак::after{
    content:"";position:absolute;width:5px;height:5px;border-radius:50%;right:-3px;top:8px;
    background:oklch(.72 .16 191);box-shadow:0 0 12px 3px oklch(.72 .16 191/.42);
  }
  .мобильный-имя strong{font-size:22px;font-weight:760}
  .мобильный-имя span{color:oklch(.34 .045 218/.72);font-size:11px}
  .живая-связь{
    padding:6px 8px;border-radius:999px;background:oklch(1 0 0/.24);
    border:1px solid oklch(1 0 0/.38);color:oklch(.32 .04 215/.70);
  }
  .живая-связь i{box-shadow:0 0 0 3px oklch(.75 .10 158/.16),0 0 11px oklch(.60 .16 158/.55)}
  .живая-связь .верс{display:none}

  .потоки{gap:8px;padding:3px 0 3px}
  .потоки button{
    position:relative;overflow:hidden;min-width:76px;padding:9px 15px;
    border-color:oklch(1 0 0/.60);
    background:linear-gradient(155deg,oklch(1 0 0/.34),oklch(.87 .05 210/.16));
    box-shadow:inset 0 1px 0 oklch(1 0 0/.60);
  }
  .потоки button::after{
    content:"";position:absolute;left:25%;right:25%;bottom:3px;height:2px;border-radius:2px;
    background:var(--aero-hi);opacity:0;transform:scaleX(.25);
    transition:opacity .2s,transform .32s var(--пружина);
  }
  .потоки button.on{
    color:oklch(.26 .10 219);
    background:
      radial-gradient(100% 180% at 16% -30%,white,transparent 52%),
      linear-gradient(145deg,oklch(.95 .035 206/.90),oklch(.77 .11 211/.54));
    box-shadow:inset 0 1px 0 white,inset 0 -8px 20px oklch(.52 .13 216/.10),
               0 7px 20px -11px oklch(.29 .15 221/.64);
  }
  .потоки button.on::after{opacity:1;transform:scaleX(1)}

  .подшапка{
    padding:9px 13px 8px;
    background:linear-gradient(180deg,oklch(.88 .035 212/.24),transparent);
  }
  .подшапка input,.вид{
    border:1px solid var(--glass-line);
    background:
      radial-gradient(100% 160% at 10% -40%,white,transparent 54%),
      linear-gradient(145deg,oklch(1 0 0/.62),oklch(.85 .06 210/.34));
    box-shadow:inset 0 1px 0 white,0 7px 18px -14px oklch(.24 .12 218/.60);
  }
  .подшапка input:focus{border-color:oklch(.73 .12 207/.85);box-shadow:inset 0 1px 0 white,0 0 0 3px oklch(.72 .12 207/.15)}
  .вид{font-weight:690;color:oklch(.31 .075 218)}

  main{perspective:900px;padding-top:8px}
  .день{
    align-self:center;padding:4px 10px;border-radius:999px;
    color:oklch(.29 .05 216/.70);background:oklch(1 0 0/.22);
    border:1px solid oklch(1 0 0/.30);text-shadow:0 1px 8px white;
  }
  .мысль{
    position:relative;isolation:isolate;overflow:hidden;
    padding:15px 16px 11px;border-radius:23px;
    scale:var(--focus,1);
    background:
      radial-gradient(100% 100% at 0 0,oklch(1 0 0/.94),transparent 48%),
      linear-gradient(145deg,oklch(.99 .008 206/.79),oklch(.83 .075 211/.55));
    border:1px solid var(--glass-line);
    box-shadow:inset 0 1px 0 white,inset 0 -12px 28px oklch(.53 .10 213/.08),
               0 14px 34px -22px oklch(.22 .12 220/.62);
  }
  .мысль::before{
    content:"";position:absolute;z-index:-1;left:-15%;top:-26px;width:68%;height:58px;

  @keyframes аэро-дрейф{from{transform:translate3d(0,-4%,0) scale(.94);opacity:.46}to{transform:translate3d(54vw,12%,0) scale(1.13);opacity:.78}}

}

/* ── v27 · FLUID FIELD ─────────────────────────────────────────────────────
   Контролы больше не отдельные плашки. Потоки живут в общей линзе, сообщения
   преломляют сцену, а камера и голос являются световыми точками одного дока. */
@media (max-width:720px){
  :root{
    --ion-cyan:oklch(.78 .17 194);
    --ion-blue:oklch(.59 .20 239);
    --ion-mint:oklch(.80 .14 164);
    --touch-x:50vw;--touch-y:50dvh;
  }
  body::before{
    width:68vw;height:68vw;left:0;top:0;
    background:radial-gradient(circle,
      oklch(.83 .18 190/.30) 0%,
      oklch(.70 .17 230/.12) 35%,
      transparent 68%);
    opacity:.82;animation:none;mix-blend-mode:screen;
    transform:translate3d(calc(var(--touch-x) - 34vw),calc(var(--touch-y) - 34vw),0);
    transition:transform .7s cubic-bezier(.16,1,.3,1);
    will-change:transform;
  }

  header{
    overflow:visible;padding:8px 14px 5px;
    background:transparent;border:0;box-shadow:none;
    backdrop-filter:none;-webkit-backdrop-filter:none;
  }
  header::before{
    z-index:-1;inset:-20px -12px -12px;
    width:auto;background:
      radial-gradient(70% 75% at 12% 12%,oklch(1 0 0/.34),transparent 70%);
    transform:none;animation:поле-дыхание 7s ease-in-out infinite;
  }
  header::after{display:none}
  .мобильный-бренд{height:53px}
  .мобильный-знак{
    width:43px;height:43px;border-radius:50%;color:oklch(.30 .18 225);
    background:oklch(1 0 0/.18);border:0;
    box-shadow:inset 0 0 0 1px oklch(1 0 0/.52),
               inset 7px 9px 18px oklch(1 0 0/.28),
               0 0 24px oklch(.68 .18 202/.22);
    backdrop-filter:blur(10px) saturate(1.5);-webkit-backdrop-filter:blur(10px) saturate(1.5);
  }
  .мобильный-знак::before{
    inset:-4px;border:0;

    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 1px),#000 0);
    mask:radial-gradient(farthest-side,transparent calc(100% - 1px),#000 0);
    animation:кольцо-плывёт 7s linear infinite;opacity:.78;

  .мобильный-знак::after{width:4px;height:4px;right:1px;top:4px;background:var(--ion-cyan)}
  .мобильный-имя strong{font-size:23px;font-weight:730}
  .мобильный-имя span{opacity:.70}
  .живая-связь{padding:0;background:none;border:0;font-size:10.5px}
  .живая-связь i{width:6px;height:6px}

  .потоки{
    position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;
    padding:4px;border-radius:22px;overflow:hidden;
    background:oklch(1 0 0/.15);border:0;
    box-shadow:inset 0 0 0 1px oklch(1 0 0/.32),0 14px 32px -26px oklch(.23 .19 230/.70);
    backdrop-filter:blur(14px) saturate(1.55);-webkit-backdrop-filter:blur(14px) saturate(1.55);
  }
  .потоки button{
    isolation:isolate;min-width:0;padding:9px 3px;border:0;border-radius:18px;
    background:none;box-shadow:none;color:oklch(.26 .045 220/.68);
    font-size:12.5px;font-weight:570;
  }
  .потоки button::before{
    content:"";position:absolute;z-index:-1;inset:0;border-radius:inherit;
    background:linear-gradient(115deg,oklch(.82 .18 188/.46),oklch(.63 .19 239/.26),oklch(.82 .15 165/.38));
    opacity:0;transform:scale(.72);transition:transform .48s cubic-bezier(.16,1,.3,1),opacity .28s;
    will-change:transform,opacity;
  }
  .потоки button::after{
    left:42%;right:42%;bottom:4px;height:3px;background:var(--ion-cyan);
    box-shadow:0 0 10px var(--ion-cyan);
  }
  .потоки button.on{background:none;border:0;box-shadow:inset 0 0 0 1px oklch(1 0 0/.26);color:oklch(.20 .11 226);font-weight:710}
  .потоки button.on::before{opacity:1;transform:scale(1);animation:линза-цвет 6s ease-in-out infinite alternate}

  .подшапка{padding:8px 14px 5px;background:none}
  .подшапка input{
    height:44px;border:0;border-radius:22px;
    background:oklch(1 0 0/.19);
    box-shadow:inset 0 0 0 1px oklch(1 0 0/.35),inset 8px 10px 24px oklch(1 0 0/.15);
    backdrop-filter:blur(15px) saturate(1.5);-webkit-backdrop-filter:blur(15px) saturate(1.5);
  }
  .подшапка input:focus{border:0;box-shadow:inset 0 0 0 1px oklch(.80 .16 190/.65),0 0 24px oklch(.70 .18 200/.18)}
  .вид{
    width:auto;height:44px;padding:0 7px;border:0;border-radius:0;
    background:none;box-shadow:none;color:oklch(.24 .10 220/.78);font-size:11px;
  }

  main{padding:8px 14px 15px;perspective:1100px}
  .день{
    width:100%;display:flex;align-items:center;gap:9px;padding:2px 0;
    background:none;border:0;text-shadow:0 1px 9px white;
  }
  .день::before,.день::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,oklch(1 0 0/.52))}
  .день::after{transform:scaleX(-1)}
  .мысль{
    width:92%;padding:16px 17px 12px;border:0;border-radius:30px 30px 30px 11px;
    translate:0 var(--gravity,0);scale:var(--focus,1);
    transform:perspective(900px) rotateX(var(--tilt,0deg));
    transition:transform .16s linear,scale .16s linear;
    color:oklch(.17 .025 224);
    background:linear-gradient(140deg,oklch(1 0 0/.34),oklch(.78 .12 198/.13));
    box-shadow:inset 0 0 0 1px oklch(1 0 0/.53),
               inset 10px 14px 30px oklch(1 0 0/.12),
               0 18px 40px -28px oklch(.18 .19 226/.72);
    backdrop-filter:blur(17px) saturate(1.55) brightness(1.05);
    -webkit-backdrop-filter:blur(17px) saturate(1.55) brightness(1.05);
    /* content-visibility:auto здесь был и убран 26.09: WebKit в Гили.app рисовал карточку пустым стеклом,
       текст появлялся только после второго нажатия на вкладку (снимок Жени 14:35). До этого та же ленивость
       уводила низ ленты (к_низу, 23.09). Карточек во вкладке единицы — выигрыша от неё нет, а сбоев два. */
  }
  .мысль::before{
    z-index:0;left:-45%;top:-20%;width:28%;height:140%;border-radius:0;filter:none;
    background:linear-gradient(90deg,transparent,oklch(.86 .16 188/.16),oklch(1 0 0/.38),transparent);
    transform:skewX(-17deg);animation:призма 11s ease-in-out infinite;
    will-change:transform,opacity;
  }
  .мысль:nth-of-type(3n)::before{animation-delay:-3.7s}
  .мысль:nth-of-type(3n+1)::before{animation-delay:-7.4s}
  .мысль::after{
    right:18px;top:12px;width:30px;height:2px;border:0;border-radius:4px;
    background:linear-gradient(90deg,transparent,var(--ion-cyan));box-shadow:0 0 10px oklch(.75 .18 195/.30);
  }
  .мысль.своя{border-radius:30px 30px 11px 30px;background:linear-gradient(140deg,oklch(1 0 0/.31),oklch(.65 .16 232/.11))}
  .мысль.чужая{
    border-radius:30px 30px 30px 11px;
    background:linear-gradient(140deg,oklch(1 0 0/.30),oklch(.72 .17 173/.13));
    box-shadow:inset 0 0 0 1px oklch(1 0 0/.48),inset 3px 0 0 oklch(.76 .18 174/.40),0 18px 40px -28px oklch(.16 .17 194/.70);
  }
  .низ{position:relative;z-index:1;padding-top:8px;border:0;color:oklch(.25 .05 224/.62)}

  footer{padding:8px 11px max(10px,env(safe-area-inset-bottom));background:none}
  .строка{
    min-height:62px;padding:6px 8px;border:0;border-radius:31px;
    background:oklch(1 0 0/.18);
    box-shadow:inset 0 0 0 1px oklch(1 0 0/.50),inset 10px 14px 28px oklch(1 0 0/.15),0 20px 46px -25px oklch(.17 .20 231/.74);
    backdrop-filter:blur(18px) saturate(1.65);-webkit-backdrop-filter:blur(18px) saturate(1.65);
  }
  .строка textarea{min-height:50px;font-weight:540}
  .круг{
    width:50px;height:50px;border:0;border-radius:50%;background:transparent;box-shadow:none;
    color:oklch(.27 .18 221);
  }
  .круг::before{
    content:"";position:absolute;inset:7px;border-radius:50%;
    background:radial-gradient(circle,oklch(.82 .18 188/.23),transparent 68%);
    opacity:.64;animation:орган-дышит 3.4s ease-in-out infinite;
    will-change:transform,opacity;
  }
  .круг svg{position:relative;z-index:1;filter:drop-shadow(0 0 7px oklch(.70 .18 202/.35))}
  #послать,#микрофон.пишет{
    color:white;background:linear-gradient(145deg,oklch(.76 .18 187/.82),oklch(.43 .22 238/.86));
    box-shadow:inset 0 0 0 1px oklch(1 0 0/.38),0 0 24px oklch(.55 .22 220/.34);
    will-change:transform,opacity;
  }
  .фото-лист{background:oklch(.90 .045 202/.55);backdrop-filter:blur(22px) saturate(1.65);-webkit-backdrop-filter:blur(22px) saturate(1.65)}
  .фото-источники{padding:4px;border-radius:25px;background:oklch(1 0 0/.13);box-shadow:inset 0 0 0 1px oklch(1 0 0/.30)}
  .фото-источник{min-height:104px;border:0;background:transparent;box-shadow:none}
  .фото-источник svg{width:45px;height:45px;padding:10px;border-radius:17px;background:oklch(1 0 0/.18);box-shadow:inset 0 0 0 1px oklch(1 0 0/.30)}

  @keyframes поле-дыхание{50%{opacity:.54;transform:translateY(3px)}}
  @keyframes кольцо-плывёт{to{transform:rotate(360deg)}}
  @keyframes линза-цвет{from{transform:scale(1) translateX(-1px)}to{transform:scale(1.035) translateX(1px)}}
  @keyframes призма{0%,68%{transform:translateX(0) skewX(-17deg);opacity:0}76%{opacity:.72}100%{transform:translateX(560%) skewX(-17deg);opacity:0}}
  @keyframes орган-дышит{0%,100%{transform:scale(.76);opacity:.35}50%{transform:scale(1.20);opacity:.82}}
}

@media (prefers-reduced-motion: reduce){

<canvas id="небо" aria-hidden="true"></canvas>
<canvas id="сцена" aria-hidden="true"></canvas>

<div id="старт">

</div>

    <div class="мобильный-бренд">

          <circle cx="8" cy="12" r="1.15" fill="currentColor" stroke="none"/>
          <circle cx="12" cy="12" r="1.15" fill="currentColor" stroke="none"/>
          <circle cx="16" cy="12" r="1.15" fill="currentColor" stroke="none"/>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round">

/* Порядок потоков — Женин (10.08): дом и семья первыми, работа и код дальше.

const ПОТОКИ = [
  {код:'дом',    имя:'Дом'},
  {код:'семья',  имя:'Семья'},
  {код:'работа', имя:'Работа'},

/* КТО В КАКИХ ОБЩИХ ПОТОКАХ (25.09). Женя 19:08: «Все в срм видят всё одинаково, все равноправные

const ОБЩИЕ = {};                              // id человека → его общие потоки
const общие_у = ч => Array.isArray(ч && ч.flows) ? ч.flows : ['семья'];
function мои_вкладки(){
  // у семьи все четыре потока: свои личные и общие. У команды только общие: личную мысль
  // Олега дом не забирает, пустая вкладка на экране только путала бы
  const мои = (Я && Я.потоки) || ['семья'];
  return мои.includes('семья') ? ПОТОКИ : ПОТОКИ.filter(п => мои.includes(п.код));
}
function кто_ещё_прочтёт(поток){
  const мои = (Я && Я.потоки) || ['семья'];
  if(!Я || !мои.includes(поток)) return [];
  if(!Object.keys(ОБЩИЕ).length) return ['свои'];   // список людей ещё едет (или нет сети)
  return Object.keys(ОБЩИЕ).filter(ид => ид !== Я.id && ОБЩИЕ[ид].includes(поток))
    .map(ид => СЕМЬЯ[ид]).filter(Boolean);
}
const ПАМЯТЬ_ЛЕНТЫ = 'гили_лента', ПАМЯТЬ_ОЧЕРЕДИ = 'гили_очередь', ПАМЯТЬ_ПОТОКА = 'гили_поток';
const ПАМЯТЬ_КТО = 'гили_кто';   // кто вошёл в прошлый раз — чтобы открываться без сети

let Я = null, МЫСЛИ = [], ФОТО = [], ИСКОМОЕ = '';
let ПОТОК = localStorage.getItem(ПАМЯТЬ_ПОТОКА) || 'дом';

const $ = id => document.getElementById(id);
const экран = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── вход ─────────────────────────────────────────────────────────────────────
   Пароля нет: в «Разберёмся» вход по коду из письма, и здесь тот же аккаунт.
   Экран входа показывается не сразу, а только когда выяснилось, что человек

let ЖДЁМ_КОД = false, ПОЧТА = '';

$('войти').onclick = () => ЖДЁМ_КОД ? проверить_код() : прислать_код();

function сказать(текст, плохо){
  $('сказ').textContent = текст;
  $('сказ').classList.toggle('плохо', !!плохо);
}

async function прислать_код(){
  const почта = $('почта').value.trim().toLowerCase();
  if(!почта.includes('@')){ сказать('нужна почта', true); return; }
  $('войти').disabled = true; сказать('отправляю…');

  $('войти').disabled = false;
  if(error){ сказать(по_русски(error), true); return; }
  ПОЧТА = почта; ЖДЁМ_КОД = true;

async function проверить_код(){
  const код = $('код').value.replace(/\D/g, '');

  $('войти').disabled = false;
  if(error){ сказать('код не подошёл — проверь письмо', true); return; }
  await поднять();
}

function по_русски(e){
  const t = (e.message || '').toLowerCase();
  if(t.includes('rate') || t.includes('seconds')) return 'слишком часто — подожди минуту';
  if(t.includes('network') || t.includes('fetch') || t.includes('failed')) return 'нет связи — попробуй позже';
  return e.message || 'не вышло';
}

function показать(что){
  for(const id of ['старт','вход','приложение']) $(id).hidden = (id !== что);
}

/* МГНОВЕННЫЙ СТАРТ. Женя 11.09: «на телефоне медленно грузится… приложение непригодное».
   Замер показал, почему: прежде чем показать хоть что-то, приложение ждало ДВА сетевых

   при каждом открытии ради проверки, ответ которой не менялся месяцами.
   Теперь: входил раньше — лента на экране сразу, проверка личности идёт следом в фоне.

   Безопасность не страдает: данные отдаёт база по правам, а не экран. */
function кто_в_памяти(){
  try{ const с = JSON.parse(localStorage.getItem(ПАМЯТЬ_КТО) || 'null');
       return (с && с.id && с.имя) ? с : null; }catch{ return null; }
}
function забыть_кто(){ try{ localStorage.removeItem(ПАМЯТЬ_КТО); }catch{} }

function открыть_ленту(){
  нарисовать_потоки();
  МЫСЛИ = из_памяти(ПАМЯТЬ_ЛЕНТЫ);

async function поднять(){
  const запомнен = кто_в_памяти();
  if(запомнен){                       // ← экран появляется здесь, до всякой сети
    Я = запомнен;
    $('кто').textContent = запомнен.имя;
    показать('приложение');
    открыть_ленту();
    загрузить().then(() => { if(МЫСЛИ.some(ждёт_слов)) догонять_голос(); });
  }
  // ВХОД НЕ ДОЛЖЕН ЖДАТЬ СЕТИ. Женя 13.09: «хочу чтобы он при любых раскладах записывал… даже офлайн».
  // getUser() ходит на сервер. Без сети он возвращает user:null (или ошибку сети) — и старый код
  // выкидывал залогиненного ко входу и стирал память, после чего приложение скрыто и писать некуда.
  // Теперь: сеть молчит → остаёмся тем, кем себя помним, запись копится в очереди и уедет сама.
  // Ко входу выкидываем только на ЯВНЫЙ ответ сервера «ты не тот» (получен при живой сети).
  let user = null, ошибка_входа = null;
  try{ const r = await sb.auth.getUser(); user = r.data && r.data.user; ошибка_входа = r.error; }
  catch(e){ ошибка_входа = e; }
  const сеть_молчит = !navigator.onLine ||
    (ошибка_входа && /fetch|network|timeout|failed|retryable|load/i.test((ошибка_входа.name||'') + ' ' + (ошибка_входа.message||'')));
  if(сеть_молчит){
    if(!запомнен) показать('вход');   // впервые открыли без сети и без памяти — показать нечего
    return;                            // помним человека → он уже в приложении, очередь довезёт
  }
  if(!user){ забыть_кто(); показать('вход'); return; }

  // «*», а не список полей: до запуска команда.sql поля flows нет, и именованный запрос уронил бы вход
  const {data: свой, error: ошибка_семьи} = await sb.from('gili_family').select('*').eq('user_id', user.id).maybeSingle();
  if(ошибка_семьи){                     // база молчит (таймаут/403) — не выходим, если помним себя
    if(!запомнен) показать('вход');
    return;
  }
  if(!свой){
    забыть_кто();
    показать('вход');
    сказать('этот адрес ещё не добавлен в Гили — скажи Жене', true);
    await sb.auth.signOut(); return;
  }
  const потоки_были = JSON.stringify(запомнен && запомнен.потоки);
  Я = {id: user.id, имя: свой.name, потоки: общие_у(свой)};
  try{ localStorage.setItem(ПАМЯТЬ_КТО, JSON.stringify(Я)); }catch{}   // следующий раз откроется сразу
  $('кто').textContent = свой.name;
  показать('приложение');
  // быстрый старт нарисовал вкладки из памяти; база сказала другое (Олега добавили в «Работу») — перерисовать
  if(запомнен && потоки_были !== JSON.stringify(Я.потоки)){ нарисовать_потоки(); нарисовать(); }

  sb.from('gili_family').select('*').then(({data}) => {
    if(data){ data.forEach(ч => { СЕМЬЯ[ч.user_id] = ч.name; ОБЩИЕ[ч.user_id] = общие_у(ч); });
              подпись_потока(); нарисовать(); }
  });

  if(!запомнен){
    открыть_ленту();                  // при мгновенном старте это уже нарисовано выше
    загрузить().then(() => { if(МЫСЛИ.some(ждёт_слов)) догонять_голос(); });
  }
  подписаться();
  везти_очередь();
}

/* ── потоки ───────────────────────────────────────────────────────────────── */
function нарисовать_потоки(){
  const вкладки = мои_вкладки();
  if(!вкладки.some(п => п.код === ПОТОК)) ПОТОК = вкладки[0].код;   // у Олега нет «Дома» — сразу «Работа»
  // одна вкладка («Работа» у Олега) остаётся на виду: выбирать не из чего, зато видно, куда пишешь
  $('потоки').innerHTML = вкладки.map(п =>
    `<button data-код="${п.код}" class="${п.код === ПОТОК ? 'on' : ''}">${п.имя}</button>`).join('');
  подпись_потока();
  $('потоки').querySelectorAll('button').forEach(б => б.onclick = () => {
    ПОТОК = б.dataset.код;
    localStorage.setItem(ПАМЯТЬ_ПОТОКА, ПОТОК);
    $('потоки').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === б));
    подпись_потока();
    нарисовать();
    к_низу();
  });
}

/* Кто прочтёт написанное — должно быть видно до того, как человек написал. */

/* ── лента ────────────────────────────────────────────────────────────────── */
const из_памяти = ключ => { try{ return JSON.parse(localStorage.getItem(ключ) || '[]'); }catch{ return []; } };
const в_память = (ключ, что) => { try{ localStorage.setItem(ключ, JSON.stringify(что)); }catch{} };

async function загрузить(){
  // Все поля, а не список: колонку с разбором ссылки (link_summary) Дом добавит в облако
  // сам, и именованный select до её появления уронил бы всю ленту, а «*» просто подхватит.
  // 500, а не 200: с 24.09 в облаке и мысли мака (246 и растёт), старые жили бы только
  // полосой без содержимого, и поиск их не находил.
  const {data, error} = await sb.from('gili_notes')
    .select('*')
    .order('created_at', {ascending:false}).limit(500);
  if(error || !data) return;                 // нет связи — остаёмся на том, что видно
  for(const м of data) if(!м.сводка && м.link_summary) м.сводка = м.link_summary;
  МЫСЛИ = data.filter(м => !/^убра/.test(м.status || ''));   // «убрать» ждёт дома, но глазу уже не нужна
  в_память(ПАМЯТЬ_ЛЕНТЫ, МЫСЛИ.slice(0, 80));  // с запасом на следующее открытие; убранные не воскресают
  нарисовать();
}

const день_ключ = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
/* ВОЗРАСТ ЦИФРОЙ, А НЕ В УМЕ (задача Жени 12.08). «3 августа» заставляет считать в уме,
   сколько это дней назад. Считать — работа механизма, а не человека. То же исправление
   уехало в окно на маке: разделители дней говорят одинаково в обоих окнах. */
function день(iso){
  const d = new Date(iso), с = new Date();
  if(день_ключ(d) === день_ключ(с)) return 'сегодня';
  const в = new Date(с); в.setDate(в.getDate() - 1);
  if(день_ключ(d) === день_ключ(в)) return 'вчера';
  const дата = d.toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
  const дней = Math.round((new Date(с.getFullYear(), с.getMonth(), с.getDate()) -
                           new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  return дата + ' · ' + (дней < 7 ? дней + ' дн'
                       : дней < 31 ? Math.round(дней / 7) + ' нед'
                       : Math.round(дней / 30) + ' мес');
}
const часы = iso => new Date(iso).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});

function подсветить(текст){
  if(!ИСКОМОЕ) return экран(текст);
  const i = текст.toLowerCase().indexOf(ИСКОМОЕ);
  if(i < 0) return экран(текст);
  return экран(текст.slice(0,i)) + '<mark>' + экран(текст.slice(i, i+ИСКОМОЕ.length)) +
         '</mark>' + экран(текст.slice(i+ИСКОМОЕ.length));
}

/* ССЫЛКА В МЫСЛИ — КОРОТКО, ЖИВО И С ТЕМ, ЧТО ВНУТРИ (аудит 24.09). Было: адрес на три
   строки простым текстом — открыть нельзя, только копировать, а 36 из 68 мыслей-ссылок
   кроме адреса не несут ни слова. Дом при этом знает, что за ссылкой (у 64 из 68 есть
   разбор), но новый вид это выбрасывал. Теперь адрес — короткая живая ссылка, под ней
   название и суть, по касанию — вывод дома. И поиск смотрит туда же: Женя 24.09 искал
   «ролик с бухгалтерией» и не нашёл, пришлось кинуть его заново. */
const АДРЕС = /https?:\/\/[^\s<>"«»]+/g;
function короткий_адрес(url){
  const [узел, ...путь] = url.replace(/^https?:\/\/(www\.)?/, '').split('/').filter(Boolean);
  return узел + (путь.length ? '/' + путь[0] + (путь.length > 1 ? '/…' : '') : '');
}
function тело_мысли(текст){
  let html = '', i = 0;
  for(const н of текст.matchAll(АДРЕС)){
    const url = н[0].replace(/[.,;:!?)]+$/, '');
    html += подсветить(текст.slice(i, н.index)) +
            `<a class="адрес" href="${экран(url)}" target="_blank" rel="noopener">${экран(короткий_адрес(url))}</a>`;
    i = н.index + url.length;
  }
  return html + подсветить(текст.slice(i));
}
function что_за_ссылкой(м, открыта){
  const р = м.разбор;
  if(р && (р.заголовок || р.кратко))
    return `<div class="внутри">` + (р.заголовок ? `<b>${экран(р.заголовок)}</b>` : '') +
           (р.кратко ? `<span>${экран(р.кратко)}</span>` : '') +
           (открыта && р.вердикт ? `<i>${экран(р.вердикт)}</i>` : '') + `</div>`;
  const суть = (м.сводка || '').split(' — ').slice(1).join(' — ').trim();
  if(суть) return `<div class="внутри"><span>${экран(суть)}</span></div>`;
  return м.разбор_ход ? `<div class="внутри ход">${экран(м.разбор_ход)}</div>` : '';
}
/* НАПОМИНАНИЕ ДОМА — НЕ МЫСЛЬ ЖЕНИ (аудит 24.09). Отложенное возвращается в ленту строкой
   «⏱ …» через ту же дверь, что мысль, и рисовалось как его собственное сообщение справа —
   а у проверок дома вместе с выводом команды: таблица на весь экран («Память дня — проверка»).
   14 таких карточек. Теперь это реплика дома слева: первая строка — о чём, вывод команды
   свёрнут и раскрывается касанием. Данные не трогаем — только показ. */
const напоминание_ли = м => (м.body || '').startsWith('⏱');
function тело_напоминания(текст, открыта){
  const строки = текст.split('\n');
  const хвост = строки.slice(1).filter(с => с.trim() && !/^_отложено/.test(с.trim()));
  if(!хвост.length) return тело_мысли(строки[0]);
  return тело_мысли(строки[0]) + (открыта
    ? `<div class="внутри подробно"><span>${экран(хвост.join('\n'))}</span></div>`
    : `<div class="внутри ход">ещё ${хвост.length} стр. — коснись, чтобы раскрыть</div>`);
}
const где_искать = м => [м.body, м.сводка, м.разбор?.заголовок, м.разбор?.кратко, м.разбор?.вердикт]
  .filter(Boolean).join('\n').toLowerCase();

/* Обработанная мысль — та, с которой человеку больше делать нечего: дом её разобрал,
   кодер закрыл, или она уже уехала в дело. Всё прочее ждёт Женю и остаётся на виду. */
const обработана = м => {
  const с = (м.status || '').toLowerCase();
  return /сделано|готово|закрыто|у коры|разобрано|✓✓/.test(с) || !!м.done_at;
};

let ПОКАЗЫВАТЬ_ВСЁ = localStorage.getItem('гили_вид') === 'всё';
$('вид').onclick = () => {
  ПОКАЗЫВАТЬ_ВСЁ = !ПОКАЗЫВАТЬ_ВСЁ;
  localStorage.setItem('гили_вид', ПОКАЗЫВАТЬ_ВСЁ ? 'всё' : 'ждёт');
  нарисовать();
};

function нарисовать(){
  // Пока человек правит, фоновое обновление ленты карточку не перерисовывает — иначе
  // textarea пересоздастся и набранное пропадёт на полуслове. Закрытие правки ОБЯЗАНО
  // сначала обнулить ПРАВЛЮ и только потом звать нарисовать(): в окне на маке такой же
  // замок 02.09 держал правку открытой навсегда — «нельзя удалить окно )))».
  if(ПРАВЛЮ && document.querySelector('.редактор')) return;
  const ждущие = очередь()
    // при поиске ждущие ищутся наравне с остальными, а не показываются всегда
    .filter(з => ИСКОМОЕ ? (з.текст||'').toLowerCase().includes(ИСКОМОЕ) : з.поток === ПОТОК)
    .map(з => ({
      id:'ж'+з.когда, flow:з.поток, created_at:new Date(з.когда).toISOString(), ждёт:true,
      звук_ждёт: !!з.звук,
      сырое: з.текст,                   // редактору — текст без приписки про фото
      body: з.текст + ((з.фото||[]).length ? `\n${з.фото.length} фото ждёт отправки` : ''),
    }));

  let список = ИСКОМОЕ
    ? МЫСЛИ.filter(м => где_искать(м).includes(ИСКОМОЕ))
    : МЫСЛИ.filter(м => м.flow === ПОТОК);

  // поиск ищет везде, включая обработанное — иначе «найди ту накладную» не сработает
  const всего = список.length, готовых = список.filter(обработана).length;
  if(!ПОКАЗЫВАТЬ_ВСЁ && !ИСКОМОЕ) список = список.filter(м => !обработана(м));
  список = ждущие.concat(список).slice(0, 500);   // прошедшие дни всё равно свёрнуты в полосы

  $('вид').classList.toggle('всё', ПОКАЗЫВАТЬ_ВСЁ);
  $('вид').innerHTML = ПОКАЗЫВАТЬ_ВСЁ
    ? `всё <b>${всего}</b>`
    : (готовых ? `ждёт <b>${всего - готовых}</b>` : 'ждёт');
  $('вид').title = ПОКАЗЫВАТЬ_ВСЁ ? 'скрыть обработанные' : `обработано: ${готовых}`;

  if(!список.length){
    рисуй(`<div class="пусто">${ИСКОМОЕ ? 'ничего не нашлось'
      : (ПОКАЗЫВАТЬ_ВСЁ ? 'Здесь пусто.\nНапиши мысль внизу — дом её разберёт.'
                        : 'Всё разобрано.\nНажми «ждёт», чтобы посмотреть обработанное.')}</div>`);
    return;
  }

  // лента идёт снизу вверх: свежее у поля ввода, как в переписке
  const дни = [];
  for(const м of список.slice().reverse()){
    const к = день_ключ(new Date(м.created_at));
    if(!дни.length || дни[дни.length - 1].ключ !== к) дни.push({ключ: к, мысли: []});
    дни[дни.length - 1].мысли.push(м);
  }
  let html = '';
  ПОКАЗАНО.clear();
  дни.forEach((д, i) => {
    const последний = i === дни.length - 1;
    // живой разговор (последний день), поиск и день, где что-то открыто, — всегда целиком
    const целиком = последний || ИСКОМОЕ ||
      д.мысли.some(м => м.ждёт || м.id === ОТКРЫТА || м.id === ПРАВЛЮ);
    if(целиком) html += `<div class="день">${день(д.мысли[0].created_at)}</div>`;
    // день, где были только напоминания дома, полосой не встаёт: суть дня — мысли людей,
    // а проверки дома («сверить расход») выдавали себя за неё (Дом 24.09). Найти их — поиском.
    else if(д.мысли.some(м => !напоминание_ли(м))) html += полоса(д, РАСКРЫТЫ.has(д.ключ));
    else return;
    if(целиком || РАСКРЫТЫ.has(д.ключ)) html += д.мысли.map(карточка).join('');
  });
  рисуй(html);
}

function карточка(м){
  ПОКАЗАНО.set(м.id, м);                     // меню берёт мысль отсюда: ждущих в МЫСЛИ нет
  const снимки = (м.photos || []);
  const фото = снимки.length
    ? `<div class="снимки">` + снимки.map(п => `<img loading="lazy" data-путь="${экран(п)}" alt="снимок">`).join('') + `</div>`
    : '';
  const чей = напоминание_ли(м) ? 'дом напомнил'
            : (м.author && Я && м.author !== Я.id) ? (м.автор_имя || имя_автора(м.author)) : '';
  const открыта = ОТКРЫТА === м.id;
  // сказанное вслух: пока слов нет, карточка говорит, чего ждёт, и даёт послушать
  const правится = ПРАВЛЮ === м.id;
  const тело = правится ? редактор(м)
             : ждёт_слов(м) ? `<span class="распознаётся">${ЗНАК_ГОЛОСА} распознаю…</span>`
             : м.звук_ждёт  ? `<span class="распознаётся">${ЗНАК_ГОЛОСА} запись ждёт сети</span>`
             : напоминание_ли(м) ? тело_напоминания(м.body, открыта || !!ИСКОМОЕ)
             : тело_мысли(м.body || '') + что_за_ссылкой(м, открыта);
  const послушать = (ждёт_слов(м) && м.audio !== ЖДУ)
    ? `<button class="звук" data-звук="${экран(м.audio)}">${ЗНАК_ГОЛОСА}послушать</button>` : '';
  const сторона = напоминание_ли(м) ? ' чужая'
                : (!м.author || м.ждёт || (Я && м.author === Я.id)) ? ' своя' : ' чужая';
  return `<div class="мысль стекло${сторона} ${м.ждёт ? 'ждёт' : ''}${обработана(м) ? ' готовая' : ''}` +
          `${открыта ? ' выбрана' : ''}" data-ид="${м.id}">${тело}${фото}` +
          `<div class="низ"><span>${часы(м.created_at)}</span><span>·</span>` +
          `<b class="${окраска(м.status)}">${м.ждёт ? (НА_МАКЕ ? 'ждёт отправки' : 'в телефоне') : человечно(м.status)}</b>` +
          послушать +
          (ИСКОМОЕ ? `<span>${имя_потока(м.flow)}</span>` : '') +
          (чей ? `<span class="чей">${экран(чей)}</span>` : '') + `</div></div>`;
}

/* ПОЛОСЫ ПРОШЕДШИХ ДНЕЙ. Женя 24.09 (ответ на вопрос про «сверху вниз»): «верх сортировать
   в горизонтальные полосочки с датами и ключевыми метками, что в тот день было. Может даже
   мини картиночками. Чтоб понятно было суть прошедших дней». Было: одна переписка на 200
   карточек, и чтобы понять, что было в понедельник, её надо было пролистать целиком.
   Теперь свежий день внизу остаётся разговором, а каждый прошедший сжат в полосу: когда,
   о чём (первые слова мыслей), куда ушло, снимки дня. Касание раскрывает день на месте.
   Своей памяти у полос нет: собираются из той же ленты при каждой отрисовке. */
const РАСКРЫТЫ = new Set();                  // какие дни человек раскрыл (до перезагрузки)
const ЛИШНИЕ_СЛОВА = new Set(('и а но вот ну короче ещё еще это так же также тоже надо нужно ' +
  'нужен нужна сделать чтобы чтоб что как в во на по с со к ко у о об от до для из за при я мы ' +
  'ты мне меня нам вообще просто кстати же вот слушай блин типа походу думал написал отметил ' +
  'видел смотрю').split(' '));
function суть_мысли(м){
  if(ждёт_слов(м) || м.звук_ждёт) return '';
  if(напоминание_ли(м)) return суть_мысли({body: (м.body || '').split('\n')[0].replace(/^⏱\s*/, '')});
  if(м.разбор?.заголовок)                      // «ZimaBoard 2 — маленькая плата…» → «ZimaBoard 2»
    return м.разбор.заголовок.split(/\s[—–-]\s|[:(]/)[0].replace(/[«»"]/g, '')
      .split(/\s+/).filter(Boolean).slice(0, 4).join(' ').replace(/[,.;—–-]+$/, '');
  const текст = (м.body || '').replace(АДРЕС, ' ').trim();
  if(!текст || текст === 'фото'){
    const адрес = (м.body || '').match(АДРЕС);   // одна ссылка без слов — называем сайт
    return адрес ? короткий_адрес(адрес[0]).split(/[/.]/)[0] : '';
  }
  // первые слова по делу: «Вот я написал, как понять что кодеры…» → «как понять»,
  // а обрывок «Не, это…» пропускаем — суть дальше
  const слова = [];
  for(const кусок of текст.split(/[.!?\n,;:()—–]+/)){
    const к = кусок.split(/\s+/).map(с => с.replace(/[«»"'*_]/g, '')).filter(Boolean);
    if(к.length === 1 && к[0].length <= 3) continue;
    for(const с of к){
      if(!слова.length && ЛИШНИЕ_СЛОВА.has(с.toLowerCase())) continue;
      if(слова.length < 4) слова.push(с);
    }
    if(слова.length >= 2 || (слова[0] || '').length >= 6) break;
  }
  while(слова.length && ЛИШНИЕ_СЛОВА.has(слова[слова.length - 1].toLowerCase())) слова.pop();
  return слова.join(' ');
}
const мыслей = n => n + ' ' + ((n % 10 === 1 && n % 100 !== 11) ? 'мысль'
  : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? 'мысли' : 'мыслей');
function полоса(д, раскрыта){
  const люди = д.мысли.filter(м => !напоминание_ли(м));   // «дом напомнил» — не суть дня
  const сути = [...new Set(люди.map(суть_мысли).filter(Boolean))];
  const куда = {};
  for(const м of люди){
    const с = человечно(м.status || '');
    if(с.startsWith('→')) куда[с] = (куда[с] || 0) + 1;
  }
  const метки = Object.entries(куда).sort((a, b) => b[1] - a[1]).slice(0, 2)
    .map(([к, n]) => n > 1 ? `${к} ${n}` : к);
  const снимки = люди.flatMap(м => м.photos || []).slice(0, 3);
  return `<button class="полоса стекло${раскрыта ? ' раскрыта' : ''}" data-ид="д${д.ключ}" data-день="${д.ключ}">` +
    `<span class="когда">${экран(день(д.мысли[0].created_at))}` +
      `<small>${раскрыта ? 'свернуть' : [мыслей(люди.length), ...метки].map(экран).join(' · ')}</small></span>` +
    `<span class="суть">${экран(сути.slice(0, 4).join(' · ') || (снимки.length ? 'снимки' : ''))}</span>` +
    (снимки.length ? `<span class="мини">` +
      снимки.map(п => `<img loading="lazy" data-путь="${экран(п)}" alt="">`).join('') + `</span>` : '') +
    `</button>`;
}

/* Не перерисовываем одно и то же: замена разметки убивает прокрутку и мигает.
   (Та же грабля была в домашнем Гилфойле — лента моргала под курсором.) */
/* МЕНЮ МЫСЛИ — КАК В ТЕЛЕГРАМЕ. Женя 24.09 12:32 о старой логике касания: «Да давай прям
   1 в 1 как в тг. Удобно и понятно». Было: касание раскрывало под мыслью строку из шести
   кнопок (изменить, три потока, сделано, убрать). Лента под пальцем разъезжалась, а половину
   строки занимали потоки. Теперь как в ТГ: касание или долгое нажатие поднимает мысль над
   притихшей лентой, рядом столбик действий. «Перенести» открывает потоки в том же меню, как
   «Переслать» в ТГ. На маке то же по щелчку и правому щелчку. Закрыть можно касанием мимо или Esc.
   Длинное (вывод напоминания, суть ссылки) раскрывается касанием по самой вставке, как «ещё» в ТГ.

   ЖДУЩУЮ МЫСЛЬ ТОЖЕ МОЖНО ИСПРАВИТЬ (Женя 24.09 03:59: «Исправлять заметки нельзя»). Две его
   мысли той ночи дошли до мака в одну секунду: их довезла очередь, а пока они ждали, касание
   не давало ничего. Ждущая лежит в памяти окна, правим её прямо в очереди. «Убрать» и
   «Перенести» у неё нет намеренно: её ещё нет в ленте, убранная пропала бы без следа. */
const ЗНАЧКИ = {
  править: '<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14 6l4 4"/>',
  копировать: '<rect x="9" y="9" width="11" height="11" rx="3"/><path d="M15 9V7a3 3 0 0 0-3-3H7a3 3 0 0 0-3 3v5a3 3 0 0 0 3 3h2"/>',
  куда: '<path d="M14 5l6 6-6 6"/><path d="M20 11h-9a6 6 0 0 0-6 6v2"/>',
  готово: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  убрать: '<path d="M5 7h14"/><path d="M10 7V5h4v2"/><path d="M7 7l1 12h8l1-12"/>',
  назад: '<path d="M15 5l-7 7 7 7"/>',
  кому: '<circle cx="12" cy="8" r="3.6"/><path d="M5 20a7 7 0 0 1 14 0"/>',
};
/* КОМУ (26.09). Женя 13:50: «Проработать функцию работы с заметками. Красивое окно, когда правой
   кнопкой нажимаешь… развиваем это всё, очень лёгкое, понятное». Мысль уехала не тому кодеру или
   не уехала никому — отправить её рукой. Это то же поле «кому», которое с 19.08 ставит разбор, и
   доставщик дома слушает его первым: довезёт, а уехавшую не туда за трое суток переадресует.
   Пока умеет только мак: у облачной базы поля «кому» нет — на телефоне пункта нет, а не серый. */
const КОМУ = [['Космос Сервис', 'Космос'], ['Гили', 'Гили'], ['Школа', 'Школа'], ['Бухгалтер', 'Бухгалтер'],
              ['Сервисный', 'Мастер'], ['Дизайнер', 'Дизайнер'], ['Закупатор', 'Закупатор'], ['Домик', 'Дом']];
const значок = к => `<svg viewBox="0 0 24 24" aria-hidden="true">${ЗНАЧКИ[к]}</svg>`;
let МЕНЮ = null;                           // {ид, шаг: 'главное' | 'куда'}, пока меню открыто
const ПОКАЗАНО = new Map();                // ид → мысль, какой её сейчас видно (с ждущими)
let ГЛОТАТЬ = false;                       // меню открыто долгим нажатием: отпускание пальца — не щелчок

function пункты_меню(м){
  if(МЕНЮ.шаг === 'куда')
    return [['назад', 'Назад', 'назад']].concat(мои_вкладки().filter(п => п.код !== м.flow)
      .map(п => ['в:' + п.код, п.имя, '']));
  if(МЕНЮ.шаг === 'кому')
    return [['назад', 'Назад', 'назад']].concat(КОМУ.map(([к, имя]) => ['к:' + к, имя, '']));
  const слова = !м.звук_ждёт && !ждёт_слов(м) && !!(м.сырое ?? м.body ?? '').trim();
  const своя = !м.author || м.ждёт || (Я && м.author === Я.id);
  // чужую мысль (рабочую Олега, семейную Саши) можно только отметить сделанной: перенести
  // или убрать её вправе лишь автор, и база это держит сама (облако/команда.sql)
  return [
    слова && своя && !напоминание_ли(м) && ['править', 'Изменить', 'править'],
    слова && ['копировать', 'Копировать', 'копировать'],
    !м.ждёт && своя && мои_вкладки().length > 1 && ['куда', 'Перенести', 'куда'],
    !м.ждёт && своя && м.author !== 'дом' && ['кому', 'Кому', 'кому'],
    !м.ждёт && !обработана(м) && ['готово', 'Сделано', 'готово'],
    !м.ждёт && своя && ['убрать', 'Убрать', 'убрать'],
  ].filter(Boolean);
}

function открыть_меню(ид, карточка){
  // «отправляю…» живёт долю секунды и ещё не имеет своего номера — делать с ней нечего
  if(!карточка || ПРАВЛЮ || МЕНЮ?.ид === ид || String(ид).startsWith('…')) return;
  const м = ПОКАЗАНО.get(ид); if(!м) return;
  МЕНЮ = {ид, шаг: 'главное'};
  if(!пункты_меню(м).length){ МЕНЮ = null; return; }
  $('меню-мысли')?.remove();
  // Размер берём без наклона ленты (--tilt, --focus): рамка повёрнутой карточки на пару пикселей
  // уже настоящей, и в копии текст переносился по-другому (замер: 4 строки из 40).
  const о = карточка.getBoundingClientRect(), ш = карточка.offsetWidth, в = карточка.offsetHeight;
  const r = {left: о.left + (о.width - ш) / 2, top: о.top + (о.height - в) / 2, width: ш, height: в};
  r.right = r.left + ш;
  const копия = карточка.cloneNode(true);
  копия.removeAttribute('style');
  [копия, ...копия.querySelectorAll('[data-ид]')].forEach(е => е.removeAttribute('data-ид'));
  const слой = document.createElement('div');
  слой.id = 'меню-мысли'; слой.className = 'меню-мысли';
  слой.innerHTML = `<div class="меню-фон"></div><div class="меню-копия"></div>` +
                   `<div class="меню-список" role="menu" aria-label="что сделать с мыслью"></div>`;
  слой.querySelector('.меню-копия').append(копия);
  document.body.append(слой);
  нарисовать_меню();

  // Место как в ТГ: мысль остаётся где была, меню под ней. Не влезает — мысль уезжает вверх,
  // а слишком длинная ужимается и листается внутри.
  const вв = window.visualViewport;
  const сверху = (вв?.offsetTop || 0) + Math.max(12, безопасно_сверху());
  const снизу = (вв ? вв.offsetTop + вв.height : innerHeight) - 12;
  const с = слой.querySelector('.меню-список'), к = слой.querySelector('.меню-копия');
  к.style.width = r.width + 'px';
  // высоту меряем у копии: у ленты карточки рисуются лениво (content-visibility), и рамка
  // карточки вне экрана — прикидка в 88 px, а не настоящая высота
  // место под самый высокий шаг меню («Кому» — девять строк), иначе подменю уходит за низ экрана
  const меню_в = ['куда', 'кому', 'главное'].reduce((б, шаг) => (МЕНЮ.шаг = шаг, нарисовать_меню(),
                  Math.max(б, с.offsetHeight)), 0);
  const зазор = 8, своя_в = Math.max(r.height, копия.offsetHeight);
  const выс = Math.min(своя_в, Math.max(96, снизу - сверху - меню_в - зазор));
  const верх = Math.max(сверху, Math.min(r.top, снизу - меню_в - зазор - выс));
  к.style.cssText = `top:${верх}px; left:${r.left}px; width:${r.width}px; max-height:${выс}px; ` +
                    `--сдвиг:${(r.top - верх).toFixed(1)}px`;
  const справа = карточка.classList.contains('своя');     // своя мысль справа — меню к правому краю
  с.style.top = (верх + выс + зазор) + 'px';
  с.style.transformOrigin = справа ? 'top right' : 'top left';
  if(справа) с.style.right = Math.max(12, innerWidth - r.right) + 'px';
  else с.style.left = Math.max(12, r.left) + 'px';
}

function нарисовать_меню(){
  const с = document.querySelector('#меню-мысли .меню-список');
  const м = МЕНЮ && ПОКАЗАНО.get(МЕНЮ.ид);
  if(!с || !м) return закрыть_меню();
  с.innerHTML = пункты_меню(м).map(([д, имя, зн]) => д === 'назад'
    ? `<button class="пункт назад" role="menuitem" data-дело="назад">${значок(зн)}<span>${имя}</span></button>`
    : `<button class="пункт${д === 'убрать' ? ' опасно' : ''}" role="menuitem" data-дело="${д}">` +
      `<span>${экран(имя)}</span>${зн ? значок(зн) : ''}</button>`).join('');
  // фокус внутрь — только если меню ведут клавишами: у пальца рамки быть не должно, как в ТГ
  if(document.activeElement?.closest?.('#меню-мысли')) с.querySelector('.пункт')?.focus({preventScroll: true});
}

function закрыть_меню(){
  МЕНЮ = null;
  const слой = $('меню-мысли');
  if(!слой || слой.classList.contains('уходит')) return;
  слой.classList.add('уходит');
  const тихо = matchMedia('(prefers-reduced-motion:reduce)').matches;
  setTimeout(() => слой.remove(), тихо ? 0 : 150);
}

function дело_меню(д){
  if(!МЕНЮ) return;
  const ид = МЕНЮ.ид, м = ПОКАЗАНО.get(ид);
  if(д === 'куда' || д === 'кому' || д === 'назад'){ МЕНЮ.шаг = д === 'назад' ? 'главное' : д; нарисовать_меню(); return; }
  закрыть_меню();
  if(д === 'править') return править(ид);
  if(д === 'копировать') return скопировать(м);
  if(д === 'готово') return пометить_готовой(ид);
  if(д === 'убрать') return убрать(ид);
  if(д.startsWith('в:')) return перенести(ид, д.slice(2));
  if(д.startsWith('к:')) return отправить_кому(ид, д.slice(2));
}

function скопировать(м){
  const т = ((м && (м.сырое ?? м.body)) || '').trim();
  const вышло = () => сказать_внизу('скопировано', 1600);
  const руками = () => {                     // старый Safari и окно мака без доступа к буферу
    const п = document.createElement('textarea');
    п.value = т; п.setAttribute('readonly', ''); п.style.cssText = 'position:fixed; top:0; opacity:0';
    document.body.append(п); п.select();
    let вышел = false; try{ вышел = document.execCommand('copy'); }catch{}
    п.remove();
    вышел ? вышло() : сказать_внизу('не скопировалось — телефон не дал');
  };
  navigator.clipboard?.writeText ? navigator.clipboard.writeText(т).then(вышло, руками) : руками();
}

// вырез и часы сверху у айфона: меню не должно заезжать под них
function безопасно_сверху(){
  const п = document.createElement('div');
  п.style.cssText = 'position:fixed; top:env(safe-area-inset-top, 0px); visibility:hidden';
  document.body.append(п); const в = п.getBoundingClientRect().top; п.remove();
  return в;
}

const ждущая = ид => очередь().find(з => 'ж' + з.когда === ид);

   и, возможно, доставлена кодеру или в CRM. Поправить её только здесь значит развести

   записи (31 мысль в ленте с ним). Значит ему хватает статуса-сигнала, чтобы найти свою

   заново». Дом снимает статус, когда применил.

   Пока дом статус не разбирает, правка честно говорит, что доехала не до конца —
   врать про «исправлено» нельзя, это та же тихая ложь, что и «✓ записано» у голоса,
   который до дома не добирался. */
/* ПРАВКА ПРЯМО В КАРТОЧКЕ. Женя 31.08 19:42: «Что за уродство )) Хочу прчм как в тг
   внутри сообщения редактировать». Уродством было системное окошко prompt() — я поставил
   его 31.08, чтобы правка появилась хоть какая-то, и оно честно заработало. Но он прав:
   окно, вырванное из ленты, — это не правка, это допрос. Теперь текст раскрывается в
   поле на месте самой мысли, под ним «отменить» и «сохранить», остальное как было:
   status 'правка' говорит дому «забери заново», карточка честно пишет «правка ждёт дома». */
function редактор(м){
  return `<textarea class="редактор" rows="2" autocorrect="off" autocapitalize="off" spellcheck="false">${экран(м.сырое ?? м.body ?? '')}</textarea>` +
         `<div class="правка-низ"><button class="правка-нет" onclick="отменить_правку()">отменить</button>` +
         `<button class="правка-да" onclick="сохранить_правку('${м.id}')">сохранить</button></div>`;
}

function править(ид){
  if(!МЫСЛИ.some(x => x.id === ид) && !ждущая(ид)) return;
  ОТКРЫТА = null; ПРАВЛЮ = ид; нарисовать();
  const ta = document.querySelector('.редактор'); if(!ta) return;
  const рост = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
  рост(); ta.addEventListener('input', рост);
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  ta.addEventListener('keydown', e => {
    if(e.key === 'Escape'){ e.preventDefault(); отменить_правку(); }
    // Enter на телефоне — перенос строки, как в переписке; сохраняет кнопка или ⌘/Ctrl+Enter
    if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); сохранить_правку(ид); }
  });
}

function отменить_правку(){ ПРАВЛЮ = null; нарисовать(); }

async function сохранить_правку(ид){
  const з = ждущая(ид);
  if(з){                                            // ещё в очереди: правим прямо в ней
    const ta = document.querySelector('.редактор');
