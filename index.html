<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гилфойл</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Гилфойл">
<meta name="theme-color" content="#dfe7ea">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:        oklch(0.89 0.018 210);
    --fog:       oklch(0.91 0.011 212);
    --fg:        oklch(0.13 0.015 230);
    --fg-m:      oklch(0.26 0.010 230);
    --fg-l:      oklch(0.48 0.008 230);
    --glass-bg:  oklch(0.97 0.004 225 / 0.52);
    --glass-bd:  oklch(1 0 0 / 0.55);
    --accent:    oklch(0.52 0.11 235);
    --r: 16px;
    --sys: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; font-family:var(--sys); color:var(--fg); background:
      radial-gradient(60% 50% at 80% 0%, var(--warm, oklch(0.94 0.015 200)) 0%, transparent 60%),
      linear-gradient(180deg, var(--fog), var(--bg));
    display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ── вход ────────────────────────────────────────────────────────────────────
   Пароля нет и не будет: в «Разберёмся» вход по коду из письма, и здесь тот же
   аккаунт. Одна почта — один человек, ничего не надо помнить. */
let ЖДЁМ_КОД = false, ПОЧТА = '';

$('войти').onclick = async () => {
  if(!ЖДЁМ_КОД) return прислать_код();
  return проверить_код();
};

async function прислать_код(){
  const почта = $('почта').value.trim();
  if(!почта.includes('@')){ $('сказ').textContent = 'нужна почта'; return; }
  $('войти').disabled = true; $('сказ').textContent = 'отправляю…';
  const {error} = await sb.auth.signInWithOtp({email: почта, options:{shouldCreateUser:true}});
  $('войти').disabled = false;
  if(error){ $('сказ').textContent = разобрать_ошибку(error); return; }
  ПОЧТА = почта; ЖДЁМ_КОД = true;
  $('код').hidden = false; $('код').focus();
  $('войти').textContent = 'Войти';
  $('сказ').textContent = 'код ушёл на почту';
}

async function проверить_код(){
  const код = $('код').value.trim().replace(/\D/g, '');
  if(код.length < 6){ $('сказ').textContent = 'код из шести цифр'; return; }
  $('войти').disabled = true; $('сказ').textContent = 'проверяю…';
  const {error} = await sb.auth.verifyOtp({email: ПОЧТА, token: код, type:'email'});
  $('войти').disabled = false;
  if(error){ $('сказ').textContent = 'код не подошёл — проверь письмо'; return; }
  await поднять();
}

$('почта').addEventListener('keydown', e => { if(e.key === 'Enter') $('войти').click(); });
$('код').addEventListener('keydown', e => { if(e.key === 'Enter') $('войти').click(); });
$('код').addEventListener('input', e => { if(e.target.value.replace(/\D/g,'').length === 6) проверить_код(); });

function разобрать_ошибку(e){
  const t = (e.message || '').toLowerCase();
  if(t.includes('rate') || t.includes('seconds')) return 'слишком часто — подожди минуту';
  if(t.includes('network') || t.includes('fetch')) return 'нет связи — попробуй позже';
  return e.message || 'не вышло';
}

async function поднять(){
  const {data:{user}} = await sb.auth.getUser();
  if(!user) return;
  const {data: семья} = await sb.from('gili_family').select('user_id,name').eq('user_id', user.id).maybeSingle();
  if(!семья){
    $('сказ').textContent = 'этот аккаунт не в семье — скажи Жене, он добавит';
    await sb.auth.signOut(); return;
  }
  Я = {id: user.id, имя: семья.name};
  $('вход').hidden = true; $('вход').style.display = 'none';
  $('приложение').hidden = false;
  $('кто').textContent = Я.имя;
  нарисовать_потоки();
  await загрузить();
  подписаться();
  везти_очередь();
}

/* ── потоки ───────────────────────────────────────────────────────────────── */
function нарисовать_потоки(){
  $('потоки').innerHTML = ПОТОКИ.map(п =>
    `<button data-код="${п.код}" class="${п.код === ПОТОК ? 'on' : ''}">${п.имя}</button>`).join('');
  $('потоки').querySelectorAll('button').forEach(б => б.onclick = () => {
    ПОТОК = б.dataset.код; нарисовать_потоки(); нарисовать();
  });
}

/* ── лента ────────────────────────────────────────────────────────────────── */
async function загрузить(){
  const {data, error} = await sb.from('gili_notes')
    .select('id,flow,body,photos,created_at,status,author')
    .order('created_at', {ascending:false}).limit(300);
  if(!error && data) МЫСЛИ = data;
  нарисовать();
}

function подсветить(текст){
  if(!ИСКОМОЕ) return экран(текст);
  const i = текст.toLowerCase().indexOf(ИСКОМОЕ);
  if(i < 0) return экран(текст);
  return экран(текст.slice(0,i)) + '<mark>' + экран(текст.slice(i, i+ИСКОМОЕ.length)) + '</mark>' + экран(текст.slice(i+ИСКОМОЕ.length));
}

function день(iso){
  const d = new Date(iso), сегодня = new Date();
  const к = x => x.toISOString().slice(0,10);
  if(к(d) === к(сегодня)) return 'сегодня';
  const вчера = new Date(сегодня); вчера.setDate(вчера.getDate() - 1);
  if(к(d) === к(вчера)) return 'вчера';
  return d.toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
}
const часы = iso => new Date(iso).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});

function нарисовать(){
  // ждущие отправки — сверху ленты, они самые свежие
  const свои = очередь().filter(з => ИСКОМОЕ || з.поток === ПОТОК).map(з => ({
    id:'ж'+з.когда, flow:з.поток, body:з.текст + ((з.фото||[]).length ? `\n📷 ${з.фото.length} фото в телефоне` : ''),
    created_at:new Date(з.когда).toISOString(), ждёт:true, автор_имя:Я?.имя
  }));
  let список = МЫСЛИ.filter(м => ИСКОМОЕ ? true : м.flow === ПОТОК);
  if(ИСКОМОЕ) список = список.filter(м => (м.body||'').toLowerCase().includes(ИСКОМОЕ));
  список = свои.concat(список);

  if(!список.length){
    $('лента').innerHTML = `<div class="пусто">${ИСКОМОЕ ? 'ничего не нашлось' : 'пусто'}</div>`;
    return;
  }
  let html = '', прошлый = '';
  for(const м of список){
    const д = день(м.created_at);
    if(д !== прошлый){ html += `<div class="день">${д}</div>`; прошлый = д; }
    const фото = (м.photos || []).map(п => `<img loading="lazy" data-путь="${экран(п)}" alt="">`).join('');
    const чей = м.author && Я && м.author !== Я.id ? 'Саша' : '';
    html += `<div class="мысль ${м.ждёт ? 'ждёт' : ''}">${подсветить(м.body || '')}${фото}` +
            `<div class="низ"><span>${часы(м.created_at)}</span>` +
            `<b>${м.ждёт ? '⏳ в телефоне' : (м.status || '✓ записано')}</b>` +
            (ИСКОМОЕ ? `<span>${экран(ПОТОКИ.find(п=>п.код===м.flow)?.имя || м.flow)}</span>` : '') +
            (чей ? `<span class="кто">${чей}</span>` : '') + `</div></div>`;
  }
  $('лента').innerHTML = html;
  показать_фото();
}

/* Фото лежат в закрытом хранилище: прямых ссылок нет, для каждого просим временную. */
async function показать_фото(){
  for(const img of $('лента').querySelectorAll('img[data-путь]')){
    const путь = img.dataset.путь; delete img.dataset.путь;
    const {data} = await sb.storage.from('gili').createSignedUrl(путь, 3600);
    if(data?.signedUrl) img.src = data.signedUrl;
  }
}

/* Мысль от Саши появляется у Жени сама, без обновления страницы. */
function подписаться(){
  sb.channel('гили').on('postgres_changes',
    {event:'*', schema:'public', table:'gili_notes'}, загрузить).subscribe();
}

/* ── очередь: без сети мысль не теряется ──────────────────────────────────── */
const КЛЮЧ_ОЧЕРЕДИ = 'гили_очередь';
const очередь = () => { try{ return JSON.parse(localStorage.getItem(КЛЮЧ_ОЧЕРЕДИ) || '[]'); }catch{ return []; } };
function в_очередь(з){ const q = очередь(); q.push(з); localStorage.setItem(КЛЮЧ_ОЧЕРЕДИ, JSON.stringify(q)); нарисовать(); }
function из_очереди(когда){ localStorage.setItem(КЛЮЧ_ОЧЕРЕДИ, JSON.stringify(очередь().filter(з => з.когда !== когда))); }

let ВЕЗУ = false;
async function везти_очередь(){
  if(ВЕЗУ || !Я || !navigator.onLine) return;
  const q = очередь(); if(!q.length) return;
  ВЕЗУ = true;
  for(const з of q){
    try{
      const пути = [];
      for(const ф of (з.фото || [])){
        const путь = await залить(избуквы(ф.буква), ф.ext);
        пути.push(путь);
      }
      const {error} = await sb.from('gili_notes').insert({author: Я.id, flow: з.поток, body: з.текст, photos: пути});
      if(error) throw error;
      из_очереди(з.когда);
    }catch(e){ break; }        // облако молчит — остальное подождёт, порядок сохраняем
  }
  ВЕЗУ = false;
  await загрузить();
  const n = очередь().length;
  $('состояние').textContent = n ? `${n} ждёт отправки` : '';
}
window.addEventListener('online', везти_очередь);
setInterval(везти_очередь, 20000);

/* ── фото ─────────────────────────────────────────────────────────────────── */
/* Ужимаем в телефоне: снимок айфона весит 3–5 МБ, и такой не влезет ни в память
   телефона на время без сети, ни в разумный трафик. 1600 px хватает, чтобы
   прочитать ценник или бумагу. */
async function ужать(файл){
  if(!файл.type.startsWith('image/')) return null;
  const bmp = await createImageBitmap(файл).catch(() => null);
  if(!bmp) return файл;
  const край = 1600, k = Math.min(1, край / Math.max(bmp.width, bmp.height));
  if(k === 1 && файл.size < 900e3) return файл;
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.72));
  return blob && blob.size < файл.size ? new File([blob], 'фото.jpg', {type:'image/jpeg'}) : файл;
}
const вбукву = ф => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(ф); });
function избуквы(строка){
  const [шапка, тело] = строка.split(',');
  const б = atob(тело), a = new Uint8Array(б.length);
  for(let i = 0; i < б.length; i++) a[i] = б.charCodeAt(i);
  return new Blob([a], {type: (шапка.match(/:(.*?);/) || [,'image/jpeg'])[1]});
}
async function залить(blob, ext){
  const путь = `${Я.id}/${Date.now().toString(36)}-${Math.round(performance.now())}.${ext || 'jpg'}`;
  const {error} = await sb.storage.from('gili').upload(путь, blob, {contentType: blob.type || 'image/jpeg'});
  if(error) throw error;
  return путь;
}

$('файл').onchange = async e => {
  const файлы = [...(e.target.files || [])]; e.target.value = '';
  for(const ф of файлы){
    const у = await ужать(ф); if(!у) continue;
    ФОТО.push({файл: у, ссылка: URL.createObjectURL(у)});
  }
  нарисовать_фишки();
  if(!$('поле').value.trim()) отправить();     // снял и пошёл — подпись не обязательна
};
function нарисовать_фишки(){
  $('фишки').innerHTML = ФОТО.map((ф,i) =>
    `<span class="фишка"><img src="${ф.ссылка}" alt=""><button onclick="убрать_фото(${i})">×</button></span>`).join('');
}
function убрать_фото(i){ ФОТО.splice(i,1); нарисовать_фишки(); }

/* ── написать ─────────────────────────────────────────────────────────────── */
const поле = $('поле');
поле.addEventListener('input', () => { поле.style.height = 'auto'; поле.style.height = Math.min(поле.scrollHeight, 150) + 'px'; });
поле.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey && window.innerWidth >= 860){ e.preventDefault(); отправить(); }
});

async function отправить(){
  const текст = поле.value.trim();
  if(!текст && !ФОТО.length) return;
  const фото = ФОТО.slice(); ФОТО = []; нарисовать_фишки();
  поле.value = ''; поле.style.height = 'auto';
  const тело = текст || 'фото';

  try{
    if(!navigator.onLine) throw new Error('нет сети');
    const пути = [];
    for(const ф of фото) пути.push(await залить(ф.файл, 'jpg'));
    const {error} = await sb.from('gili_notes').insert({author: Я.id, flow: ПОТОК, body: тело, photos: пути});
    if(error) throw error;
    await загрузить();
    $('состояние').textContent = '';
  }catch(e){
    // облака нет — мысль ложится в память телефона и уедет сама
    const в_буквах = [];
    for(const ф of фото) в_буквах.push({буква: await вбукву(ф.файл), ext:'jpg'});
    в_очередь({когда: Date.now(), поток: ПОТОК, текст: тело, фото: в_буквах});
    $('состояние').textContent = `${очередь().length} ждёт отправки`;
  }
}

/* ── поиск ────────────────────────────────────────────────────────────────── */
$('поиск').addEventListener('input', e => { ИСКОМОЕ = e.target.value.trim().toLowerCase(); нарисовать(); });

/* ── старт ────────────────────────────────────────────────────────────────── */
sb.auth.getSession().then(({data:{session}}) => { if(session) поднять(); });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
