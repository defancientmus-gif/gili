<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гилфойл</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Гилфойл">
<script>
/* Обновление должно запуститься даже если основной код приложения сломался. */
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<meta name="theme-color" content="#dfe7ea">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Стиль взят у «Разберёмся» — по просьбе Жени 10.08 («исследуй разберёмся»),
   из texts/UI_PHILOSOPHY.md и GLASS_STYLE_PROMPT.md. Оттуда три правила:

   · Светло. Тёмной темы в «Разберёмся» нет вовсе, и это осознанно: приложение
     должно выглядеть как бумага на свету, а не как консоль разработчика.
   · Стекло — это три слоя вместе: диагональный градиент (свет сверху-слева),
     белая полупрозрачная рамка (толщина стекла на срезе) и ДВЕ тени —
     внутренний блик сверху и едва заметная холодная снаружи. По отдельности
     ни один слой стекла не даёт.
   · Блюр не больше 12px. У них аудит скорости показал: каждый backdrop-filter
     на айфоне — отдельный проход видеокарты, а разницы между 12 и 40 глаз
     почти не видит. Скорость важнее красивого числа в коде.

   Анимации — только прозрачность и сдвиг, никогда тень и размеры: тень в
   анимации заставляет браузер пересчитывать раскладку на каждом кадре.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --bg:      oklch(0.89 0.018 210);
  --fog:     oklch(0.93 0.012 212);
  --fg:      oklch(0.20 0.020 210);
  --fg-m:    oklch(0.38 0.015 210);
  --fg-l:    oklch(0.55 0.020 210);
  --line:    oklch(0.88 0.02 210 / .40);
  --accent:  oklch(0.45 0.12 210);
  --ждёт:    oklch(0.58 0.11 65);
  --r:       18px;
  --sys: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
  --пружина: cubic-bezier(.34, 1.1, .64, 1);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; overscroll-behavior-y:none}
body{
  margin:0; font-family:var(--sys); color:var(--fg); font-size:17px; line-height:1.5;
  background:
    radial-gradient(70% 45% at 78% -5%, oklch(0.96 0.014 205) 0%, transparent 62%),
    linear-gradient(180deg, var(--fog), var(--bg));
  display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}

/* ── стекло: один рецепт на всё приложение ────────────────────────────────── */
.стекло{
  background:linear-gradient(158deg, oklch(1 0 0 / .82) 0%, oklch(0.965 0.012 210 / .72) 100%);
  border:1px solid oklch(1 0 0 / .70);
  box-shadow: inset 0 1px 0 oklch(1 0 0 / .94),
              0 4px 13px -3px oklch(0.32 0.035 210 / .11);
}

/* ── заставка: пока выясняем, вошёл ли уже ────────────────────────────────── */
#старт{margin:auto; opacity:.35}
#старт[hidden]{display:none}
#старт svg{width:44px; height:44px}

/* ── вход ─────────────────────────────────────────────────────────────────── */
#вход{margin:auto; width:min(340px, 88vw); text-align:center; animation:явь .35s var(--пружина)}
#вход h1{font-size:26px; font-weight:700; letter-spacing:-.4px; margin:0 0 7px}
#вход p{color:var(--fg-l); font-size:15px; margin:0 0 26px}
#вход input{
  width:100%; font:inherit; font-size:16px; padding:14px 16px; margin-bottom:10px;
  border-radius:15px; border:1px solid oklch(1 0 0 / .70); color:var(--fg);
  background:linear-gradient(158deg, oklch(1 0 0 / .82), oklch(0.965 0.012 210 / .72));
  box-shadow:inset 0 1px 0 oklch(1 0 0 / .94);
  transition:border-color .18s;
}
#вход input:focus{outline:none; border-color:var(--accent)}
#вход button{
  width:100%; font:inherit; font-size:16px; font-weight:600; padding:14px;
  border-radius:15px; border:none; background:var(--accent); color:#fff;
  transition:opacity .18s, transform .12s;
}
#вход button:active{opacity:.85; transform:scale(.97)}
#вход button:disabled{opacity:.45}
#сказ{font-size:13.5px; color:var(--fg-l); min-height:19px; margin-top:10px}
#сказ.плохо{color:oklch(0.50 0.15 20)}

/* ── шапка: потоки ────────────────────────────────────────────────────────── */
#приложение{display:contents}
#приложение[hidden]{display:none}
.мобильный-бренд,.поиск-знак,#сцена,.фото-меню,.старт-слово{display:none}
header{padding:8px 12px 4px}
.потоки{display:flex; gap:4px; padding:3px; border-radius:15px;
  background:oklch(1 0 0 / .34); border:1px solid oklch(1 0 0 / .55)}
.потоки button{
  flex:1; font:inherit; font-size:14px; padding:8px 2px; border-radius:12px;
  border:none; background:transparent; color:var(--fg-l);
  transition:color .18s, background .22s var(--пружина);
}
.потоки button.on{
  background:linear-gradient(158deg, oklch(1 0 0 / .92), oklch(0.98 0.008 210 / .84));
  color:var(--fg); font-weight:600;
  box-shadow:inset 0 1px 0 oklch(1 0 0 / .94), 0 2px 8px -2px oklch(0.32 0.035 210 / .14);
}
.подшапка{display:flex; align-items:center; gap:8px; padding:8px 12px 6px}
.подшапка input{
  flex:1; font:inherit; font-size:15px; padding:9px 14px; border-radius:13px;
  border:1px solid oklch(1 0 0 / .70); color:var(--fg);
  background:linear-gradient(158deg, oklch(1 0 0 / .74), oklch(0.965 0.012 210 / .62));
  transition:border-color .18s;
}
.подшапка input:focus{outline:none; border-color:var(--accent)}
.подшапка .кто{font-size:13px; color:var(--fg-l); white-space:nowrap}
/* ЧИСТАЯ ЛЕНТА. Женя 11.08: «Гили превращается в свалку, надо отработанные убирать,
   чтоб не мешались, и чтоб я наглядно понимал, что обработано, а что нет».
   По умолчанию видно только то, что ещё требует человека; обработанное — по кнопке. */
.вид{
  font:inherit; font-size:13px; padding:7px 12px; border-radius:11px; white-space:nowrap;
  border:1px solid oklch(1 0 0 / .70); color:var(--fg-m);
  background:linear-gradient(158deg, oklch(1 0 0 / .74), oklch(0.965 0.012 210 / .62));
  transition:color .18s, transform .14s var(--пружина);
}
.вид:active{transform:scale(.95)}
.вид.всё{color:var(--accent); font-weight:600}
.вид b{font-weight:700}
.мысль.готовая{opacity:.62}

/* ── лента ────────────────────────────────────────────────────────────────── */
main{flex:1; overflow-y:auto; padding:2px 12px 6px; -webkit-overflow-scrolling:touch;
  display:flex; flex-direction:column; justify-content:flex-end}
main > *{flex:none}
.день{text-align:center; font-size:12px; color:var(--fg-l); margin:14px 0 9px}
.мысль{
  border-radius:var(--r); padding:12px 14px; margin-bottom:9px;
  font-size:16px; line-height:1.45; white-space:pre-wrap; word-break:break-word;
  animation:явь .26s var(--пружина);
}
.мысль.ждёт{opacity:.78}
.низ{display:flex; align-items:center; gap:7px; margin-top:8px; font-size:12.5px; color:var(--fg-l); flex-wrap:wrap}
.низ>span{white-space:nowrap}    /* время не ломается пополам, когда статус длинный (13.08) */
/* ЦВЕТ ТОЛЬКО ТАМ, ГДЕ ОН ЧТО-ТО ЗНАЧИТ. Было: каждая строка ленты подсвечена акцентом,
   и «записано» кричало так же громко, как «молчит». Когда светится всё, не светится
   ничто — глазу не за что зацепиться. То же лечили в окне на маке 19.08.
   Осталось четыре голоса: тихий у обычного, акцент у уехавшего в дело, красный
   у застрявшего, зелёный у закрытого. */
.низ b{font-weight:600; color:var(--fg-m)}
.низ b.ушла{color:var(--accent)}              /* мысль доехала до чьих-то рук */
.низ b.молчит{color:oklch(0.55 0.16 30)}      /* задача лежит у кодера без движения */
.низ b.готово{color:oklch(0.52 0.13 150)}     /* закрыто — глазу приятно видеть зелёное */
.мысль.ждёт .низ b{color:var(--ждёт)}
.низ .чей{margin-left:auto; font-weight:500}
/* РУЧНАЯ СОРТИРОВКА. Женя 11.08: «алгоритмы распознавания сортировали заметки сами,
   но и инструменты для ручной сортировки были». Алгоритм ошибается — человек поправляет
   одним касанием, и эта поправка учит разбор (перенос попадает в уроки дома). */
.правка{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; animation:явь .2s var(--пружина)}
.правка button{
  font:inherit; font-size:12.5px; padding:6px 11px; border-radius:10px;
  border:1px solid oklch(1 0 0 / .70); color:var(--fg-m);
  background:linear-gradient(158deg, oklch(1 0 0 / .8), oklch(0.965 0.012 210 / .68));
  transition:transform .14s var(--пружина), color .18s;
}
.правка button:active{transform:scale(.94)}
.правка button.готово{color:oklch(0.42 0.13 150)}
.правка button.убрать{color:oklch(0.5 0.15 20)}
/* редактор на месте текста мысли: тот же шрифт и та же ширина, что у самой мысли —
   человек правит то, что видел, а не переписывает в другом окне */
.мысль textarea.редактор{width:100%; min-height:44px; margin:0; padding:9px 11px;
     font:inherit; line-height:1.45; border:1px solid var(--accent); border-radius:12px;
     background:oklch(1 0 0 / .7); color:var(--fg); resize:none; outline:none; display:block}
.правка-низ{display:flex; justify-content:flex-end; gap:6px; margin-top:8px}
.правка-низ button{font:inherit; font-size:12.5px; padding:6px 12px; border-radius:10px;
     cursor:pointer; transition:transform .14s var(--пружина), opacity .18s}
.правка-низ button:active{transform:scale(.94)}
.правка-нет{border:1px solid oklch(1 0 0 / .70); color:var(--fg-m);
     background:linear-gradient(158deg, oklch(1 0 0 / .8), oklch(0.965 0.012 210 / .68))}
.правка-да{border:1px solid var(--accent); background:var(--accent); color:#fff}
.правка-да:hover{opacity:.88}
.мысль.выбрана{border-color:var(--accent)}
/* ГОЛОС В КАРТОЧКЕ. Мысль встаёт в ленту в ту же секунду, когда отпустил кнопку,
   а слова догоняют с мака. Пока их нет — карточка честно говорит, чего ждёт, и даёт
   послушать: человек должен видеть, что мысль спасена, а не гадать. */
.распознаётся{color:var(--fg-l); animation:дышит 1.8s ease-in-out infinite}
.знак{width:14px; height:14px; vertical-align:-2.5px; margin-right:2px}
.низ .звук{
  font:inherit; font-size:12.5px; padding:0; border:none; background:none;
  color:var(--fg-l); display:inline-flex; align-items:center; gap:4px;
  transition:color .18s;
}
.низ .звук:active{color:var(--accent)}
.низ .звук .знак{margin:0}
@keyframes дышит{50%{opacity:.42}}
.снимки{display:flex; gap:7px; flex-wrap:wrap; margin-top:9px}
.снимки img{
  width:84px; height:84px; object-fit:cover; border-radius:12px; display:block;
  border:1px solid oklch(1 0 0 / .7); animation:проявь .3s ease;
  transition:transform .14s var(--пружина);
}
.снимки img:active{transform:scale(.95)}
/* просмотр во весь экран: снимок открывается поверх всего, закрывается касанием */
#лупа{
  position:fixed; inset:0; z-index:50; display:none; place-items:center;
  background:oklch(0.16 0.02 210 / .82); padding:16px;
  animation:проявь .18s ease;
}
#лупа.видна{display:grid}
#лупа img{max-width:100%; max-height:100%; border-radius:14px;
  animation:вырасти .24s var(--пружина)}
@keyframes вырасти{from{opacity:0; transform:scale(.92)} to{opacity:1; transform:none}}
.пусто{text-align:center; color:var(--fg-l); font-size:15px; padding:44px 14px; line-height:1.6}
mark{background:oklch(0.90 0.10 95 / .75); color:inherit; border-radius:3px; padding:0 1px}

/* ── написать ─────────────────────────────────────────────────────────────── */
footer{padding:4px 12px calc(8px + env(safe-area-inset-bottom))}
.фишки{display:flex; gap:7px; padding-bottom:8px; flex-wrap:wrap}
.фишка{position:relative; width:56px; height:56px; border-radius:12px; overflow:hidden;
  animation:явь .24s var(--пружина)}
.фишка img{width:100%; height:100%; object-fit:cover}
.фишка button{
  position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%;
  border:none; background:oklch(0.25 0.02 210 / .62); color:#fff; font-size:13px;
  line-height:1; padding:0; display:grid; place-items:center;
}
.строка{display:flex; gap:8px; align-items:flex-end}
textarea{
  flex:1; font:inherit; font-size:16px; line-height:1.4; resize:none; max-height:148px;
  padding:12px 15px; border-radius:19px; border:1px solid oklch(1 0 0 / .70); color:var(--fg);
  background:linear-gradient(158deg, oklch(1 0 0 / .82), oklch(0.965 0.012 210 / .72));
  box-shadow:inset 0 1px 0 oklch(1 0 0 / .94);
  transition:border-color .18s;
}
textarea:focus{outline:none; border-color:var(--accent)}
.круг{
  width:46px; height:46px; flex:none; border-radius:50%; display:grid; place-items:center;
  border:1px solid oklch(1 0 0 / .70); color:var(--fg-m);
  background:linear-gradient(158deg, oklch(1 0 0 / .82), oklch(0.965 0.012 210 / .72));
  box-shadow:inset 0 1px 0 oklch(1 0 0 / .94);
  transition:opacity .18s, transform .14s var(--пружина), background .2s, color .2s;
}
.круг:active{opacity:.85; transform:scale(.94)}
.круг svg{width:21px; height:21px}
/* кнопка «отправить» появляется, когда есть что отправлять — иначе не занимает внимание */
#послать{background:var(--accent); border-color:transparent; color:#fff;
  transform:scale(.6); opacity:0; pointer-events:none; width:0; margin-left:-8px}
#послать.видна{transform:scale(1); opacity:1; pointer-events:auto; width:46px; margin-left:0}
/* МИКРОФОН И «ОТПРАВИТЬ» ДЕЛЯТ ОДНО МЕСТО. В строке всегда ровно три предмета: поле,
   камера и что-то одно из них. Начал писать — говорить уже нечего, кнопка уступает.
   На узком телефоне это разница между «влезло» и «поле в две буквы шириной». */
#микрофон.нет{transform:scale(.6); opacity:0; pointer-events:none; width:0; margin-left:-8px}
#микрофон.пишет{background:var(--accent); border-color:transparent; color:#fff}
.состояние{font-size:12.5px; color:var(--fg-l); text-align:center; padding-top:5px; min-height:17px}
.запись{display:inline-flex; align-items:center; gap:6px; color:var(--accent); font-weight:600}
.запись i{width:7px; height:7px; border-radius:50%; background:var(--accent);
  animation:дышит 1.1s ease-in-out infinite}

@keyframes явь{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
@keyframes проявь{from{opacity:0} to{opacity:1}}
@keyframes кружись{to{transform:rotate(360deg)}}
.крутится{animation:кружись 1s linear infinite}

/* ── Гили на телефоне: одно лицо с «Разберёмся» ────────────────────────────
   Десктоп остаётся прежним. На телефоне Гили — не таблица заметок, а спокойный
   разговор: живой верх, бусы потоков, сообщения-листы и одна большая строка.
   Стекло неподвижное, анимации только transform/opacity — iPhone не греется. */
@media (max-width:720px){
  :root{--r:20px; --пружина:cubic-bezier(.22,1,.36,1)}
  html,body{height:100%; height:100dvh}
  body{
    font-size:16px;
    background:oklch(.91 .02 218) url('gili-sky-v1.jpg') center/cover no-repeat;
    overflow:hidden;
  }
  body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,oklch(1 0 0/.04),oklch(.92 .02 214/.16) 44%,oklch(.78 .06 210/.24));}
  #сцена{display:block;position:fixed;inset:0;z-index:1;width:100%;height:100%;pointer-events:none;opacity:.55}
  #старт,#вход,#приложение{position:relative;z-index:2}
  #старт{display:flex;flex-direction:column;align-items:center;gap:12px;color:oklch(.25 .05 215);opacity:1}
  #старт[hidden]{display:none}
  #старт .крутится{opacity:.62}
  .старт-слово{display:flex;flex-direction:column;align-items:center;text-shadow:0 1px 12px oklch(1 0 0/.8)}
  .старт-слово strong{font-size:25px;font-weight:720}
  .старт-слово span{font-size:13px;color:oklch(.38 .04 215)}
  #приложение{width:100%; min-height:0; flex:1; display:flex; flex-direction:column; overflow:hidden}
  #приложение[hidden]{display:none}

  header{padding:10px 14px 4px; flex:none}
  .мобильный-бренд{height:48px; display:flex; align-items:center; gap:11px; padding:0 3px 7px}
  .мобильный-знак{
    width:38px; height:38px; flex:none; display:grid; place-items:center; border-radius:13px;
    color:oklch(0.43 0.13 218);
    background:linear-gradient(150deg,oklch(1 0 0/.86),oklch(.95 .022 210/.65));
    border:1px solid oklch(1 0 0/.82);
    box-shadow:inset 0 1px 0 oklch(1 0 0/.96),0 5px 14px -6px oklch(.32 .06 218/.25);
  }
  .мобильный-знак svg{width:24px;height:24px;overflow:visible}
  .мобильный-знак circle{transform-origin:center;animation:сигнал 2.8s ease-in-out infinite}
  .мобильный-знак circle:nth-child(2){animation-delay:-.9s}
  .мобильный-знак circle:nth-child(3){animation-delay:-1.8s}
  .мобильный-имя{min-width:0; display:flex; flex-direction:column; line-height:1.1}
  .мобильный-имя strong{font-size:21px; font-weight:710; letter-spacing:0}
  .мобильный-имя span{margin-top:4px; color:var(--fg-l); font-size:11.5px; font-weight:500}
  .живая-связь{margin-left:auto; display:flex; align-items:center; gap:6px; color:var(--fg-l); font-size:11.5px}
  .живая-связь i{width:7px;height:7px;border-radius:50%;background:oklch(.58 .13 158);box-shadow:0 0 0 4px oklch(.75 .08 158/.18)}
  .живая-связь.нет i{background:oklch(.62 .04 215);box-shadow:0 0 0 4px oklch(.75 .03 215/.16)}
  .живая-связь .верс{font-weight:600;font-size:10px;opacity:.4;letter-spacing:.3px}

  .потоки{
    gap:7px; padding:3px 1px 7px; overflow-x:auto; scrollbar-width:none;
    border:0; border-radius:0; background:transparent; scroll-snap-type:x proximity;
  }
  .потоки::-webkit-scrollbar{display:none}
  .потоки button{
    flex:0 0 auto; min-width:72px; padding:8px 14px; border-radius:999px; scroll-snap-align:start;
    font-size:13px; font-weight:570; color:var(--fg-m);
    border:1px solid oklch(1 0 0/.66); background:oklch(1 0 0/.28);
    box-shadow:inset 0 1px 0 oklch(1 0 0/.55);
    transition:transform .14s var(--пружина),background .18s,color .18s;
  }
  .потоки button:active{transform:scale(.96)}
  .потоки button.on{
    color:oklch(.31 .075 218); font-weight:680;
    background:linear-gradient(155deg,oklch(1 0 0/.92),oklch(.95 .025 212/.75));
    border-color:oklch(1 0 0/.86);

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   ГИЛФОЙЛ — заметочник семьи

   Женя 10.08: «Главное чтоб Саше было легко и удобно туда скидывать».
   Отсюда всё остальное. Приложение открывается и работает мгновенно, ждать
   его не приходится нигде:

   · Мысли показываются из памяти телефона СРАЗУ, ещё до ответа сервера.
     Сеть потом тихо обновит. Пустого экрана при открытии не бывает.
   · Библиотека лежит рядом, а не тянется со стороннего сайта — иначе без
     интернета приложение не запускалось бы вовсе (первая версия этим и болела).
   · Написанное без сети ложится в телефон и уезжает само. Разницы между
     «онлайн» и «офлайн» человек не замечает — в этом и смысл.

   Роли: облако — почтовый ящик, дом — мозг. Дом забирает мысли, разбирает
   по органам и пишет обратно, что с мыслью стало.
   ═══════════════════════════════════════════════════════════════════════════ */

const URL_БАЗЫ = 'https://izvwgyudjbxlixzrgpuv.supabase.co';
const КЛЮЧ = 'sb_publishable_YtwehFnevo4R3UpmOnTTXQ_j4PQY21D';   // публичный по устройству; защита — правила базы
const sb = supabase.createClient(URL_БАЗЫ, КЛЮЧ, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});

/* Порядок потоков — Женин (10.08): дом и семья первыми, работа и код дальше.
   Он же объяснил, зачем их вообще держать: «так легче самому искать что куда
   отправил, как папочки». */
const ПОТОКИ = [
  {код:'дом',    имя:'Дом'},
  {код:'семья',  имя:'Семья', общий:true},   // единственный, который видят все свои
  {код:'работа', имя:'Работа'},
  {код:'кодинг', имя:'Кодинг'},
];
const ПАМЯТЬ_ЛЕНТЫ = 'гили_лента', ПАМЯТЬ_ОЧЕРЕДИ = 'гили_очередь', ПАМЯТЬ_ПОТОКА = 'гили_поток';
const ПАМЯТЬ_КТО = 'гили_кто';   // кто вошёл в прошлый раз — чтобы открываться без сети

let Я = null, МЫСЛИ = [], ФОТО = [], ИСКОМОЕ = '';
let ПОТОК = localStorage.getItem(ПАМЯТЬ_ПОТОКА) || 'дом';

const $ = id => document.getElementById(id);
const экран = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── вход ─────────────────────────────────────────────────────────────────────
   Пароля нет: в «Разберёмся» вход по коду из письма, и здесь тот же аккаунт.
   Экран входа показывается не сразу, а только когда выяснилось, что человек
   ещё не вошёл — иначе при каждом открытии он мигал бы почтой поверх ленты. */
let ЖДЁМ_КОД = false, ПОЧТА = '';

$('войти').onclick = () => ЖДЁМ_КОД ? проверить_код() : прислать_код();

function сказать(текст, плохо){
  $('сказ').textContent = текст;
  $('сказ').classList.toggle('плохо', !!плохо);
}

async function прислать_код(){
  const почта = $('почта').value.trim().toLowerCase();
  if(!почта.includes('@')){ сказать('нужна почта', true); return; }
  $('войти').disabled = true; сказать('отправляю…');
  const {error} = await sb.auth.signInWithOtp({email: почта, options:{shouldCreateUser:true}});
  $('войти').disabled = false;
  if(error){ сказать(по_русски(error), true); return; }
  ПОЧТА = почта; ЖДЁМ_КОД = true;
  $('код').hidden = false; $('код').focus();
  $('войти').textContent = 'Войти';
  сказать('код ушёл на почту');
}

async function проверить_код(){
  const код = $('код').value.replace(/\D/g, '');
  if(код.length < 6){ сказать('код из шести цифр', true); return; }
  $('войти').disabled = true; сказать('проверяю…');
  const {error} = await sb.auth.verifyOtp({email: ПОЧТА, token: код, type:'email'});
  $('войти').disabled = false;
  if(error){ сказать('код не подошёл — проверь письмо', true); return; }
  await поднять();
}

$('почта').addEventListener('keydown', e => { if(e.key === 'Enter') $('войти').click(); });
$('код').addEventListener('keydown', e => { if(e.key === 'Enter') $('войти').click(); });
$('код').addEventListener('input', e => { if(e.target.value.replace(/\D/g,'').length === 6) проверить_код(); });

function по_русски(e){
  const t = (e.message || '').toLowerCase();
  if(t.includes('rate') || t.includes('seconds')) return 'слишком часто — подожди минуту';
  if(t.includes('network') || t.includes('fetch') || t.includes('failed')) return 'нет связи — попробуй позже';
  return e.message || 'не вышло';
}

function показать(что){
  for(const id of ['старт','вход','приложение']) $(id).hidden = (id !== что);
}

/* МГНОВЕННЫЙ СТАРТ. Женя 11.09: «на телефоне медленно грузится… приложение непригодное».
   Замер показал, почему: прежде чем показать хоть что-то, приложение ждало ДВА сетевых
   запроса — `getUser()` проверял токен на сервере и `gili_family` проверял, свой ли ты, —
   хотя лента уже лежала в памяти телефона. На мобильной сети это секунды белого экрана
   при каждом открытии ради проверки, ответ которой не менялся месяцами.
   Теперь: входил раньше — лента на экране сразу, проверка личности идёт следом в фоне.
   Не прошла (вышел, убрали из семьи) — покажем вход и сотрём память.
   Безопасность не страдает: данные отдаёт база по правам, а не экран. */
function кто_в_памяти(){
  try{ const с = JSON.parse(localStorage.getItem(ПАМЯТЬ_КТО) || 'null');
       return (с && с.id && с.имя) ? с : null; }catch{ return null; }
}
function забыть_кто(){ try{ localStorage.removeItem(ПАМЯТЬ_КТО); }catch{} }

function открыть_ленту(){
  нарисовать_потоки();
  МЫСЛИ = из_памяти(ПАМЯТЬ_ЛЕНТЫ);
  нарисовать();
  по_ссылке();
}

async function поднять(){
  const запомнен = кто_в_памяти();
  if(запомнен){                       // ← экран появляется здесь, до всякой сети
    Я = запомнен;
    $('кто').textContent = запомнен.имя;
    показать('приложение');
    открыть_ленту();
    загрузить().then(() => { if(МЫСЛИ.some(ждёт_слов)) догонять_голос(); });
  }
  // ВХОД НЕ ДОЛЖЕН ЖДАТЬ СЕТИ. Женя 13.09: «хочу чтобы он при любых раскладах записывал… даже офлайн».
  // getUser() ходит на сервер. Без сети он возвращает user:null (или ошибку сети) — и старый код
  // выкидывал залогиненного ко входу и стирал память, после чего приложение скрыто и писать некуда.
  // Теперь: сеть молчит → остаёмся тем, кем себя помним, запись копится в очереди и уедет сама.
  // Ко входу выкидываем только на ЯВНЫЙ ответ сервера «ты не тот» (получен при живой сети).
  let user = null, ошибка_входа = null;
  try{ const r = await sb.auth.getUser(); user = r.data && r.data.user; ошибка_входа = r.error; }
  catch(e){ ошибка_входа = e; }
  const сеть_молчит = !navigator.onLine ||
    (ошибка_входа && /fetch|network|timeout|failed|retryable|load/i.test((ошибка_входа.name||'') + ' ' + (ошибка_входа.message||'')));
  if(сеть_молчит){
    if(!запомнен) показать('вход');   // впервые открыли без сети и без памяти — показать нечего
    return;                            // помним человека → он уже в приложении, очередь довезёт
  }
  if(!user){ забыть_кто(); показать('вход'); return; }

  const {data: свой, error: ошибка_семьи} = await sb.from('gili_family').select('name').eq('user_id', user.id).maybeSingle();
  if(ошибка_семьи){                     // база молчит (таймаут/403) — не выходим, если помним себя
    if(!запомнен) показать('вход');
    return;
  }
  if(!свой){
    забыть_кто();
    показать('вход');
    сказать('этот аккаунт ещё не в семье — скажи Жене', true);
    await sb.auth.signOut(); return;
  }
  Я = {id: user.id, имя: свой.name};
  try{ localStorage.setItem(ПАМЯТЬ_КТО, JSON.stringify(Я)); }catch{}   // следующий раз откроется сразу
  $('кто').textContent = свой.name;
  показать('приложение');

  sb.from('gili_family').select('user_id,name').then(({data}) => {
    if(data){ data.forEach(ч => СЕМЬЯ[ч.user_id] = ч.name); нарисовать(); }
  });

  if(!запомнен){
    открыть_ленту();                  // при мгновенном старте это уже нарисовано выше
    загрузить().then(() => { if(МЫСЛИ.some(ждёт_слов)) догонять_голос(); });
  }
  подписаться();
  везти_очередь();
}

function нарисовать_потоки(){
  $('потоки').innerHTML = ПОТОКИ.map(п =>
    `<button data-код="${п.код}" class="${п.код === ПОТОК ? 'on' : ''}">${п.имя}</button>`).join('');
  подпись_потока();
  $('потоки').querySelectorAll('button').forEach(б => б.onclick = () => {
    ПОТОК = б.dataset.код;
    localStorage.setItem(ПАМЯТЬ_ПОТОКА, ПОТОК);
    $('потоки').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === б));
    подпись_потока();
    нарисовать();
    $('лента').scrollTop = $('лента').scrollHeight;
  });
}

async function загрузить(){

    .select('id,flow,body,photos,audio,created_at,status,author')
    .order('created_at', {ascending:false}).limit(200);

  в_память(ПАМЯТЬ_ЛЕНТЫ, data.slice(0, 80));  // с запасом на следующее открытие

}

const день_ключ = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
/* ВОЗРАСТ ЦИФРОЙ, А НЕ В УМЕ (задача Жени 12.08). «3 августа» заставляет считать в уме,
   сколько это дней назад. Считать — работа механизма, а не человека. То же исправление
   уехало в окно на маке: разделители дней говорят одинаково в обоих окнах. */
function день(iso){
  const d = new Date(iso), с = new Date();
  if(день_ключ(d) === день_ключ(с)) return 'сегодня';
  const в = new Date(с); в.setDate(в.getDate() - 1);
  if(день_ключ(d) === день_ключ(в)) return 'вчера';
  const дата = d.toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
  const дней = Math.round((new Date(с.getFullYear(), с.getMonth(), с.getDate()) -
                           new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  return дата + ' · ' + (дней < 7 ? дней + ' дн'
                       : дней < 31 ? Math.round(дней / 7) + ' нед'
                       : Math.round(дней / 30) + ' мес');
}
const часы = iso => new Date(iso).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});

function подсветить(текст){
  if(!ИСКОМОЕ) return экран(текст);
  const i = текст.toLowerCase().indexOf(ИСКОМОЕ);
  if(i < 0) return экран(текст);
  return экран(текст.slice(0,i)) + '<mark>' + экран(текст.slice(i, i+ИСКОМОЕ.length)) +
         '</mark>' + экран(текст.slice(i+ИСКОМОЕ.length));
}

/* Обработанная мысль — та, с которой человеку больше делать нечего: дом её разобрал,
   кодер закрыл, или она уже уехала в дело. Всё прочее ждёт Женю и остаётся на виду. */
const обработана = м => {
  const с = (м.status || '').toLowerCase();
  return /сделано|у коры|разобрано|✓✓/.test(с) || !!м.done_at;
};

let ПОКАЗЫВАТЬ_ВСЁ = localStorage.getItem('гили_вид') === 'всё';
$('вид').onclick = () => {
  ПОКАЗЫВАТЬ_ВСЁ = !ПОКАЗЫВАТЬ_ВСЁ;
  localStorage.setItem('гили_вид', ПОКАЗЫВАТЬ_ВСЁ ? 'всё' : 'ждёт');
  нарисовать();
};

function нарисовать(){
  // Пока человек правит, фоновое обновление ленты карточку не перерисовывает — иначе
  // textarea пересоздастся и набранное пропадёт на полуслове. Закрытие правки ОБЯЗАНО
  // сначала обнулить ПРАВЛЮ и только потом звать нарисовать(): в окне на маке такой же
  // замок 02.09 держал правку открытой навсегда — «нельзя удалить окно )))».
  if(ПРАВЛЮ && document.querySelector('.редактор')) return;
  const ждущие = очередь()
    // при поиске ждущие ищутся наравне с остальными, а не показываются всегда
    .filter(з => ИСКОМОЕ ? (з.текст||'').toLowerCase().includes(ИСКОМОЕ) : з.поток === ПОТОК)
    .map(з => ({
      id:'ж'+з.когда, flow:з.поток, created_at:new Date(з.когда).toISOString(), ждёт:true,
      звук_ждёт: !!з.звук,
      body: з.текст + ((з.фото||[]).length ? `\n${з.фото.length} фото ждёт отправки` : ''),
    }));

  let список = ИСКОМОЕ
    ? МЫСЛИ.filter(м => (м.body||'').toLowerCase().includes(ИСКОМОЕ))
    : МЫСЛИ.filter(м => м.flow === ПОТОК);

  // поиск ищет везде, включая обработанное — иначе «найди ту накладную» не сработает
  const всего = список.length, готовых = список.filter(обработана).length;
  if(!ПОКАЗЫВАТЬ_ВСЁ && !ИСКОМОЕ) список = список.filter(м => !обработана(м));
  список = ждущие.concat(список).slice(0, 200);

  $('вид').classList.toggle('всё', ПОКАЗЫВАТЬ_ВСЁ);
  $('вид').innerHTML = ПОКАЗЫВАТЬ_ВСЁ
    ? `всё <b>${всего}</b>`
    : (готовых ? `ждёт <b>${всего - готовых}</b>` : 'ждёт');
  $('вид').title = ПОКАЗЫВАТЬ_ВСЁ ? 'скрыть обработанные' : `обработано: ${готовых}`;

  if(!список.length){
    рисуй(`<div class="пусто">${ИСКОМОЕ ? 'ничего не нашлось'
      : (ПОКАЗЫВАТЬ_ВСЁ ? 'Здесь пусто.\nНапиши мысль внизу — дом её разберёт.'
                        : 'Всё разобрано.\nНажми «ждёт», чтобы посмотреть обработанное.')}</div>`);
    return;
  }

  let html = '', прошлый = '';
  // лента идёт снизу вверх: свежее у поля ввода, как в переписке
  for(const м of список.slice().reverse()){
    const д = день(м.created_at);
    if(д !== прошлый){ html += `<div class="день">${д}</div>`; прошлый = д; }
    const снимки = (м.photos || []);
    const фото = снимки.length
      ? `<div class="снимки">` + снимки.map(п => `<img loading="lazy" data-путь="${экран(п)}" alt="снимок">`).join('') + `</div>`
      : '';
    const чей = (м.author && Я && м.author !== Я.id) ? имя_автора(м.author) : '';
    const открыта = ОТКРЫТА === м.id;
    // сказанное вслух: пока слов нет, карточка говорит, чего ждёт, и даёт послушать
    const правится = ПРАВЛЮ === м.id;
    const тело = правится ? редактор(м)
               : ждёт_слов(м) ? `<span class="распознаётся">${ЗНАК_ГОЛОСА} распознаю…</span>`
               : м.звук_ждёт  ? `<span class="распознаётся">${ЗНАК_ГОЛОСА} запись ждёт сети</span>`
               : подсветить(м.body || '');
    const послушать = (ждёт_слов(м) && м.audio !== ЖДУ)
      ? `<button class="звук" data-звук="${экран(м.audio)}">${ЗНАК_ГОЛОСА}послушать</button>` : '';
    const сторона = (!м.author || м.ждёт || (Я && м.author === Я.id)) ? ' своя' : ' чужая';
    html += `<div class="мысль стекло${сторона} ${м.ждёт ? 'ждёт' : ''}${обработана(м) ? ' готовая' : ''}` +
            `${открыта ? ' выбрана' : ''}" data-ид="${м.id}">${тело}${фото}` +
            `<div class="низ"><span>${часы(м.created_at)}</span><span>·</span>` +
            `<b class="${окраска(м.status)}">${м.ждёт ? 'в телефоне' : человечно(м.status)}</b>` +
            послушать +
            (ИСКОМОЕ ? `<span>${имя_потока(м.flow)}</span>` : '') +
            (чей ? `<span class="чей">${экран(чей)}</span>` : '') + `</div>` +
            (открыта && !м.ждёт && !правится ? панель(м) : '') + `</div>`;
  }
  рисуй(html);
}

/* Не перерисовываем одно и то же: замена разметки убивает прокрутку и мигает.
   (Та же грабля была в домашнем Гилфойле — лента моргала под курсором.) */
/* Панель под мыслью: куда переложить, отметить сделанной, убрать совсем. */
function панель(м){
  const кнопки = ПОТОКИ.filter(п => п.код !== м.flow)
    .map(п => `<button onclick="перенести('${м.id}','${п.код}')">→ ${п.имя}</button>`).join('');
  return `<div class="правка">` +
         `<button onclick="править('${м.id}')">изменить</button>${кнопки}` +
         (обработана(м) ? '' : `<button class="готово" onclick="пометить_готовой('${м.id}')">✓ сделано</button>`) +
         `<button class="убрать" onclick="убрать('${м.id}')">убрать</button></div>`;
}

/* ИЗМЕНИТЬ ТЕКСТ МЫСЛИ. Женя 30.08: «редактировать сообщение с телефона в Гили нельзя».
   Так и было: мысль улетала и застывала — опечатку или забытое слово исправить нечем,
   хотя на маке правка есть с самого начала.

   Почему это не «просто поле ввода»: мысль к этому моменту уже увезена домой, разобрана
   и, возможно, доставлена кодеру или в CRM. Поправить её только здесь значит развести
   две правды — на телефоне одно, в памяти другое, и человек будет уверен, что исправил.

   Нить, по которой правка доезжает, уже существует: дом кладёт к себе `облако_id` этой
   записи (31 мысль в ленте с ним). Значит ему хватает статуса-сигнала, чтобы найти свою
   строку и обновить текст. Контракт: `status: 'правка'` = «тело изменил человек, забери
   заново». Дом снимает статус, когда применил.

   Пока дом статус не разбирает, правка честно говорит, что доехала не до конца —
   врать про «исправлено» нельзя, это та же тихая ложь, что и «✓ записано» у голоса,
   который до дома не добирался. */
/* ПРАВКА ПРЯМО В КАРТОЧКЕ. Женя 31.08 19:42: «Что за уродство )) Хочу прчм как в тг
   внутри сообщения редактировать». Уродством было системное окошко prompt() — я поставил
   его 31.08, чтобы правка появилась хоть какая-то, и оно честно заработало. Но он прав:
   окно, вырванное из ленты, — это не правка, это допрос. Теперь текст раскрывается в
   поле на месте самой мысли, под ним «отменить» и «сохранить», остальное как было:
   status 'правка' говорит дому «забери заново», карточка честно пишет «правка ждёт дома». */
function редактор(м){
  return `<textarea class="редактор" rows="2" autocorrect="off" autocapitalize="off" spellcheck="false">${экран(м.body || '')}</textarea>` +
         `<div class="правка-низ"><button class="правка-нет" onclick="отменить_правку()">отменить</button>` +
         `<button class="правка-да" onclick="сохранить_правку('${м.id}')">сохранить</button></div>`;
}

function править(ид){
  const м = МЫСЛИ.find(x => x.id === ид); if(!м) return;
  ОТКРЫТА = null; ПРАВЛЮ = ид; нарисовать();
  const ta = document.querySelector('.редактор'); if(!ta) return;
  const рост = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
  рост(); ta.addEventListener('input', рост);
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  ta.addEventListener('keydown', e => {
    if(e.key === 'Escape'){ e.preventDefault(); отменить_правку(); }
    // Enter на телефоне — перенос строки, как в переписке; сохраняет кнопка или ⌘/Ctrl+Enter
    if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); сохранить_правку(ид); }
  });
}

function отменить_правку(){ ПРАВЛЮ = null; нарисовать(); }

async function сохранить_правку(ид){
  const м = МЫСЛИ.find(x => x.id === ид); if(!м){ ПРАВЛЮ = null; нарисовать(); return; }
  const ta = document.querySelector('.редактор');
  const было = м.body || '', текст = (ta ? ta.value : '').trim();
  ПРАВЛЮ = null;                                    // сначала снять замок, потом рисовать
  if(!текст || текст === было.trim()){ нарисовать(); return; }
  м.body = текст; м.status = 'правка'; нарисовать();   // на экране сразу, без ожидания сети
  const {error} = await sb.from('gili_notes').update({body: текст, status: 'правка'}).eq('id', ид);
  if(error){ м.body = было; нарисовать(); сказать('правка не ушла: ' + error.message); return; }
  загрузить();
}

function рисуй(html){
  const л = $('лента');
  if(л.dataset.было === html) return;
  const внизу = л.scrollHeight - л.scrollTop - л.clientHeight < 60;

  /* ЯКОРЬ. Женя 07.08: «иногда скролл сам подпрыгивает вверх, приходится всегда
     подкручивать чуть выше, так во всех 3-х окнах», и 10.08: «по прежнему подпрыгивает
     после отправки». В окне на маке это лечили четырежды и вылечили якорем, а сюда
     лекарство не доехало — здесь позиция не восстанавливалась вообще.

     ЧТО НА САМОМ ДЕЛЕ ПРОИСХОДИТ (замер на стенде 13.08, до того чинили вслепую):
     scrollTop НЕ обнуляется — он честно остаётся, каким был. Уезжает содержимое ПОД ним.
     Снимки приходят из хранилища асинхронно (показать_фото), встают выше точки чтения
     и раздвигают ленту на свою высоту. Прокрутка та же, а под ней уже другая мысль —
     человек читает и вдруг видит не то. Это и есть «подпрыгнуло».
     Замер: было scrollTop 600 → осталось 600, но мысль на верхней кромке сменилась.

     Поэтому держимся не за число пикселей, а за саму мысль: запоминаем ту, что у верхней
     кромки, и после отрисовки ставим её на то же место (scrollTop при этом СДВИНЕТСЯ —
     так и надо, он компенсирует то, что выросло выше). Арифметика «расстояние до низа»
     уже проверена на маке и врёт: высота меняется в тот же миг.

     Якорей берём три: мысль, за которую держались, может из ленты исчезнуть — ты нажал
     «убрать» ровно на ней. Тогда держимся за следующую. */
  const якоря = [];
  if(!внизу){
    for(const м of л.querySelectorAll('.мысль')){
      const верх = м.offsetTop - л.scrollTop;
      if(верх >= -м.offsetHeight){
        якоря.push({ид: м.dataset.ид, отступ: верх});
        if(якоря.length === 3) break;
      }
    }
  }

  л.dataset.было = html;
  л.innerHTML = html;

  if(внизу){
    л.scrollTop = л.scrollHeight;
  } else if(якоря.length){
    const вернуть = () => {
      for(const я of якоря){
        const м = л.querySelector(`.мысль[data-ид="${я.ид}"]`);
        if(м){ л.scrollTop = м.offsetTop - я.отступ; return; }
      }
    };
    вернуть();
    requestAnimationFrame(вернуть);        // и после того, как браузер пересчитал размеры
  }
  показать_фото();
}

const имя_потока = к => (ПОТОКИ.find(п => п.код === к) || {}).имя || к;

/* СТАТУС ГОВОРИТ ПО-ЧЕЛОВЕЧЕСКИ. Женя 13.08 спросил про свою же мысль: «✓✓ у Коры — чё это,
   почему так называется». Кора — имя ассистента штаба, и человеку оно ничего не говорит:
   интерфейс разговаривал внутренними именами механизмов. Раз пользователь спрашивает, что
   написано на его экране, — виноват экран.
   Правим только показ, в базе статус остаётся прежним: она общая с домом, и переучивать
   её ради вывески значит завести вторую правду. → штабу: в `Домик/scripts/облако.py`
   (`куда_ушла`) статус собирается словами «✓✓ у Коры» — переименовать бы в источнике. */
function человечно(статус){
  const с = (статус || '').trim();
  if(!с) return 'записано';
  // о том, что слова ещё едут, говорит сама карточка — незачем повторять это дважды в строку
  if(с === 'распознаётся') return 'записано';
  // правка ждёт дома: говорим как есть, а не «исправлено» — исправлено будет, когда доедет
  if(с === 'правка') return 'правка ждёт дома';
  if(с.includes('у Коры')) return '✓✓ разобрано';
  // стрелка уже говорит «ушло» — лишние слова ломают строку в узкой колонке (проверено глазами)
  const кому = с.match(/^→\s*(.+)$/);
  if(кому) return `→ ${кому[1].replace(/\s*Сервис$/, '')}`;
  return с;
}

let ОТКРЫТА = null;                       // какая мысль сейчас показывает действия
let ПРАВЛЮ = null;                        // какая мысль сейчас правится прямо в карточке
document.addEventListener('click', e => {

/* Перенести в другой поток. Мысль уходит туда, куда решил человек, и это же

/* Поправка человека — материал для обучения разбора. Копим на маке: дом заберёт
   вместе с мыслью и допишет в свои уроки, чтобы в следующий раз решить самому. */
function учить(текст, поток){
  try{
    const у = JSON.parse(localStorage.getItem('гили_уроки') || '[]');
    у.push({текст: (текст || '').slice(0, 120), поток, когда: new Date().toISOString()});
    localStorage.setItem('гили_уроки', JSON.stringify(у.slice(-200)));
  }catch{}
}
/* Судьба задачи цветом: молчание видно боковым зрением, закрытое радует. */

                   : /сделано/.test(с || '') ? 'готово'
                   : /^→/.test((с || '').trim()) ? 'ушла' : '';
let СЕМЬЯ = {};

/* Фото лежат в закрытом хранилище — прямых ссылок нет, просим временную на час.
   В ленте показываем маленькое: Женя 11.08 — «накладная на весь экран, пусть сжимается
   до маленького превью, после открытия только разворачивается». */
async function показать_фото(){
  for(const img of $('лента').querySelectorAll('img[data-путь]')){
    const путь = img.dataset.путь; delete img.dataset.путь;

    if(data?.signedUrl) img.src = data.signedUrl;
  }
  /* Ссылку на запись берём ЗАРАНЕЕ, а не по нажатию. На айфоне звук играет только в тот
     же миг, что и касание: подождать ответа сервера — и Safari уже считает, что человек
     ничего не нажимал, и молчит. Поэтому к моменту касания ссылка лежит в кнопке. */
  for(const б of $('лента').querySelectorAll('button[data-звук]')){

    const {data} = await sb.storage.from('gili').createSignedUrl(путь, 3600);
    if(data?.signedUrl) б.dataset.ссылка = data.signedUrl; else б.remove();
  }
}

/* ── очередь: без сети мысль не теряется ──────────────────────────────────── */
const очередь = () => из_памяти(ПАМЯТЬ_ОЧЕРЕДИ);
function в_очередь(з){ в_память(ПАМЯТЬ_ОЧЕРЕДИ, очередь().concat(з)); нарисовать(); обновить_состояние(); }

function обновить_состояние(){

let ВЕЗУ = false;
async function везти_очередь(){

  ВЕЗУ = true;
  for(const з of очередь()){
    try{
      if(з.звук){            // сказанное без сети: звук ждал в телефоне буквами, теперь уезжает
        const путь = await залить_звук(избуквы(з.звук));

          {author: Я.id, flow: з.поток, body: '', photos: [], audio: путь, status: 'распознаётся'});
        if(error) throw error;

});

/* ── фото ─────────────────────────────────────────────────────────────────────
   Ужимаем прямо в телефоне: снимок айфона весит 3–5 МБ, и такой не влезет
   ни в память телефона на время без сети, ни в разумный трафик. 1600 px
   хватает, чтобы прочитать ценник, накладную или бумагу. */
async function ужать(файл){
  if(!файл.type.startsWith('image/')) return null;
  const bmp = await createImageBitmap(файл).catch(() => null);
  if(!bmp) return файл;
  const край = 1600, k = Math.min(1, край / Math.max(bmp.width, bmp.height));
  if(k === 1 && файл.size < 900e3) return файл;
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close?.();
  // 0.6 вместо 0.72: накладная и ценник читаются так же, а весит вдвое меньше —
  // это и трафик, и место в общей квоте базы
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.6));
  return blob && blob.size < файл.size ? new File([blob], 'фото.jpg', {type:'image/jpeg'}) : файл;
}
const вбукву = ф => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(ф); });
function избуквы(строка){
  const [шапка, тело] = строка.split(',');
  const б = atob(тело), a = new Uint8Array(б.length);
  for(let i = 0; i < б.length; i++) a[i] = б.charCodeAt(i);
  return new Blob([a], {type: (шапка.match(/:(.*?);/) || [,'image/jpeg'])[1]});
}
async function залить(blob){
  const путь = `${Я.id}/${Date.now().toString(36)}${Math.round(Math.random()*1e6).toString(36)}.jpg`;
  const {error} = await sb.storage.from('gili').upload(путь, blob, {contentType: blob.type || 'image/jpeg'});
  if(error) throw error;
  return путь;
}

// Один путь для всех источников снимка: камера, файл, буфер обмена, перетаскивание.
// Ужимаем и складываем фишкой — отправку решает уже вызывающий.
async function добавить_фото(файлы){
  let добавлено = 0;
  for(const ф of файлы){
    if(!ф || !ф.type?.startsWith('image/')) continue;
    const у = await ужать(ф); if(!у) continue;
    ФОТО.push({файл: у, ссылка: URL.createObjectURL(у)});
    добавлено++;
  }
  if(добавлено) нарисовать_фишки();
  return добавлено;
}

// Женя 30.08: «добавь возможность вставлять фото из буфера». На маке это уже было,
// а в окне из интернета (телефон, любой браузер) — нет. Вставка НЕ отправляет сама:

document.addEventListener('paste', async e => {

/* ── голос ────────────────────────────────────────────────────────────────────
   Женя 19.08: «Я про телефон. Про говорить. Суть же в удобстве, чтобы я с телефона
   любого заходил в свою учётку или Жена и мы делали заметки, а они автоматически
   распределялись». За рулём и в сервисе печатать нечем — а сказать можно.

   Микрофон браузер даёт только по https, поэтому голос живёт именно здесь, в окне
   из интернета, а не в домашнем окне мака по локальному адресу.

   ПОЧЕМУ МЫСЛЬ ПОЯВЛЯЕТСЯ РАНЬШЕ СЛОВ. Распознаёт речь мак: у него whisper и тишина
   вокруг, у телефона — ни модели, ни батареи на неё. Значит между «сказал» и «прочитал»
   всегда есть пауза, а спящий мак растянет её на часы. Ждать эту паузу нельзя: мысль
   должна быть спасена в секунду, когда её произнесли. Поэтому запись уезжает в хранилище
   рядом с мыслью, карточка встаёт в ленту сразу — и слова догоняют.
   Ровно так это уже работает в окне на маке (19.08), здесь тот же порядок.

   ДОГОВОР С ДОМОМ: у записи в базе заполнено поле `audio` — путь в хранилище `gili`,
   а `body` пуст, пока слова не приехали. Дом забирает звук, распознаёт и пишет текст
   обратно в `body`; пустое тело + непустой audio = «ещё не распознано», и это
   единственный признак, по которому обе стороны узнают такую мысль. */
const ПРЕДЕЛ_ЗАПИСИ = 3 * 60 * 1000;      // забыл остановить — остановим сами
const ЖДУ = '…';                          // путь-заглушка у мысли, которая ещё не уехала
const ЗНАК_ГОЛОСА = '<svg class="знак" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="1.9" stroke-linecap="round"><rect x="9" y="2.6" width="6" height="11.2" rx="3"/>' +
  '<path d="M5 11.2a7 7 0 0 0 14 0M12 18.2v3"/></svg>';
const ждёт_слов = м => !!м.audio && !(м.body || '').trim();

let ЗАПИСЬ = null, таймер_низа;

/* Нижняя строка занята очередью, но во время записи важнее секунды. Сказали — сказали,
   через несколько секунд строка сама возвращается к своему делу. */
function сказать_внизу(html, мс = 3500){
  clearTimeout(таймер_низа);
  $('состояние').innerHTML = html;
  if(мс) таймер_низа = setTimeout(обновить_состояние, мс);
}

const умеет_слушать = !!(navigator.mediaDevices?.getUserMedia && window.MediaRecorder);
if(!умеет_слушать) $('микрофон').hidden = true;   // старый браузер или адрес без https

$('микрофон').onclick = () => {
  if(ЗАПИСЬ){ try{ ЗАПИСЬ.rec.stop(); }catch(e){} return; }
  начать_запись();
};

async function начать_запись(){
  let поток;
  try{ поток = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ сказать_внизу('микрофон не дали — разреши его этому сайту в настройках', 6000); return; }

  // Safari отдаёт mp4, остальные — webm; спрашиваем браузер, а не угадываем по имени
  const тип = ['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus']
    .find(т => { try{ return MediaRecorder.isTypeSupported(т); }catch(e){ return false; } }) || '';
  let rec;
  try{ rec = new MediaRecorder(поток, тип ? {mimeType: тип} : {}); }
  catch(e){ поток.getTracks().forEach(д => д.stop()); сказать_внизу('запись тут не работает'); return; }

  const куски = [];
  rec.ondataavailable = e => { if(e.data && e.data.size) куски.push(e.data); };
  const сторож = setTimeout(() => { try{ if(rec.state === 'recording') rec.stop(); }catch(e){} }, ПРЕДЕЛ_ЗАПИСИ);

  rec.onstop = () => {
    clearTimeout(сторож);
    clearInterval(ЗАПИСЬ && ЗАПИСЬ.часы);
    поток.getTracks().forEach(д => д.stop());     // микрофон отпущен сразу, а не «потом»
    ЗАПИСЬ = null;
    $('микрофон').classList.remove('пишет');
    показать_кнопку();
    const звук = new Blob(куски, {type: rec.mimeType || тип || 'audio/webm'});
    if(звук.size < 1500){ сказать_внизу('слишком коротко — ничего не записалось'); return; }
    отправить_голос(звук);
  };

  rec.start();
  ЗАПИСЬ = {rec, начало: Date.now(), часы: setInterval(тикать, 1000)};
  $('микрофон').classList.add('пишет');
  тикать();
}

function тикать(){
  if(!ЗАПИСЬ) return;
  const с = Math.floor((Date.now() - ЗАПИСЬ.начало) / 1000);
  clearTimeout(таймер_низа);
  $('состояние').innerHTML =
    `<span class="запись"><i></i>${Math.floor(с/60)}:${String(с%60).padStart(2,'0')}</span>` +
    ` · нажми ещё раз, когда договоришь`;
}

async function отправить_голос(звук){
  const метка = Date.now();
  // мысль в ленте раньше, чем звук доехал: с этой секунды её уже не потерять
  const мгновенная = {id: ЖДУ + метка, flow: ПОТОК, body: '', photos: [], audio: ЖДУ,
                      created_at: new Date().toISOString(), status: 'распознаётся', author: Я.id};
  МЫСЛИ = [мгновенная].concat(МЫСЛИ);
  нарисовать();
  сказать_внизу('записано — слова догонят', 2500);
  try{
    if(!navigator.onLine) throw new Error('нет сети');
    const путь = await залить_звук(звук);
    const {error} = await sb.from('gili_notes').insert(
      {author: Я.id, flow: ПОТОК, body: '', photos: [], audio: путь, status: 'распознаётся'});
    if(error) throw error;
    await загрузить();
    догонять_голос();
  }catch(e){
    МЫСЛИ = МЫСЛИ.filter(м => м.id !== мгновенная.id);
    в_очередь({когда: метка, поток: ПОТОК, текст: '', звук: await вбукву(звук)});
    // память телефона не резиновая: длинная запись может в неё не влезть, и молчать
    // об этом нельзя — человек уверен, что мысль сохранена, а её нет нигде
    if(очередь().some(з => з.когда === метка)) сказать_внизу('сети нет — запись уедет сама', 5000);
    else сказать_внизу('запись не поместилась в память телефона — скажи покороче', 7000);
  }
}

async function залить_звук(blob){
  const тип = (blob.type || 'audio/webm').split(';')[0];
  const хвост = {'audio/mp4':'m4a', 'audio/mpeg':'mp3', 'audio/ogg':'ogg',
                 'audio/wav':'wav', 'audio/aac':'aac'}[тип] || 'webm';
  const путь = `${Я.id}/${Date.now().toString(36)}${Math.round(Math.random()*1e6).toString(36)}.${хвост}`;
  const {error} = await sb.storage.from('gili').upload(путь, blob, {contentType: тип});
  if(error) throw error;
  return путь;
}

/* ДОГОН СЛОВ. Обычно текст приезжает сам: база толкает изменение, и лента освежается.
   Но толчок может не дойти (метро, спящая вкладка), а «распознаю…» на экране без движения
   выглядит как поломка. Поэтому пока в ленте есть мысль без слов — переспрашиваем каждые
   три секунды, и не дольше пяти минут: мак мог не проснуться, и висеть в опросе сутки
   ради этого незачем. */
let догон = null, догон_до = 0;
function догонять_голос(){
  догон_до = Date.now() + 5 * 60 * 1000;
  if(догон) return;
  догон = setInterval(() => {
    if(Date.now() > догон_до || !МЫСЛИ.some(ждёт_слов)){ clearInterval(догон); догон = null; return; }
    загрузить();
  }, 3000);
}

/* ── написать ─────────────────────────────────────────────────────────────────
   Женя 10.08: «я не смог сообщение отправить, кнопки ентер нет». Правильно:
   на телефоне Enter переносит строку, а отправлять нечем. Теперь есть кнопка —
   она появляется, только когда есть что отправить, и не мозолит глаза. */
const поле = $('поле');
поле.addEventListener('input', () => {
  поле.style.height = 'auto';
  поле.style.height = Math.min(поле.scrollHeight, 148) + 'px';
  показать_кнопку();
});
поле.addEventListener('keydown', e => {
  // на компьютере привычнее Enter; на телефоне он переносит строку
  if(e.key === 'Enter' && !e.shiftKey && window.innerWidth >= 860){ e.preventDefault(); отправить(); }
});
function показать_кнопку(){
  const есть_что_слать = !!поле.value.trim() || !!ФОТО.length;
  $('послать').classList.toggle('видна', есть_что_слать);
  $('микрофон').classList.toggle('нет', есть_что_слать);   // начал писать — говорить уже нечего
}
$('послать').onclick = отправить;

async function отправить(){
  const текст = поле.value.trim();
  if(!текст && !ФОТО.length) return;
  const фото = ФОТО.slice(); ФОТО = [];
  поле.value = ''; поле.style.height = 'auto';
  нарисовать_фишки();
  const тело = текст || 'фото';

  // мысль видна сразу — человек не ждёт сервер, чтобы поверить, что записалось
  const мгновенная = {id:'…'+Date.now(), flow:ПОТОК, body:тело, photos:[],
                      created_at:new Date().toISOString(), status:'отправляю…', author:Я.id};
  МЫСЛИ = [мгновенная].concat(МЫСЛИ);
  нарисовать();
  const лента = $('лента');
  лента.scrollTop = лента.scrollHeight;
  requestAnimationFrame(() => { лента.scrollTop = лента.scrollHeight; });

  try{
    if(!navigator.onLine) throw new Error('нет сети');
    const пути = [];
    for(const ф of фото) пути.push(await залить(ф.файл));
    const {error} = await sb.from('gili_notes').insert({author: Я.id, flow: ПОТОК, body: тело, photos: пути});
    if(error) throw error;
    await загрузить();
  }catch(e){
    МЫСЛИ = МЫСЛИ.filter(м => м.id !== мгновенная.id);
    const в_буквах = [];
    for(const ф of фото) в_буквах.push({буква: await вбукву(ф.файл)});
    в_очередь({когда: Date.now(), поток: ПОТОК, текст: тело, фото: в_буквах});
  }
  фото.forEach(ф => URL.revokeObjectURL(ф.ссылка));
}

/* ── поиск ────────────────────────────────────────────────────────────────── */
let таймер_поиска;
$('поиск').addEventListener('input', e => {
  clearTimeout(таймер_поиска);
  const v = e.target.value.trim().toLowerCase();
  таймер_поиска = setTimeout(() => { ИСКОМОЕ = v; нарисовать(); }, 90);
});

/* ── клавиатура ───────────────────────────────────────────────────────────── */
if(window.visualViewport){
  const вид = window.visualViewport;
  const подстроиться = () => {
    const скрыто = Math.max(0, window.innerHeight - вид.height - вид.offsetTop);
    document.body.style.height = `calc(100% - ${скрыто}px)`;
    if(document.activeElement === поле) $('лента').scrollTop = $('лента').scrollHeight;
  };
  вид.addEventListener('resize', подстроиться);
  вид.addEventListener('scroll', подстроиться);
}

/* ── пришли по ссылке из уведомления ─────────────────────────────────────── */
function по_ссылке(){
  // Имя параметра ЛАТИНИЦЕЙ. Первый заход был «#найти=…» — и браузер закодировал само
  // слово в проценты (%D0%BD%D0%B0%D0%B9…), после чего поиск по «найти» не совпадал
  // никогда. Тот же класс граблей, что кириллица в переменных bash: в адресах живёт ascii.
  const хэш = decodeURIComponent(location.hash || '');
  const m = хэш.match(/[#&](?:find|найти)=([^&]*)/);
  if(!m) return false;
  const что = m[1].trim();
  if(!что) return false;
  $('поиск').value = что;
  ИСКОМОЕ = что.toLowerCase();
  нарисовать();
  return true;
}
window.addEventListener('hashchange', () => { if(Я) по_ссылке(); });

/* ── старт ────────────────────────────────────────────────────────────────── */
function оживить_сцену(){
  if(!matchMedia('(max-width:720px)').matches || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const c = $('сцена'), ctx = c.getContext('2d', {alpha:true});
  let w=0,h=0,dpr=1,кадр=0,жив=true;
  const размер = () => {
    dpr = Math.min(devicePixelRatio || 1, 1.6); w = innerWidth; h = innerHeight;
    c.width = Math.round(w*dpr); c.height = Math.round(h*dpr); c.style.width=w+'px'; c.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  };
  const рисовать = t => {
    if(!жив) return;
    ctx.clearRect(0,0,w,h);
    const верх = h*.62, шаг = Math.max(13,h*.019);
    ctx.lineWidth=.7;
    for(let i=0;i<12;i++){
      const y=верх+i*шаг, a=.045+i*.006;
      ctx.beginPath();
      for(let x=-12;x<=w+12;x+=9){
        const yy=y+Math.sin(x*.021+t*.0012+i*.72)*2.3+Math.sin(x*.008-t*.0007+i)*1.4;
        x===-12?ctx.moveTo(x,yy):ctx.lineTo(x,yy);
      }
      ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.stroke();
    }
    кадр=requestAnimationFrame(рисовать);
  };
  addEventListener('resize', размер,{passive:true});
  document.addEventListener('visibilitychange',()=>{
    жив=!document.hidden;
    if(жив){cancelAnimationFrame(кадр);кадр=requestAnimationFrame(рисовать)}
  });
  размер(); кадр=requestAnimationFrame(рисовать);

  const л=$('лента'); let ждём=false;
  л.addEventListener('scroll',()=>{
    if(ждём) return; ждём=true;
    requestAnimationFrame(()=>{
      ждём=false; const середина=л.getBoundingClientRect().top+l.clientHeight/2;
      л.querySelectorAll('.мысль').forEach(м=>{
        const r=м.getBoundingClientRect(), d=Math.max(-1,Math.min(1,(r.top+r.height/2-середина)/л.clientHeight));
        м.style.setProperty('--gravity',(d*3.5).toFixed(2)+'px');
      });
    });
  },{passive:true});
}
function обновить_связь(){
  const связь = $('связь'); if(!связь) return;
  const есть = navigator.onLine;
  связь.classList.toggle('нет', !есть);
  связь.querySelector('span').textContent = есть ? 'на связи' : 'без сети';
}
addEventListener('online', обновить_связь);
addEventListener('offline', обновить_связь);
обновить_связь();

let таймер_зова=0;
function позвать_органы(){
  if(innerWidth>720 || document.hidden || поле.value.trim() || ФОТО.length) return;
  const б = Math.random()>.48 ? $('микрофон') : $('камера');
  б.classList.remove('манит'); requestAnimationFrame(()=>б.classList.add('манит'));
  setTimeout(()=>б.classList.remove('манит'),2600);
}
setTimeout(позвать_органы,1800);
таймер_зова=setInterval(позвать_органы,14000);
оживить_сцену();

if(кто_в_памяти()) поднять();        // помним человека — открываемся сразу, проверка внутри
else sb.auth.getSession().then(({data:{session}}) => session ? поднять() : показать('вход'))
  .catch(() => показать('вход'));
обновить_состояние();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  /* Служка теперь отдаёт из кэша сразу, а сеть догоняет в фоне — значит первый экран может
     оказаться вчерашним. Как только новая версия установилась, страница перечитывает себя
     сама: ровно та боль 25.08 «не обновляется интерфейс, надо перезапускать приложение». */
  let перезагружаюсь = false;
  navigator.serviceWorker.addEventListener('message', e => {
    if(e.data === 'новая-версия' && !перезагружаюсь){ перезагружаюсь = true; location.reload(); }
  });
}
