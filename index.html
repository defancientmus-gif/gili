<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гилфойл</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Гилфойл">
<meta name="theme-color" content="#dfe7ea">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:        oklch(0.89 0.018 210);
    --fog:       oklch(0.91 0.011 212);
    --fg:        oklch(0.13 0.015 230);
    --fg-m:      oklch(0.26 0.010 230);
    --fg-l:      oklch(0.48 0.008 230);
    --glass-bg:  oklch(0.97 0.004 225 / 0.52);
    --glass-bd:  oklch(1 0 0 / 0.55);
    --accent:    oklch(0.52 0.11 235);
    --r: 16px;
    --sys: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; font-family:var(--sys); color:var(--fg); background:
      radial-gradient(60% 50% at 80% 0%, var(--warm, oklch(0.94 0.015 200)) 0%, transparent 60%),
      linear-gradient(180deg, var(--fog), var(--bg));
    display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ── вход ── */
  #вход{margin:auto; width:min(360px, 90vw); text-align:center}
  #вход h1{font-size:22px; font-weight:650; margin:0 0 6px}
  #вход p{color:var(--fg-l); font-size:14px; line-height:1.5; margin:0 0 22px}
  #вход input, #вход button{
    width:100%; font:inherit; font-size:16px; padding:13px 15px; margin-bottom:9px;
    border-radius:13px; border:1px solid var(--glass-bd); background:var(--glass-bg);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  }
  #вход input:focus{outline:none; border-color:var(--accent)}
  #вход button{background:var(--accent); color:#fff; border:none; font-weight:600}
  #вход button:disabled{opacity:.5}
  #сказ{font-size:13px; color:var(--fg-l); min-height:18px; margin-top:4px}

  /* ── шапка ── */
  header{display:flex; gap:6px; padding:10px 12px 6px; align-items:center}
  header .кто{font-size:13px; color:var(--fg-l); margin-left:auto; padding:0 4px}
  .потоки{display:flex; gap:5px; flex:1}
  .потоки button{
    flex:1; font:inherit; font-size:13.5px; padding:8px 4px; border-radius:11px;
    border:1px solid transparent; background:transparent; color:var(--fg-l);
  }
  .потоки button.on{background:var(--glass-bg); border-color:var(--glass-bd); color:var(--fg); font-weight:600}

  /* ── поиск: ради него всё и затевалось ── */
  .искать{padding:0 12px 8px}
  .искать input{
    width:100%; font:inherit; font-size:15px; padding:9px 13px; border-radius:12px;
    border:1px solid var(--glass-bd); background:var(--glass-bg); color:var(--fg);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  }
  .искать input:focus{outline:none; border-color:var(--accent)}

  /* ── лента ── */
  main{flex:1; overflow-y:auto; padding:0 12px 8px; -webkit-overflow-scrolling:touch}
  .день{text-align:center; font-size:12px; color:var(--fg-l); margin:14px 0 8px}
  .мысль{
    background:var(--glass-bg); border:1px solid var(--glass-bd); border-radius:var(--r);
    padding:11px 13px; margin-bottom:8px; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    font-size:15.5px; line-height:1.45; white-space:pre-wrap; word-break:break-word;
  }
  .мысль.ждёт{opacity:.72}
  .мысль .низ{display:flex; gap:7px; align-items:center; margin-top:7px; font-size:12px; color:var(--fg-l)}
  .мысль .низ b{font-weight:600; color:var(--accent)}
  .мысль.ждёт .низ b{color:oklch(0.6 0.09 75)}
  .мысль .кто{margin-left:auto}
  .мысль img{max-width:100%; border-radius:10px; margin-top:8px; display:block}
  .пусто{text-align:center; color:var(--fg-l); font-size:14px; padding:40px 0}
  mark{background:oklch(0.85 0.13 95 / .6); color:inherit; border-radius:3px}

  /* ── написать ── */
  footer{padding:6px 12px calc(10px + env(safe-area-inset-bottom))}
  .строка{display:flex; gap:7px; align-items:flex-end}
  textarea{
    flex:1; font:inherit; font-size:16px; line-height:1.4; resize:none; max-height:150px;
    padding:11px 14px; border-radius:15px; border:1px solid var(--glass-bd);
    background:var(--glass-bg); color:var(--fg); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  }
  textarea:focus{outline:none; border-color:var(--accent)}
  .кнопка{
    width:44px; height:44px; flex:none; border-radius:50%; border:1px solid var(--glass-bd);
    background:var(--glass-bg); color:var(--fg-m); display:grid; place-items:center;
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  }
  .кнопка svg{width:21px; height:21px}
  .фишки{display:flex; gap:6px; padding:0 0 7px; flex-wrap:wrap}
  .фишка{position:relative; width:52px; height:52px; border-radius:10px; overflow:hidden}
  .фишка img{width:100%; height:100%; object-fit:cover}
  .фишка button{
    position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%;
    border:none; background:oklch(0.2 0 0 / .6); color:#fff; font-size:12px; line-height:1; padding:0;
  }
  .состояние{font-size:12px; color:var(--fg-l); text-align:center; padding:3px 0 0; min-height:16px}

  @media (prefers-color-scheme: dark){
    :root{
      --bg:oklch(0.19 0.012 235); --fog:oklch(0.23 0.010 235); --fg:oklch(0.95 0.005 230);
      --fg-m:oklch(0.82 0.006 230); --fg-l:oklch(0.62 0.008 230);
      --glass-bg:oklch(0.28 0.012 235 / 0.55); --glass-bd:oklch(1 0 0 / 0.10);
      --accent:oklch(0.72 0.10 232); --warm:oklch(0.24 0.014 250);
    }
  }
</style>
</head>
<body>

<div id="вход">
  <h1>Гилфойл</h1>
  <p>Мысли, которые дом разберёт сам.<br>Вход тот же, что в «Разберёмся».</p>
  <input id="почта" type="email" inputmode="email" autocomplete="username" placeholder="почта">
  <input id="пароль" type="password" autocomplete="current-password" placeholder="пароль">
  <button id="войти">Войти</button>
  <div id="сказ"></div>
</div>

<div id="приложение" hidden style="display:contents">
  <header>
    <div class="потоки" id="потоки"></div>
    <span class="кто" id="кто"></span>
  </header>
  <div class="искать"><input id="поиск" placeholder="искать во всех мыслях…" autocomplete="off"></div>
  <main id="лента"></main>
  <footer>
    <div class="фишки" id="фишки"></div>
    <div class="строка">
      <textarea id="поле" rows="1" placeholder="…"></textarea>
      <button class="кнопка" onclick="document.getElementById('файл').click()" title="фото">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
          <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2L8 5h8l1.5 2h2A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/>
          <circle cx="12" cy="12.5" r="3.2"/></svg>
      </button>
      <input type="file" id="файл" accept="image/*" multiple hidden>
    </div>
    <div class="состояние" id="состояние"></div>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   ГИЛФОЙЛ В ОБЛАКЕ

   Женя 10.08: «Я думал может просто загнать на облачный сервер… по аналогу
   Разберёмся сделать».

   Он прав, и это лучше прежнего. Локальный Гилфойл работал только рядом с маком:
   одна Wi-Fi, сертификат, QR — три условия там, где нужно ноль. Здесь условий нет:
   открыл ссылку и пишешь, хоть из машины, хоть из Ялты.

   Что важно понимать про роли. Облако — НЕ мозг, а почтовый ящик. Мысль падает
   сюда, дом её забирает к себе и разбирает по органам, а обратно пишет, что с ней
   стало («→ Космос Сервис»). Так дом остаётся источником правды и продолжает
   работать, даже если облако однажды окажется недоступным.

   Три вещи, ради которых это затевалось:
   · писать откуда угодно — телеграм это умел, но там мысли не ищутся;
   · искать по всем мыслям сразу — здесь строка поиска бьёт по всему архиву;
   · семья в одном месте — Саша заходит своим аккаунтом и пишет в общие потоки.

   Приватность: в этой базе живут ещё пять чужих аккаунтов «Разберёмся», поэтому
   доступ не «всем вошедшим», а строго по списку семьи (таблица gili_family).
   Проверено: без входа не читается и не пишется ничего.
   ═══════════════════════════════════════════════════════════════════════════ */

const URL_БАЗЫ = 'https://izvwgyudjbxlixzrgpuv.supabase.co';
const КЛЮЧ = 'sb_publishable_YtwehFnevo4R3UpmOnTTXQ_j4PQY21D';   // публичный по устройству, защита — в правилах базы
const sb = supabase.createClient(URL_БАЗЫ, КЛЮЧ, {auth:{persistSession:true, autoRefreshToken:true}});

const ПОТОКИ = [
  {код:'работа', имя:'Работа'},
  {код:'кодинг', имя:'Кодинг'},
  {код:'дом',    имя:'Дом'},
  {код:'семья',  имя:'Семья'},
];
let ПОТОК = 'работа', Я = null, МЫСЛИ = [], ИСКОМОЕ = '', ФОТО = [];

const $ = id => document.getElementById(id);
const экран = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── вход ─────────────────────────────────────────────────────────────────── */
$('войти').onclick = async () => {
  const почта = $('почта').value.trim(), пароль = $('пароль').value;
  if(!почта || !пароль){ $('сказ').textContent = 'нужны почта и пароль'; return; }
  $('войти').disabled = true; $('сказ').textContent = 'вхожу…';
  const {error} = await sb.auth.signInWithPassword({email: почта, password: пароль});
  $('войти').disabled = false;
  if(error){ $('сказ').textContent = разобрать_ошибку(error); return; }
  await поднять();
};
$('пароль').addEventListener('keydown', e => { if(e.key === 'Enter') $('войти').click(); });

function разобрать_ошибку(e){
  const t = (e.message || '').toLowerCase();
  if(t.includes('invalid login')) return 'почта или пароль не подходят';
  if(t.includes('network') || t.includes('fetch')) return 'нет связи — попробуй позже';
  return e.message || 'не вышло';
}

async function поднять(){
  const {data:{user}} = await sb.auth.getUser();
  if(!user) return;
  const {data: семья} = await sb.from('gili_family').select('user_id,name').eq('user_id', user.id).maybeSingle();
  if(!семья){
    $('сказ').textContent = 'этот аккаунт не в семье — скажи Жене, он добавит';
    await sb.auth.signOut(); return;
  }
  Я = {id: user.id, имя: семья.name};
  $('вход').hidden = true; $('вход').style.display = 'none';
  $('приложение').hidden = false;
  $('кто').textContent = Я.имя;
  нарисовать_потоки();
  await загрузить();
  подписаться();
  везти_очередь();
}

/* ── потоки ───────────────────────────────────────────────────────────────── */
function нарисовать_потоки(){
  $('потоки').innerHTML = ПОТОКИ.map(п =>
    `<button data-код="${п.код}" class="${п.код === ПОТОК ? 'on' : ''}">${п.имя}</button>`).join('');
  $('потоки').querySelectorAll('button').forEach(б => б.onclick = () => {
    ПОТОК = б.dataset.код; нарисовать_потоки(); нарисовать();
  });
}

/* ── лента ────────────────────────────────────────────────────────────────── */
async function загрузить(){
  const {data, error} = await sb.from('gili_notes')
    .select('id,flow,body,photos,created_at,status,author')
    .order('created_at', {ascending:false}).limit(300);
  if(!error && data) МЫСЛИ = data;
  нарисовать();
}

function подсветить(текст){
  if(!ИСКОМОЕ) return экран(текст);
  const i = текст.toLowerCase().indexOf(ИСКОМОЕ);
  if(i < 0) return экран(текст);
  return экран(текст.slice(0,i)) + '<mark>' + экран(текст.slice(i, i+ИСКОМОЕ.length)) + '</mark>' + экран(текст.slice(i+ИСКОМОЕ.length));
}

function день(iso){
  const d = new Date(iso), сегодня = new Date();
  const к = x => x.toISOString().slice(0,10);
  if(к(d) === к(сегодня)) return 'сегодня';
  const вчера = new Date(сегодня); вчера.setDate(вчера.getDate() - 1);
  if(к(d) === к(вчера)) return 'вчера';
  return d.toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
}
const часы = iso => new Date(iso).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});

function нарисовать(){
  // ждущие отправки — сверху ленты, они самые свежие
  const свои = очередь().filter(з => ИСКОМОЕ || з.поток === ПОТОК).map(з => ({
    id:'ж'+з.когда, flow:з.поток, body:з.текст + ((з.фото||[]).length ? `\n📷 ${з.фото.length} фото в телефоне` : ''),
    created_at:new Date(з.когда).toISOString(), ждёт:true, автор_имя:Я?.имя
  }));
  let список = МЫСЛИ.filter(м => ИСКОМОЕ ? true : м.flow === ПОТОК);
  if(ИСКОМОЕ) список = список.filter(м => (м.body||'').toLowerCase().includes(ИСКОМОЕ));
  список = свои.concat(список);

  if(!список.length){
    $('лента').innerHTML = `<div class="пусто">${ИСКОМОЕ ? 'ничего не нашлось' : 'пусто'}</div>`;
    return;
  }
  let html = '', прошлый = '';
  for(const м of список){
    const д = день(м.created_at);
    if(д !== прошлый){ html += `<div class="день">${д}</div>`; прошлый = д; }
    const фото = (м.photos || []).map(п => `<img loading="lazy" data-путь="${экран(п)}" alt="">`).join('');
    const чей = м.author && Я && м.author !== Я.id ? 'Саша' : '';
    html += `<div class="мысль ${м.ждёт ? 'ждёт' : ''}">${подсветить(м.body || '')}${фото}` +
            `<div class="низ"><span>${часы(м.created_at)}</span>` +
            `<b>${м.ждёт ? '⏳ в телефоне' : (м.status || '✓ записано')}</b>` +
            (ИСКОМОЕ ? `<span>${экран(ПОТОКИ.find(п=>п.код===м.flow)?.имя || м.flow)}</span>` : '') +
            (чей ? `<span class="кто">${чей}</span>` : '') + `</div></div>`;
  }
  $('лента').innerHTML = html;
  показать_фото();
}

/* Фото лежат в закрытом хранилище: прямых ссылок нет, для каждого просим временную. */
async function показать_фото(){
  for(const img of $('лента').querySelectorAll('img[data-путь]')){
    const путь = img.dataset.путь; delete img.dataset.путь;
    const {data} = await sb.storage.from('gili').createSignedUrl(путь, 3600);
    if(data?.signedUrl) img.src = data.signedUrl;
  }
}

/* Мысль от Саши появляется у Жени сама, без обновления страницы. */
function подписаться(){
  sb.channel('гили').on('postgres_changes',
    {event:'*', schema:'public', table:'gili_notes'}, загрузить).subscribe();
}

/* ── очередь: без сети мысль не теряется ──────────────────────────────────── */
const КЛЮЧ_ОЧЕРЕДИ = 'гили_очередь';
const очередь = () => { try{ return JSON.parse(localStorage.getItem(КЛЮЧ_ОЧЕРЕДИ) || '[]'); }catch{ return []; } };
function в_очередь(з){ const q = очередь(); q.push(з); localStorage.setItem(КЛЮЧ_ОЧЕРЕДИ, JSON.stringify(q)); нарисовать(); }
function из_очереди(когда){ localStorage.setItem(КЛЮЧ_ОЧЕРЕДИ, JSON.stringify(очередь().filter(з => з.когда !== когда))); }

let ВЕЗУ = false;
async function везти_очередь(){
  if(ВЕЗУ || !Я || !navigator.onLine) return;
  const q = очередь(); if(!q.length) return;
  ВЕЗУ = true;
  for(const з of q){
    try{
      const пути = [];
      for(const ф of (з.фото || [])){
        const путь = await залить(избуквы(ф.буква), ф.ext);
        пути.push(путь);
      }
      const {error} = await sb.from('gili_notes').insert({author: Я.id, flow: з.поток, body: з.текст, photos: пути});
      if(error) throw error;
      из_очереди(з.когда);
    }catch(e){ break; }        // облако молчит — остальное подождёт, порядок сохраняем
  }
  ВЕЗУ = false;
  await загрузить();
  const n = очередь().length;
  $('состояние').textContent = n ? `${n} ждёт отправки` : '';
}
window.addEventListener('online', везти_очередь);
setInterval(везти_очередь, 20000);

/* ── фото ─────────────────────────────────────────────────────────────────── */
/* Ужимаем в телефоне: снимок айфона весит 3–5 МБ, и такой не влезет ни в память
   телефона на время без сети, ни в разумный трафик. 1600 px хватает, чтобы
   прочитать ценник или бумагу. */
async function ужать(файл){
  if(!файл.type.startsWith('image/')) return null;
  const bmp = await createImageBitmap(файл).catch(() => null);
  if(!bmp) return файл;
  const край = 1600, k = Math.min(1, край / Math.max(bmp.width, bmp.height));
  if(k === 1 && файл.size < 900e3) return файл;
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.72));
  return blob && blob.size < файл.size ? new File([blob], 'фото.jpg', {type:'image/jpeg'}) : файл;
}
const вбукву = ф => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(ф); });
function избуквы(строка){
  const [шапка, тело] = строка.split(',');
  const б = atob(тело), a = new Uint8Array(б.length);
  for(let i = 0; i < б.length; i++) a[i] = б.charCodeAt(i);
  return new Blob([a], {type: (шапка.match(/:(.*?);/) || [,'image/jpeg'])[1]});
}
async function залить(blob, ext){
  const путь = `${Я.id}/${Date.now().toString(36)}-${Math.round(performance.now())}.${ext || 'jpg'}`;
  const {error} = await sb.storage.from('gili').upload(путь, blob, {contentType: blob.type || 'image/jpeg'});
  if(error) throw error;
  return путь;
}

$('файл').onchange = async e => {
  const файлы = [...(e.target.files || [])]; e.target.value = '';
  for(const ф of файлы){
    const у = await ужать(ф); if(!у) continue;
    ФОТО.push({файл: у, ссылка: URL.createObjectURL(у)});
  }
  нарисовать_фишки();
  if(!$('поле').value.trim()) отправить();     // снял и пошёл — подпись не обязательна
};
function нарисовать_фишки(){
  $('фишки').innerHTML = ФОТО.map((ф,i) =>
    `<span class="фишка"><img src="${ф.ссылка}" alt=""><button onclick="убрать_фото(${i})">×</button></span>`).join('');
}
function убрать_фото(i){ ФОТО.splice(i,1); нарисовать_фишки(); }

/* ── написать ─────────────────────────────────────────────────────────────── */
const поле = $('поле');
поле.addEventListener('input', () => { поле.style.height = 'auto'; поле.style.height = Math.min(поле.scrollHeight, 150) + 'px'; });
поле.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey && window.innerWidth >= 860){ e.preventDefault(); отправить(); }
});

async function отправить(){
  const текст = поле.value.trim();
  if(!текст && !ФОТО.length) return;
  const фото = ФОТО.slice(); ФОТО = []; нарисовать_фишки();
  поле.value = ''; поле.style.height = 'auto';
  const тело = текст || 'фото';

  try{
    if(!navigator.onLine) throw new Error('нет сети');
    const пути = [];
    for(const ф of фото) пути.push(await залить(ф.файл, 'jpg'));
    const {error} = await sb.from('gili_notes').insert({author: Я.id, flow: ПОТОК, body: тело, photos: пути});
    if(error) throw error;
    await загрузить();
    $('состояние').textContent = '';
  }catch(e){
    // облака нет — мысль ложится в память телефона и уедет сама
    const в_буквах = [];
    for(const ф of фото) в_буквах.push({буква: await вбукву(ф.файл), ext:'jpg'});
    в_очередь({когда: Date.now(), поток: ПОТОК, текст: тело, фото: в_буквах});
    $('состояние').textContent = `${очередь().length} ждёт отправки`;
  }
}

/* ── поиск ────────────────────────────────────────────────────────────────── */
$('поиск').addEventListener('input', e => { ИСКОМОЕ = e.target.value.trim().toLowerCase(); нарисовать(); });

/* ── старт ────────────────────────────────────────────────────────────────── */
sb.auth.getSession().then(({data:{session}}) => { if(session) поднять(); });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
