<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>Город</title>
<style>
:root{color-scheme:light;--ground:#9fc7a6;--ink:#10303A;--soft:#4C6770;--coin:#E8962F;--coin-ink:#8A4B08;
  --glass:linear-gradient(158deg,rgba(255,255,255,.84),rgba(238,246,248,.74));--glass-hi:rgba(255,255,255,.72);
  --shadow:inset 0 1px 0 rgba(255,255,255,.94),0 4px 13px -3px rgba(30,70,90,.16);
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ground);color:var(--ink);font:14px/1.45 var(--sys);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.glass{background:var(--glass);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);border:1px solid var(--glass-hi);box-shadow:var(--shadow)}

/* мир: картинка 16:9, на телефоне листается вбок, на широком экране срезается небо */
#даль{position:fixed;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior:contain;cursor:grab}
#даль::-webkit-scrollbar{display:none}
#даль.тяну{cursor:grabbing}
#мир{position:relative;background:url(city2-map-s.jpg) center/100% 100% no-repeat}
#мир>img.фон{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}

/* здание стоит серединой низа на своём участке карты; спрайт опущен на 8% своей высоты (так сверял Дом) */
.здание{position:absolute;padding:0;border:0;background:none;cursor:pointer;transform:translate(-50%,-92%);touch-action:manipulation}
.здание.декор{cursor:default}
.здание img{display:block;width:100%;height:auto;pointer-events:none;user-select:none;-webkit-user-drag:none;
  transform-origin:50% 100%;filter:drop-shadow(0 5px 5px rgba(30,60,40,.2))}
.здание.стройка img{opacity:.55;filter:saturate(.35) drop-shadow(0 5px 5px rgba(30,60,40,.2))}
.здание.расцвет img{filter:drop-shadow(0 0 10px rgba(255,196,110,.75)) drop-shadow(0 5px 5px rgba(30,60,40,.2))}
.здание.запущен img{opacity:.8;filter:grayscale(.75) brightness(.95) drop-shadow(0 5px 5px rgba(30,60,40,.2))}
.здание:not(.декор):active img{transform:scale(.97)}
/* подпись под зданием: чей это дом, чтобы не угадывать по картинке */
.имя{position:absolute;left:50%;top:calc(100% - 4px);transform:translateX(-50%);white-space:nowrap;pointer-events:none;
  padding:2px 9px 3px;border-radius:12px;font:600 11.5px/1.3 var(--sys);color:var(--ink);
  background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.9);box-shadow:0 2px 6px -2px rgba(30,60,40,.3)}
/* места без здания на карте: руины Flighter, ворота Щита; органы без участка — плашкой на пляже */
.зона{position:absolute;transform:translate(-50%,-50%);border:0;padding:0;background:none;cursor:pointer;border-radius:50%;touch-action:manipulation}
.зона .имя{top:50%;transform:translate(-50%,-50%)}
.зона .значок{top:calc(50% - 14px)}
.плашка{position:absolute;transform:translate(-50%,-100%);border-radius:16px;padding:8px 12px;cursor:pointer;font:600 12.5px/1.2 var(--sys);white-space:nowrap}
.плашка .значок{top:-6px}

.значок{position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%);min-width:34px;height:34px;padding:0 9px;box-sizing:border-box;z-index:2;
  border-radius:17px;background:var(--coin);color:#fff;font:700 16px/34px var(--sys);border:2px solid #fff;text-align:center;font-variant-numeric:tabular-nums;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 3px 8px -2px rgba(120,60,0,.35);pointer-events:none}
.значок.зовёт{animation:зовёт 2.4s ease-in-out infinite}
.значок.тык{animation:тык .45s ease-out}
@keyframes зовёт{0%,100%{transform:translate(-50%,-100%) scale(1)}50%{transform:translate(-50%,-100%) scale(1.12)}}
@keyframes тык{0%{transform:translate(-50%,-100%) scale(1.35)}100%{transform:translate(-50%,-100%) scale(1)}}

.почта{position:absolute;transform:translate(-50%,-100%);width:52px;height:52px;border-radius:18px;display:grid;place-items:center;cursor:pointer;padding:0}
.почта svg{width:26px;height:26px}

/* верх: счёт дня и выход */
.верх{position:fixed;left:12px;right:12px;top:calc(10px + var(--safe-t));display:flex;gap:10px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
.верх>*{pointer-events:auto}
.счёт{border-radius:20px;padding:9px 15px 10px;font-variant-numeric:tabular-nums}
.счёт b{font:650 17px/1.2 var(--sys);display:block}
.счёт span{color:var(--soft);font-size:12.5px}
.счёт.тык{animation:тык2 .45s ease-out}
@keyframes тык2{0%{transform:scale(1.06)}100%{transform:scale(1)}}
.выход{width:44px;height:44px;border-radius:22px;font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.подсказка{position:fixed;left:50%;bottom:calc(18px + var(--safe-b));transform:translateX(-50%);border-radius:18px;padding:10px 16px;font-size:13.5px;
  color:var(--ink);white-space:nowrap;z-index:4;transition:opacity .3s}
.подсказка.нет{opacity:0;pointer-events:none}

/* лист квестов: снизу на телефоне, справа на широком */
#тень{position:fixed;inset:0;background:rgba(16,48,58,.18);opacity:0;pointer-events:none;transition:opacity .22s;z-index:6}
#тень.вид{opacity:1;pointer-events:auto}
#лист{position:fixed;left:0;right:0;bottom:0;max-height:min(78vh,720px);border-radius:28px 28px 0 0;z-index:7;display:flex;flex-direction:column;
  transform:translateY(104%);opacity:.6;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s;padding-bottom:var(--safe-b);
  background:linear-gradient(158deg,rgba(255,255,255,.97),rgba(240,247,249,.95));backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);
  border:1px solid var(--glass-hi);box-shadow:var(--shadow)}
#лист.вид{transform:none;opacity:1}
@media (min-width:760px){
  #лист{left:auto;top:calc(12px + var(--safe-t));bottom:12px;right:12px;width:420px;max-height:none;border-radius:28px;transform:translateX(calc(100% + 24px))}
}
.шапка{display:flex;gap:10px;align-items:flex-start;padding:16px 14px 10px 20px}
.шапка h2{margin:0;font:650 20px/1.2 var(--sys)}
.шапка p{margin:3px 0 0;color:var(--soft);font-size:13px}
.шапка .выход{margin-left:auto;flex:none;background:rgba(16,48,58,.06);border:0;box-shadow:none}
.список{overflow-y:auto;overscroll-behavior:contain;padding:4px 14px 18px;display:flex;flex-direction:column;gap:10px}
.пусто{padding:26px 8px 34px;text-align:center;color:var(--soft)}
.пусто b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.квест{border-radius:20px;padding:14px 14px 12px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.8);
  box-shadow:0 2px 8px -3px rgba(30,70,90,.14);transition:transform .38s ease-in,opacity .38s ease-in}
.квест.ушёл{transform:translateX(40px) scale(.94);opacity:0}
.квест .текст{margin:0;font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.квест .почему{margin:6px 0 0;color:var(--soft);font-size:13px;overflow-wrap:anywhere}
.квест .снимки{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}
.квест .снимки img{display:block;width:100%;height:auto;border-radius:14px;
  background:rgba(255,255,255,.5);box-shadow:inset 0 0 0 1px rgba(16,48,58,.1)}
.квест .мета{margin:6px 0 0;color:var(--soft);font-size:12.5px;font-variant-numeric:tabular-nums}
.квест .мета .срок{color:var(--coin-ink);font-weight:600}
.кнопки{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.кнопки button,.кнопки a{min-height:44px;padding:0 16px;border-radius:14px;border:1px solid rgba(16,48,58,.14);background:rgba(255,255,255,.9);
  cursor:pointer;font-weight:550;font-size:14px;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;box-sizing:border-box}
.кнопки button:active{transform:scale(.97)}
.кнопки button:disabled{opacity:.45;cursor:default}
.кнопки .тихо{background:none;border-color:transparent;color:var(--soft)}
.ошибка{margin:8px 0 0;font-size:13px;color:#9A3412}
.почему.свёрнуто{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ещё{background:none;border:0;padding:4px 0;color:var(--soft);font-size:12.5px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

.монета{position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--coin);z-index:9;pointer-events:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 6px rgba(120,60,0,.35);transition:transform .7s cubic-bezier(.3,.1,.3,1),opacity .7s}

.туман{position:fixed;inset:0;display:grid;place-items:center;z-index:3;pointer-events:none}
.туман[hidden]{display:none}
.туман div{border-radius:20px;padding:14px 18px;max-width:300px;text-align:center}

@media (prefers-reduced-motion:reduce){
  .значок.зовёт,.значок.тык,.счёт.тык{animation:none}
  #лист,#тень,.квест,.монета,.подсказка{transition:none}
}
</style></head>
<body>
<div id="даль"><div id="мир"><img class="фон" src="city2-map.webp" alt=""></div></div>

<div class="верх">
  <div class="счёт glass" id="счёт" aria-live="polite"><b id="сегодня">Сегодня разобрано 0</b><span id="серия">начни серию</span></div>
  <button class="выход glass" id="закрыть" aria-label="Закрыть город">×</button>
</div>
<div class="подсказка glass" id="подсказка">Нажми на дом — там задачи</div>
<div class="туман" id="туман" hidden><div class="glass" id="туман-текст">Город собирается…</div></div>

<div id="тень"></div>
<section id="лист" role="dialog" aria-modal="true" aria-labelledby="лист-имя" hidden>
  <div class="шапка"><div><h2 id="лист-имя" tabindex="-1"></h2><p id="лист-под"></p></div>
    <button class="выход" id="лист-закрыть" aria-label="Закрыть лист">×</button></div>
  <div class="список" id="список"></div>
</section>

<script>
/* ГОРОД ГИЛИ (28.09) вместо сада. Женя 00:48: «прям игрой, только где я буду задачи разбирать… развивать
   свой город, сервис». Данные — одна дверь Дома (scripts/город.py) через окно: здания — органы, квесты —
   вопросы кодеров, платежи и дела Кассы; почта — мысли без адреса. Нажал — настоящее закрытие у Дома,
   очки только из них. Карта и здания — арт Дома (город v2), стадии рисуются кодом.
   Страница одна на мак и телефон (окно/сад.html → sad.html при выкладке); разница только в СВЯЗИ. */
const СВЯЗЬ = (() => { try { return parent !== window && parent.САД_СВЯЗЬ; } catch (e) { return null; } })() || {
  грузить: async () => (await fetch('/api/gorod', {cache:'no-store'})).json(),
  сделать: async тело => (await fetch('/api/gorod/do', {method:'POST', headers:{'Content-Type':'application/json'},
                                   body: JSON.stringify(тело)})).json(),
};
const УМЕЕТ = СВЯЗЬ.умеет || ['вопрос', 'дело', 'мысль'];
const $ = id => document.getElementById(id);
const тихо = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]));
const мн = (n, a, b, c) => { const k = n % 10, h = n % 100; return k === 1 && h !== 11 ? a : k >= 2 && k <= 4 && (h < 12 || h > 14) ? b : c; };
const руб = n => Math.round(n).toLocaleString('ru-RU').replace(/\s/g, ' ') + ' ₽';

/* Город v2 (Дом, log/польза/город2, 28.09): карта с районами — холм знаний, площадь, переулок мастерских,
   торговая улица к пристани. x, y — середина низа участка в долях кадра, w — ширина участка; к — высота спрайта
   к его ширине (держим место заранее, чтобы город не прыгал, пока грузятся картинки). */
const РАСКЛАДКА = {
  'Школа':        {x:.1667, y:.2083, w:.0885, к:1.002, арт:'shkola'},
  'Разберемся':   {x:.2891, y:.1991, w:.0885, к:.964,  арт:'razberemsya'},
  'Домик':        {x:.4,    y:.3565, w:.0781, к:1.036, арт:'domik'},
  'Касса':        {x:.3203, y:.6713, w:.0938, к:.693,  арт:'kassa'},
  'Гили':         {x:.4792, y:.6667, w:.0938, к:.916,  арт:'gili'},
  'Склейка':      {x:.0833, y:.463,  w:.0781, к:.841,  арт:'skleyka'},
  'Дизайнер':     {x:.1573, y:.5,    w:.0755, к:.977,  арт:'dizainer'},
  '3D Принтер':   {x:.2302, y:.537,  w:.0755, к:.882,  арт:'printer3d'},
  'Космос Сервис':{x:.5156, y:.4833, w:.0625, к:1.039, арт:'kosmos'},
  'Сервисный':    {x:.5901, y:.4833, w:.0599, к:.65,   арт:'servisnyi'},
  'БУ.шка':       {x:.6625, y:.4852, w:.0599, к:.85,   арт:'bushka'},
  'Бухгалтер':    {x:.7349, y:.488,  w:.0599, к:.925,  арт:'buhgalter'},
  'Юр.маркет':    {x:.8078, y:.4926, w:.0599, к:.809,  арт:'yurmarket'},
  'Закупатор':    {x:.8812, y:.5019, w:.0651, к:.889,  арт:'zakupator'},
};
/* На карте нарисованы, но без спрайта: руины — Flighter, ворота — Щит. r — радиус кнопки в долях ширины. */
const ЗОНЫ = {'Flighter':{x:.74, y:.14, r:.12}, 'Щит':{x:.4, y:.84, r:.07}};
/* Орган, которому Дом ещё не отвёл участок, встаёт плашкой на пляже — его задачи не должны пропасть. */
const ЗАПАС = [[.64, .66], [.7, .615], [.585, .72], [.75, .57]];
const ПОЧТА_МЕСТО = [.525, .655];
const ЦЕНТР_X = .42;                     // площадь: сюда смотрит первый кадр на узком экране
const ЗАПУЩЕН_ДНЕЙ = 14;

let ГОРОД = null, ОТКРЫТ = null, ЗАНЯТО = false;
let W = 0, H = 0;

// ---------- счёт: только настоящие закрытия, по дням ----------
const день = (d = new Date()) => d.toLocaleDateString('sv-SE');
let счёт = {дни:{}};
try { const s = JSON.parse(localStorage.getItem('gili-gorod-v1') || 'null'); if (s && s.дни) счёт = s; } catch (e) {}
function сохранить(){ try { localStorage.setItem('gili-gorod-v1', JSON.stringify(счёт)); } catch (e) {} }
function серия(){
  let n = 0, d = new Date();
  if (!счёт.дни[день(d)]) d.setDate(d.getDate() - 1);        // сегодня ещё не начал — серия вчерашняя живёт
  while (счёт.дни[день(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
let СЧЁТ_ДОМА = null;          // {сегодня, подряд} из журнала Дома: одно число на мак и телефон
function счёт_показать(тык){
  const n = СЧЁТ_ДОМА ? СЧЁТ_ДОМА.сегодня : счёт.дни[день()] || 0, с = СЧЁТ_ДОМА ? СЧЁТ_ДОМА.подряд : серия();
  $('сегодня').textContent = `Сегодня разобрано ${n}`;
  $('серия').textContent = с ? `${с} ${мн(с, 'день', 'дня', 'дней')} подряд` : 'начни серию';
  if (тык && !тихо) { const e = $('счёт'); e.classList.remove('тык'); void e.offsetWidth; e.classList.add('тык'); }
}

// ---------- мир ----------
function мир_размер(){
  const vw = innerWidth, vh = innerHeight;
  W = Math.max(vw, vh * 16 / 9); H = W * 9 / 16;
  const мир = $('мир');
  мир.style.width = W + 'px'; мир.style.height = H + 'px';
  мир.style.marginTop = Math.min(0, (vh - H) / 2) + 'px';      // широкий экран: срезаем поровну сверху и снизу — площадь в середине кадра
}
function стадия(з){
  if (з.касса) return 'дом';
  if ((з.ждёт_дней || 0) > ЗАПУЩЕН_ДНЕЙ) return 'запущен';
  const р = з.рост_7дн || 0;
  return р >= 30 ? 'расцвет' : р > 0 ? 'растёт' : 'стройка';
}
/* Кто где стоит: у органа свой участок, у Flighter и Щита — зона на карте, остальным — плашка на пляже. */
function места(){
  const где = {}; let i = 0;
  for (const з of ГОРОД.здания) {
    if (РАСКЛАДКА[з.орган]) где[з.орган] = {вид:'здание', ...РАСКЛАДКА[з.орган]};
    else if (ЗОНЫ[з.орган]) где[з.орган] = {вид:'зона', ...ЗОНЫ[з.орган]};
    else if (i < ЗАПАС.length) { const [x, y] = ЗАПАС[i++]; где[з.орган] = {вид:'плашка', x, y}; }
  }
  return где;
}
const живые = з => з.квесты.length;
function зовёт(з){ return з.квесты.some(к => к.красное || (к.дней || 0) > 21); }

function значок(з){ const n = живые(з); return n ? `<span class="значок${зовёт(з) ? ' зовёт' : ''}">${n}</span>` : ''; }
function нарисовать(){
  const мир = $('мир');
  мир.querySelectorAll('.здание,.зона,.плашка,.почта').forEach(e => e.remove());
  const где = места();
  for (const з of ГОРОД.здания) {
    const м = где[з.орган]; if (!м) continue;
    const ст = стадия(з), n = живые(з);
    const b = document.createElement('button');
    b.dataset.орган = з.орган;
    b.style.left = м.x * 100 + '%'; b.style.top = м.y * 100 + '%';
    b.style.zIndex = Math.round(м.y * 1000);
    b.setAttribute('aria-label', `${з.имя}: ${n ? n + ' ' + мн(n, 'задача', 'задачи', 'задач') : 'задач нет'}`);
    if (м.вид === 'здание') {
      const ш = м.w * 1.1 * W * (ст === 'растёт' ? .9 : 1);
      b.className = `здание ${ст}`;
      b.style.width = ш + 'px';
      b.innerHTML = `<img src="city2-${м.арт}.webp" alt="" width="${Math.round(ш)}" height="${Math.round(ш * м.к)}">`
                  + значок(з) + `<span class="имя">${esc(з.имя)}</span>`;
    } else if (м.вид === 'зона') {
      b.className = 'зона';
      b.style.width = b.style.height = м.r * 2 * W + 'px';
      b.innerHTML = значок(з) + `<span class="имя">${esc(з.имя)}</span>`;
    } else {
      b.className = 'плашка glass';
      b.innerHTML = esc(з.имя) + значок(з);
    }
    b.onclick = () => открыть(з.орган);
    мир.appendChild(b);
  }
  // Склейки в данных Дома нет, а на карте её дом стоит: рисуем как часть города, без нажатия
  for (const [орган, м] of Object.entries(РАСКЛАДКА)) if (!где[орган]) {
    const d = document.createElement('div'), ш = м.w * 1.1 * W;
    d.className = 'здание декор'; d.setAttribute('aria-hidden', 'true');
    d.style.cssText = `left:${м.x * 100}%;top:${м.y * 100}%;width:${ш}px;z-index:${Math.round(м.y * 1000)}`;
    d.innerHTML = `<img src="city2-${м.арт}.webp" alt="" width="${Math.round(ш)}" height="${Math.round(ш * м.к)}"><span class="имя">${esc(орган)}</span>`;
    мир.appendChild(d);
  }
  const п = document.createElement('button');
  п.className = 'почта glass';
  п.style.left = ПОЧТА_МЕСТО[0] * 100 + '%'; п.style.top = ПОЧТА_МЕСТО[1] * 100 + '%'; п.style.zIndex = Math.round(ПОЧТА_МЕСТО[1] * 1000) + 1;
  const np = ГОРОД.почта.length;
  п.setAttribute('aria-label', `Почта: ${np} ${мн(np, 'письмо', 'письма', 'писем')}`);
  п.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#10303A" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M4 8l8 6 8-6"/></svg>`
              + (np ? `<span class="значок">${np}</span>` : '');
  п.onclick = () => открыть('почта');
  мир.appendChild(п);
}

// ---------- лист ----------
const здание = орган => ГОРОД.здания.find(з => з.орган === орган);
function дней(n){ return n > 0 ? `ждёт ${n} ${мн(n, 'день', 'дня', 'дней')}` : 'сегодня'; }
function срок(к){
  const д = к.дней || 0;
  return д > 0 ? `<span class="срок">просрочен ${д} ${мн(д, 'день', 'дня', 'дней')}</span>` : д === 0 ? '<span class="срок">сегодня</span>'
       : `через ${-д} ${мн(-д, 'день', 'дня', 'дней')}`;
}
const ИМЯ = орган => (здание(орган) || {}).имя || орган;
const ЧАСТО = ['Космос Сервис', 'Сервисный', 'Гили', 'Школа', 'Бухгалтер'];
function нет_тут(вид){ return УМЕЕТ.includes(вид) ? '' : '<p class="мета">С телефона это пока не нажать — нажми в Гили на маке.</p>'; }

// картинки к вопросу (07.10): «Не вижу не понимаю. Картинки показывайте» — касание открывает целиком
function снимки(сп){
  return (сп || []).length ? `<div class="снимки">${сп.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="" loading="lazy"></a>`).join('')}</div>` : '';
}

function карточка(к){
  const выкл = УМЕЕТ.includes(к.вид) ? '' : ' disabled';
  const ид = esc(к.ключ);
  if (к.вид === 'вопрос') {
    const почему = к.почему ? `<p class="почему свёрнуто">${esc(к.почему)}</p>${к.почему.length > 160 ? '<button class="ещё">целиком</button>' : ''}` : '';
    return `<article class="квест" data-вид="вопрос" data-орган="${esc(к.орган)}" data-ключ="${ид}">
      <p class="текст">${esc(к.вопрос || к.текст)}</p>${почему}${снимки(к.снимки)}<p class="мета">${дней(к.дней || 0)}</p>
      <div class="кнопки">${(к.варианты || []).map(в => `<button data-вариант="${esc(в)}"${выкл}>${esc(в)}</button>`).join('')}</div>${нет_тут('вопрос')}</article>`;
  }
  if (к.вид === 'дело') return `<article class="квест" data-вид="дело" data-ключ="${ид}">
      <p class="текст">${esc(к.текст)}</p>${к.руками ? '<p class="мета">только твоими руками</p>' : ''}
      <div class="кнопки"><button data-вариант="Сделал"${выкл}>Сделал</button></div>${нет_тут('дело')}</article>`;
  if (к.вид === 'платёж') return `<article class="квест" data-вид="платёж">
      <p class="текст">${esc(к.текст)}${к.сумма ? ' · ' + руб(к.сумма) : ''}</p><p class="мета">${срок(к)}${к.срок ? ' · до ' + esc(new Date(к.срок).toLocaleDateString('ru-RU', {day:'numeric', month:'long'})) : ''}</p>
      <div class="кнопки"><a href="${esc(ГОРОД.crm || '#')}" target="_blank" rel="noopener">Открыть CRM</a></div>
      <p class="мета">Гаснет, когда отметишь «Оплачено» в CRM → Деньги.</p></article>`;
  if (к.вид === 'мысль') {
    const адреса = ГОРОД.адреса || [], часто = ЧАСТО.filter(а => адреса.includes(а)), прочие = адреса.filter(а => !часто.includes(а));
    const кн = а => `<button data-куда="${esc(а)}"${выкл}>${esc(ИМЯ(а))}</button>`;
    return `<article class="квест" data-вид="мысль" data-ключ="${ид}">
      <p class="текст">${esc(к.текст)}</p><p class="мета">${esc(к.поток || '')}${к.поток ? ' · ' : ''}${дней(к.дней || 0).replace('ждёт', 'лежит')}</p>
      <div class="кнопки">${часто.map(кн).join('')}${прочие.length ? '<button class="тихо" data-ещё>Ещё…</button>' : ''}
        <span hidden data-прочие style="display:contents">${прочие.map(кн).join('')}</span>
        <button class="тихо" data-куда="просто мысль"${выкл}>Просто мысль</button></div>${нет_тут('мысль')}</article>`;
  }
  return '';
}
function открыть(что){
  ОТКРЫТ = что;
  $('подсказка').classList.add('нет');
  try { localStorage.setItem('gili-gorod-знает', '1'); } catch (e) {}
  лист_заполнить();
  const л = $('лист');
  л.hidden = false;
  requestAnimationFrame(() => { л.classList.add('вид'); $('тень').classList.add('вид'); });
  setTimeout(() => $('лист-имя').focus({preventScroll:true}), тихо ? 0 : 60);
}
function лист_заполнить(){
  const сп = $('список');
  if (ОТКРЫТ === 'почта') {
    const n = ГОРОД.почта.length, ст = ГОРОД.старая_почта || 0;
    $('лист-имя').textContent = 'Почта';
    $('лист-под').textContent = (n ? `${n} ${мн(n, 'мысль', 'мысли', 'мыслей')} без адреса за две недели` : 'Все свежие мысли разобраны')
      + (ст ? ` · ещё ${ст} старше лежат в архиве` : '');
    сп.innerHTML = n ? ГОРОД.почта.map(карточка).join('') : '<div class="пусто"><b>Почта пустая</b>Новые мысли без адреса появятся здесь.</div>';
    return;
  }
  const з = здание(ОТКРЫТ);
  if (!з) { закрыть_лист(); return; }
  const n = з.квесты.length, ст = стадия(з);
  $('лист-имя').textContent = з.имя;
  const рост = з.касса ? (з.чем || '') : ст === 'стройка' ? 'стройка — за неделю ни одной правки'
    : `${з.рост_7дн} ${мн(з.рост_7дн, 'правка', 'правки', 'правок')} за неделю`;
  $('лист-под').textContent = [n ? `${n} ${мн(n, 'задача', 'задачи', 'задач')}` + (з.ждёт_дней ? `, старшая ждёт ${з.ждёт_дней} дн` : '') : 'Всё разобрано', рост].filter(Boolean).join(' · ');
  // платежи первыми (деньги горят), потом старшие
  const порядок = к => (к.вид === 'платёж' ? (к.красное ? 0 : 1) : 2);
  const квесты = з.квесты.slice().sort((a, b) => порядок(a) - порядок(b) || (b.дней || 0) - (a.дней || 0));
  сп.innerHTML = n ? квесты.map(карточка).join('') : `<div class="пусто"><b>Здесь всё разобрано</b>Квартал ничего от тебя не ждёт.</div>`;
}
function закрыть_лист(){
  const л = $('лист');
  л.classList.remove('вид'); $('тень').classList.remove('вид');
  const был = ОТКРЫТ; ОТКРЫТ = null;
  setTimeout(() => { if (!ОТКРЫТ) л.hidden = true; }, тихо ? 0 : 280);
  const к = был && document.querySelector(был === 'почта' ? '.почта' : `.здание[data-орган="${CSS.escape(был)}"]`);
  if (к) к.focus({preventScroll:true});
}

// ---------- нажатие ----------
$('список').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const карта = b.closest('.квест');
  if (b.classList.contains('ещё')) { карта.querySelector('.почему').classList.toggle('свёрнуто'); b.textContent = b.textContent === 'целиком' ? 'короче' : 'целиком'; return; }
  if (b.hasAttribute('data-ещё')) { карта.querySelector('[data-прочие]').hidden = false; b.remove(); return; }
  if (!карта || ЗАНЯТО) return;
  const вид = карта.dataset.вид, тело = {вид, ключ: карта.dataset.ключ};
  if (вид === 'вопрос') { тело.орган = карта.dataset.орган; тело.вариант = b.dataset.вариант; }
  else if (вид === 'мысль') тело.куда = b.dataset.куда;
  else if (вид !== 'дело') return;
  ЗАНЯТО = true;
  карта.querySelectorAll('button').forEach(x => x.disabled = true);
  карта.querySelector('.ошибка')?.remove();
  let итог;
  try { итог = await СВЯЗЬ.сделать(тело); } catch (err) { итог = {ok:false, error: СВЯЗЬ.молчит || 'Нет связи с Гили'}; }
  ЗАНЯТО = false;
  if (итог && итог.впути) { карта.insertAdjacentHTML('beforeend', '<p class="ошибка">Записал, Дом ещё не подтвердил — проверю при следующем заходе.</p>'); return; }
  if (!итог || !итог.ok) {
    карта.querySelectorAll('button').forEach(x => x.disabled = false);
    карта.insertAdjacentHTML('beforeend', `<p class="ошибка">${esc((итог && итог.error) || 'Не вышло')}</p>`);
    return;
  }
  const где = вид === 'мысль' ? document.querySelector('.почта') : document.querySelector(`.здание[data-орган="${CSS.escape(вид === 'дело' ? 'Касса' : тело.орган)}"]`);
  монета(b, где);
  счёт.дни[день()] = (счёт.дни[день()] || 0) + 1; сохранить();
  if (СЧЁТ_ДОМА) { if (!СЧЁТ_ДОМА.сегодня) СЧЁТ_ДОМА.подряд = (СЧЁТ_ДОМА.подряд || 0) + 1; СЧЁТ_ДОМА.сегодня++; }
  карта.classList.add('ушёл');
  // модель меняем сразу; свежий снимок с мака придёт следом и ничего не вернёт назад
  if (вид === 'мысль') ГОРОД.почта = ГОРОД.почта.filter(п => п.ключ !== тело.ключ);
  else for (const з of ГОРОД.здания) з.квесты = з.квесты.filter(к => !(к.вид === вид && к.ключ === тело.ключ && (вид !== 'вопрос' || к.орган === тело.орган)));
  setTimeout(() => {
    if (итог.город && итог.город.здания) { ГОРОД = итог.город; if (ГОРОД.счёт) СЧЁТ_ДОМА = ГОРОД.счёт; }
    нарисовать(); if (ОТКРЫТ) лист_заполнить();
    const з = где && document.querySelector(вид === 'мысль' ? '.почта .значок' : `.здание[data-орган="${CSS.escape(где.dataset.орган || '')}"] .значок`);
    if (з && !тихо) з.classList.add('тык');
    счёт_показать(true);
  }, тихо ? 0 : 400);
});
function монета(откуда, куда){
  if (тихо || !куда) return;
  const a = откуда.getBoundingClientRect(), bz = (куда.querySelector('.значок') || куда).getBoundingClientRect();
  const м = document.createElement('div'); м.className = 'монета';
  м.style.transform = `translate(${a.left + a.width / 2}px,${a.top + a.height / 2}px)`;
  document.body.appendChild(м);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    м.style.transform = `translate(${bz.left + bz.width / 2}px,${bz.top + bz.height / 2}px) scale(.6)`;
    м.style.opacity = '.2';
  }));
  setTimeout(() => м.remove(), 760);
}

// ---------- загрузка ----------
function туман(текст){ $('туман').hidden = !текст; if (текст) $('туман-текст').textContent = текст; }
async function загрузить(первый){
  if (ЗАНЯТО) return;
  let д;
  try { д = await СВЯЗЬ.грузить(); } catch (e) { if (первый) туман(СВЯЗЬ.молчит || 'Нет связи с Гили — город покажется, когда мак проснётся'); return; }
  const г = д && (д.здания ? д : д.город);
  if (!г || !г.здания || !г.здания.length) {
    if (первый) туман((г && г.ошибка) || 'Город ещё строится: снимок с мака не приехал');
    return;
  }
  туман('');
  ГОРОД = г;
  if (г.счёт) { СЧЁТ_ДОМА = г.счёт; счёт_показать(); }
  if (!ЗАНЯТО) { нарисовать(); if (ОТКРЫТ && !$('список').querySelector('.квест button:disabled')) лист_заполнить(); }
  if (первый) {
    const д = $('даль'), к = ЦЕНТР_X * W;
    д.scrollLeft = Math.max(0, к - innerWidth / 2);
  }
}

// ---------- управление ----------
function выйти(){ try { parent !== window && parent.postMessage('сад:закрыть', location.origin); } catch (e) {} }
$('закрыть').onclick = выйти;
$('лист-закрыть').onclick = закрыть_лист;
$('тень').onclick = закрыть_лист;
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  e.stopPropagation();
  ОТКРЫТ ? закрыть_лист() : выйти();
});
// мышью: колесо и перетаскивание листают луг вбок
const даль = $('даль');
даль.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { даль.scrollLeft += e.deltaY; e.preventDefault(); } }, {passive:false});
let тяну = null;
даль.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse' && !e.target.closest('button')) { тяну = {x:e.clientX, s:даль.scrollLeft}; даль.classList.add('тяну'); } });
addEventListener('pointermove', e => { if (тяну) даль.scrollLeft = тяну.s - (e.clientX - тяну.x); });
addEventListener('pointerup', () => { тяну = null; даль.classList.remove('тяну'); });
addEventListener('resize', () => { мир_размер(); if (ГОРОД) нарисовать(); });

try { if (localStorage.getItem('gili-gorod-знает')) $('подсказка').classList.add('нет'); } catch (e) {}
мир_размер(); счёт_показать();
загрузить(true);
setInterval(() => { if (!document.hidden) загрузить(false); }, 60e3);
</script>
</body></html>
